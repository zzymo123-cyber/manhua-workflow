<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhua Workflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 18h28v20H30l-8 8v-8h-4z' fill='white'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-base: #ffffff;
  --bg-surface: #f8f9fb;
  --bg-elevated: #ffffff;
  --bg-muted: #f1f3f5;
  --text-primary: #1a1d23;
  --text-secondary: #5f6673;
  --text-muted: #737b89;
  --text-on-accent: #ffffff;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-light: #eff6ff;
  --accent-muted: #bfdbfe;
  --success: #22c55e;
  --success-light: #f0fdf4;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --error: #ef4444;
  --error-light: #fef2f2;
  --border: #e5e7eb;
  --border-hover: #d1d5db;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 6px 18px rgba(0,0,0,0.12);
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --overlay-scrim: rgba(0,0,0,0.3);
  --shadow-fab: 0 2px 8px rgba(37,99,235,0.18);
  --warning-dark: #e65100;
  --focus-ring: 0 0 0 3px rgba(37,99,235,0.18);
  --z-agent: 50;
  --z-modal-backdrop: 100;
  --z-modal: 110;
  --z-toast: 120;
  --z-lightbox: 130;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg-base); color: var(--text-primary); height: 100vh;
       display: flex; flex-direction: column; overflow: hidden;
       font-size: var(--text-base); line-height: 1.5; }
button, input, textarea, select { font: inherit; }
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
.hidden { display: none !important; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
[tabindex]:focus-visible, .phase-tab:focus-visible, .asset-card:focus-visible, .scene-card:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
svg.lucide { width: 16px; height: 16px; stroke-width: 2; }
svg.lucide-sm { width: 14px; height: 14px; }
svg.lucide-lg { width: 20px; height: 20px; }

#header { background: var(--bg-surface); border-bottom: 1px solid var(--border);
          padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-4);
          flex-shrink: 0; }
#header h1 { font-size: var(--text-md); font-weight: 600; color: var(--text-primary); }
#header .meta { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer;
                background: none; border: none; padding: 0; }
#header .meta:hover { color: var(--text-primary); }
#header .tasks-badge { background: var(--bg-muted); border-radius: 12px;
                        padding: 3px 10px; font-size: var(--text-sm); color: var(--warning); }
#header .settings-btn { margin-left: auto; background: none; border: none;
                        color: var(--text-secondary); cursor: pointer; padding: var(--space-2) var(--space-3);
                        border-radius: var(--radius-sm); display: flex; align-items: center; }
#header .settings-btn:hover { background: var(--bg-muted); color: var(--accent); }

#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 200px; background: var(--bg-elevated); border-right: 1px solid var(--border);
           display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#phase-tabs { padding: var(--space-2); display: flex; flex-direction: column; gap: 2px;
              border-bottom: 1px solid var(--border); }
.phase-tab { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-sm);
             cursor: pointer; background: var(--bg-base); color: var(--text-secondary);
             border: 1px solid transparent; transition: all 0.15s;
             display: flex; align-items: center; gap: var(--space-2); }
.phase-tab.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent-muted); }
.phase-tab:hover { color: var(--text-primary); background: var(--bg-muted); }
#sidebar-storyboard-list { flex: 1; overflow-y: auto; padding: var(--space-2); }
.episode-group { margin-bottom: var(--space-2); }
.episode-label { font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) var(--space-2); }
.scene-card { background: var(--bg-muted); border-radius: var(--radius-sm); padding: var(--space-2); margin-bottom: 4px;
              cursor: pointer; border: 1px solid transparent; }
.scene-card:hover { background: var(--bg-surface); }
.scene-card.selected { background: var(--accent-light); border-color: var(--accent-muted); }
.scene-card .scene-name { font-size: var(--text-sm); font-weight: 500; margin-bottom: var(--space-1); }
.scene-card .scene-summary { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.35;
                             max-height: 32px; overflow: hidden; margin-bottom: var(--space-1); }
.scene-card .status-row { display: flex; gap: 4px; }
.status-badge { font-size: var(--text-xs); padding: 1px 5px; border-radius: 4px;
                background: var(--bg-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 3px; }
.status-badge.done { color: var(--success); background: var(--success-light); }
.status-badge.progress { color: var(--warning); background: var(--warning-light); }
.status-badge.failed { color: var(--error); background: var(--error-light); }

#stage-progress-wrap { padding: var(--space-2); border-top: 1px solid var(--border); }
#stage-progress-wrap .stage-pipeline { display: flex; align-items: center; gap: 2px; margin-bottom: var(--space-1); flex-wrap: wrap; }
.stage-node { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: 3px; background: var(--bg-muted); color: var(--text-muted); white-space: nowrap; }
.stage-node.active { background: var(--accent-light); color: var(--accent); }
.stage-node.done { background: var(--success-light); color: var(--success); }
.stage-arrow { font-size: var(--text-xs); color: var(--text-muted); }
#progress-bar { height: 4px; background: var(--bg-muted); border-radius: 2px; margin-top: var(--space-1); }
#progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

#content-panel { flex: 1; overflow-y: auto; background: var(--bg-base); display: flex; flex-direction: column; }

#batch-toolbar { background: var(--bg-surface); border-bottom: 1px solid var(--border);
                 padding: var(--space-2) var(--space-4); display: none; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#batch-toolbar.visible { display: flex; }
#batch-toolbar .toolbar-label { font-size: var(--text-sm); color: var(--text-secondary); margin-right: var(--space-1); }
#batch-toolbar .batch-progress { font-size: var(--text-xs); color: var(--warning); margin-left: var(--space-2); }

#grid-area { padding: var(--space-4); display: none; }
#grid-area.visible { display: block; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
.asset-card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: var(--space-3); cursor: pointer;
              border: 1px solid var(--border); transition: all 0.15s; position: relative;
              box-shadow: none; text-align: left; font: inherit; color: inherit; }
.asset-card:hover { background: var(--bg-surface); border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
.asset-card.selected { background: var(--accent-light); border-color: var(--accent); }
.asset-card.failed { border-color: var(--error); }
.asset-card .card-name { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary); }
.asset-card .card-seed { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; max-height: 36px; overflow: hidden; }
.asset-card .card-status { margin-top: var(--space-2); }

.card-thumb { width: 100%; height: 100px; border-radius: 4px; margin-bottom: var(--space-2); background: var(--bg-muted);
              overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-thumb .placeholder { color: var(--text-muted); }
.card-thumb .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--warning);
                       border-radius: 50%; animation: spin 0.8s linear infinite; }
.spin-icon { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#detail-panel { flex: 1; overflow-y: auto; padding: var(--space-5); display: none; }
#detail-panel.visible { display: block; }
#detail-panel h2 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-3); color: var(--text-primary); }
.back-link { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; margin-bottom: var(--space-3);
             display: inline-block; background: none; border: none; padding: 0; }
.back-link:hover { color: var(--accent); }
.empty-state { color: var(--text-muted); font-size: var(--text-base); text-align: center; margin-top: 60px; }
.stage-section { margin-bottom: var(--space-5); }
.stage-section h3 { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
.prompt-editor { width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                 border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); color: var(--text-primary);
                 line-height: 1.6; resize: vertical; min-height: 120px; }
.prompt-editor:focus { outline: none; border-color: var(--accent-muted); box-shadow: var(--focus-ring); }
.img-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--radius-md);
               background: var(--bg-surface); margin-bottom: var(--space-3); }
.preview-wrap { position: relative; display: inline-block; max-width: 100%; }
.preview-zoom-btn { position: absolute; top: 6px; right: 6px; background: rgba(26,29,35,.72);
                    border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;
                    color: var(--text-on-accent); font-size: var(--text-sm); }
.preview-zoom-btn:hover { background: rgba(26,29,35,.88); }
.btn { padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-size: var(--text-sm); cursor: pointer;
       border: none; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-1); }
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-secondary { background: var(--bg-muted); color: var(--text-secondary); }
.btn-secondary:hover { background: var(--bg-surface); color: var(--text-primary); }
.btn-secondary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-danger { background: var(--error); color: var(--text-on-accent); }
.btn-row { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.mode-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
            margin-bottom: var(--space-3); flex-wrap: wrap; }
.mode-label { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 600; }
.segmented-control { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm);
                     background: var(--bg-muted); padding: 2px; gap: 2px; }
.segmented-control button { border: 0; background: transparent; color: var(--text-secondary);
                            border-radius: 4px; padding: 5px var(--space-3); cursor: pointer;
                            font-size: var(--text-sm); }
.segmented-control button.active { background: var(--bg-elevated); color: var(--accent); box-shadow: var(--shadow-sm); }
.video-part-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
                   padding: var(--space-3); margin-bottom: var(--space-2); }
.video-part-card .part-header { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-2); }
.video-preview { width: 100%; max-height: 300px; border-radius: var(--radius-md); margin-bottom: var(--space-2); }
.video-prompt-editor { min-height: 80px; }
.storyboard-browser { display: flex; flex-direction: column; gap: var(--space-3); }
.storyboard-browser-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
                             flex-wrap: wrap; }
.storyboard-browser-header h2 { margin: 0; }
.storyboard-search { min-width: 240px; flex: 0 1 360px; border: 1px solid var(--border);
                     border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
                     background: var(--bg-base); color: var(--text-primary); }
.storyboard-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-3); }
.storyboard-column { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface);
                     min-width: 0; }
.storyboard-column-title { padding: var(--space-3); border-bottom: 1px solid var(--border);
                           font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary); }
.storyboard-overview-card { width: 100%; text-align: left; display: flex; flex-direction: column; gap: var(--space-2);
                            padding: var(--space-3); border: 0; border-bottom: 1px solid var(--border);
                            background: var(--bg-elevated); color: inherit; cursor: pointer; }
.storyboard-overview-card:last-child { border-bottom: 0; }
.storyboard-overview-card:hover { background: var(--accent-light); }
.storyboard-overview-card h3 { font-size: var(--text-base); margin: 0; color: var(--text-primary); }
.storyboard-overview-meta { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.storyboard-overview-summary { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.45; }
.story-input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }
.story-input-field label { display: block; font-size: var(--text-sm); font-weight: 600;
                           color: var(--text-secondary); margin-bottom: var(--space-1); }
.story-input-field textarea { min-height: 74px; }
.story-input-field.full { grid-column: 1 / -1; }
.script-readonly { background: var(--bg-muted); border: 1px solid var(--border); border-radius: var(--radius-md);
                   padding: var(--space-3); font-size: var(--text-sm); color: var(--text-secondary);
                   line-height: 1.55; max-height: 150px; overflow: auto; white-space: pre-wrap; }
.shot-plan-editor { min-height: 220px; font-family: var(--font-mono); font-size: var(--text-xs); }

.modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay-scrim);
                  z-index: var(--z-modal-backdrop); justify-content: center; align-items: center; padding: var(--space-4); }
.modal-overlay.visible { display: flex; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
         padding: var(--space-6); width: 440px; max-width: 100%; max-height: calc(100vh - var(--space-8));
         overflow-y: auto; box-shadow: var(--shadow-lg); z-index: var(--z-modal); }
.modal.modal-wide { width: 500px; }
.modal h2 { font-size: var(--text-lg); color: var(--text-primary); margin-bottom: var(--space-4); }
.modal label { display: block; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-1); margin-top: var(--space-3); }
.modal label:first-child, .modal .label-first { margin-top: 0; }
.modal input { width: 100%; background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); }
.modal input:focus { outline: none; border-color: var(--accent-muted); box-shadow: var(--focus-ring); }
.modal .btn-row { margin-top: var(--space-5); justify-content: flex-end; }
.settings-section { border-top: 1px solid var(--border); margin-top: var(--space-4); padding-top: var(--space-3); }
.settings-section-first { border-top: 0; margin-top: 0; padding-top: 0; }
.settings-input-row { display: flex; align-items: center; gap: var(--space-2); }
.settings-input-row input { flex: 1; min-width: 0; }
.settings-clear-btn { width: 34px; height: 34px; padding: 0; justify-content: center; flex-shrink: 0; }
.settings-clear-btn[aria-pressed="true"] { background: var(--error-light); color: var(--error); }
.confirm-message { color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.6; }

#agent-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px;
               background: var(--bg-elevated); border-left: 1px solid var(--border);
               display: flex; flex-direction: column; z-index: var(--z-agent);
               transform: translateX(100%);
               box-shadow: var(--shadow-lg); visibility: hidden; pointer-events: none; }
#agent-panel.open { transform: translateX(0); visibility: visible; pointer-events: auto; }
#agent-panel-header { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border);
                       display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#agent-panel-header span { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); flex: 1; }
#agent-clear { background: none; border: 1px solid var(--border); border-radius: 5px;
               color: var(--text-muted); font-size: var(--text-xs); padding: 3px var(--space-2); cursor: pointer; }
#agent-clear:hover { color: var(--text-secondary); border-color: var(--border-hover); }
#agent-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: var(--space-1) var(--space-2); line-height: 1;
               display: flex; align-items: center; }
#agent-close:hover { color: var(--text-secondary); }
#agent-messages { flex: 1; overflow-y: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.amsg-user { align-self: flex-end; background: var(--accent-light); border-radius: 10px 10px 2px 10px;
             padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; }
.amsg-assistant { align-self: flex-start; background: var(--bg-muted); border-radius: 10px 10px 10px 2px;
                  padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; line-height: 1.5; }
.amsg-tool { align-self: flex-start; display: flex; align-items: center; gap: var(--space-2);
             font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0; }
.amsg-tool .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.amsg-tool.ok .tool-dot { background: var(--success); }
.amsg-tool.fail .tool-dot { background: var(--error); }
.amsg-thinking { align-self: flex-start; font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0;
                  display: flex; align-items: center; gap: var(--space-2); }
.amsg-thinking .dots span { animation: blink 1.2s infinite; display: inline-block; }
.amsg-thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
.amsg-thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
#agent-input-row { padding: var(--space-3) var(--space-3); border-top: 1px solid var(--border); display: flex; gap: var(--space-2); flex-shrink: 0; }
#agent-input { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); resize: none; height: 36px;
               line-height: 1.4; }
#agent-input:focus { outline: none; border-color: var(--accent-muted); }
#agent-input:disabled { opacity: 0.5; }
#agent-send { background: var(--accent); color: var(--text-on-accent); border: none; border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-4); font-size: var(--text-sm); cursor: pointer; white-space: nowrap; }
#agent-send:hover { background: var(--accent-hover); }
#agent-send:disabled { background: var(--bg-muted); cursor: not-allowed; }
#agent-fab { position: fixed; right: var(--space-4); bottom: 20px; background: var(--accent); color: var(--text-on-accent);
             border: none; border-radius: 50%; width: 44px; height: 44px;
             cursor: pointer; box-shadow: var(--shadow-fab); z-index: calc(var(--z-agent) - 1);
             display: flex; align-items: center; justify-content: center; }
#agent-fab:hover { background: var(--accent-hover); }
#agent-fab.hidden { display: none; }
.warn-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning); margin-bottom: var(--space-3); }
.block-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning-dark); margin-bottom: var(--space-3); }
.error-banner { background: var(--error-light); border: 1px solid var(--error); border-radius: var(--radius-sm);
                padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--error); margin-bottom: var(--space-3); }
#toast-container { position: fixed; top: 16px; right: 16px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: var(--radius-sm); font-size: var(--text-sm); box-shadow: var(--shadow-md);
         animation: toast-in 0.25s ease; max-width: 360px; }
.toast.success { background: var(--success-light); border: 1px solid var(--success); color: #166534; }
.toast.error { background: var(--error-light); border: 1px solid var(--error); color: #991b1b; }
.toast.info { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.recent-project-item { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
                        padding: var(--space-2) var(--space-3); cursor: pointer; display: flex; align-items: center; gap: var(--space-3);
                        width: 100%; font: inherit; text-align: left; }
.recent-project-item:hover { background: var(--bg-surface); border-color: var(--accent-muted); }
.recent-project-item .rp-name { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
.recent-project-item .rp-path { font-size: var(--text-xs); color: var(--text-muted); flex: 1; overflow: hidden;
                                  text-overflow: ellipsis; white-space: nowrap; }
.recent-loading { font-size: var(--text-xs); color: var(--text-muted); }

/* Template editor */
.template-editor-wrap { padding: var(--space-5); display: flex; flex-direction: column; height: 100%; }
.template-editor-wrap h2 { font-size: var(--text-lg); color: var(--text-primary); margin-bottom: var(--space-4); }
.template-type-select { width: 100%; background: var(--bg-base); border: 1px solid var(--border);
                        border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
                        font-size: var(--text-sm); color: var(--text-primary); margin-bottom: var(--space-3); }
.template-type-select:focus { outline: none; border-color: var(--accent-muted); }
.template-textarea { flex: 1; width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                     border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm);
                     color: var(--text-primary); line-height: 1.6; resize: none; font-family: var(--font-mono); }
.template-textarea:focus { outline: none; border-color: var(--accent-muted); }

.import-preview-box { display: none; margin-top: var(--space-3); background: var(--bg-surface);
                      border: 1px solid var(--border); border-radius: var(--radius-sm);
                      padding: 10px 14px; font-size: var(--text-sm); line-height: 1.8; color: var(--text-secondary); }
.import-preview-title { color: var(--text-primary); }
.import-preview-path { color: var(--text-muted); font-size: var(--text-xs); }
.import-recent-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.field-row { display: flex; gap: 6px; margin-top: 4px; }
.field-row input { flex: 1; }
.modal-actions { margin-top: var(--space-4); justify-content: flex-end; }
.template-actions { display: flex; gap: var(--space-3); margin-top: var(--space-3); }
.template-actions button { flex: 1; }
.template-toast { display: none; margin-top: var(--space-2); text-align: center; color: var(--success); font-size: var(--text-sm); }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: var(--z-lightbox);
            cursor: zoom-out; display: none; align-items: center; justify-content: center; padding: var(--space-4); }
#lightbox.visible { display: flex; }
#lightbox-img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius-sm); }

@media (max-width: 760px) {
  body { overflow: hidden; height: 100dvh; min-height: 100dvh; }
  #header { flex-wrap: wrap; gap: var(--space-2); padding: var(--space-2) var(--space-3); }
  #header .settings-btn { margin-left: 0; }
  #main { flex-direction: column; min-height: 0; }
  #sidebar { width: 100%; min-height: 150px; max-height: 40dvh; border-right: 0; border-bottom: 1px solid var(--border); }
  #phase-tabs { flex-direction: row; overflow-x: auto; }
  .phase-tab { min-height: 44px; white-space: nowrap; }
  #sidebar-storyboard-list { min-height: 72px; }
  #stage-progress-wrap { padding: var(--space-2) var(--space-3); }
  #content-panel { flex: 1; min-height: 0; }
  #batch-toolbar { flex-wrap: wrap; align-items: flex-start; padding: var(--space-2) var(--space-3); }
  #batch-toolbar .btn { flex: 1 1 140px; justify-content: center; }
  #grid-area { padding: var(--space-3); }
  .asset-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  #detail-panel { padding: var(--space-3); }
  .modal-overlay { align-items: flex-start; overflow-y: auto; padding: var(--space-3); }
  .modal { max-height: calc(100dvh - 24px); padding: var(--space-4); }
  #agent-panel { width: min(100vw, 380px); }
  #toast-container { left: 16px; right: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

<script>
let state = {
  projectPath: null,   // 完整绝对路径，传给后端
  projectName: null,   // 显示名称（短名）
  pipeline: null,
  currentPhase: 'characters',
  selectedScene: null,
  chatHistory: [],
  batchRunning: false,
  templateCache: null,
  templateType: 'character',
  storyboardPromptMode: 'v1',
  videoPromptMode: 'v1',
  storyboardPage: 1,
  storyboardSearch: '',
};

function projectPathParam() {
  return `project_path=${encodeURIComponent(state.projectPath)}`;
}

function createIcon(name, className = '') {
  const icon = document.createElement('i');
  icon.dataset.lucide = name;
  if (className) icon.className = className;
  return icon;
}

function createStatusBadge(status, labelPrefix = '') {
  const badge = document.createElement('span');
  badge.className = `status-badge ${statusClass(status)}`;
  if (labelPrefix) badge.append(document.createTextNode(labelPrefix));
  badge.append(createStatusIcon(status), document.createTextNode(` ${status || 'needed'}`));
  return badge;
}

function createStatusIcon(status) {
  const names = {
    completed: 'check',
    submitted: 'loader',
    failed: 'x',
    needed: 'circle',
    pending: 'circle',
  };
  const icon = createIcon(names[status] || 'minus', 'lucide-sm');
  if (status === 'submitted') icon.classList.add('spin-icon');
  return icon;
}

function createBanner(className, text) {
  const banner = document.createElement('div');
  banner.className = className;
  banner.textContent = text;
  return banner;
}

function createErrorBanner(message) {
  return createBanner('error-banner', `失败原因：${message}`);
}

function createWarnBanner(message) {
  return createBanner('warn-banner', message);
}

function assetFileUrl(filePath, preview = false) {
  return `/api/asset-file?${projectPathParam()}&file_path=${encodeURIComponent(filePath)}${preview ? '&preview=true' : ''}`;
}

function createAssetImage(filePath, className = '') {
  const img = document.createElement('img');
  img.src = assetFileUrl(filePath, true);
  if (className) img.className = className;
  img.alt = '';
  img.addEventListener('error', () => {
    img.style.display = 'none';
  });
  return img;
}

function createImagePreview(filePath) {
  const imgUrl = assetFileUrl(filePath);
  const imgWrap = document.createElement('div');
  imgWrap.className = 'preview-wrap';
  imgWrap.appendChild(createAssetImage(filePath, 'img-preview'));
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'preview-zoom-btn';
  button.textContent = '放大';
  button.addEventListener('click', () => openLightbox(imgUrl));
  imgWrap.appendChild(button);
  return imgWrap;
}

function getStoryboardPages(board) {
  return getStoryboardOutputs(board, 'v2');
}

function getStoryboardOutputs(board, mode = state.storyboardPromptMode) {
  const version = board.board_versions?.[mode] || {};
  if (Array.isArray(version.outputs) && version.outputs.length > 0) return version.outputs;
  if (mode === 'v2' && Array.isArray(version.pages) && version.pages.length > 0) return version.pages;
  if (mode === 'v1') {
    return [{
      id: 'v1_main',
      label: 'v1 主图',
      page: 1,
      shot_plan: board.shot_plan || version.shot_plan || {},
      board_status: board.board_status || version.board_status || 'needed',
      draft_prompt: board.draft_prompt || version.draft_prompt || '',
      board_error: board.board_error || version.board_error || '',
      video_parts: board.video_parts || version.video_parts || [],
      video_duration: board.video_duration || version.video_duration,
      video_ratio: board.video_ratio || version.video_ratio,
    }];
  }
  return [];
}

function getStoryboardTarget(board, mode = state.storyboardPromptMode, page = state.storyboardPage) {
  const outputs = getStoryboardOutputs(board, mode);
  if (mode === 'v1') return outputs.find(item => item.id === 'v1_main') || outputs[0] || {};
  return outputs.find(item => item.page === page) || outputs[0] || {};
}

function getCurrentPageForBoard(board) {
  const pages = getStoryboardPages(board);
  if (!pages.some(item => item.page === state.storyboardPage)) {
    state.storyboardPage = pages[0]?.page || 1;
  }
  return state.storyboardPage;
}

function storyboardImagePath(sceneKey, mode = state.storyboardPromptMode, page = state.storyboardPage) {
  return mode === 'v1' ? `storyboards/${sceneKey}/${sceneKey}.png` : `storyboards/${sceneKey}/${mode}_p${page || 1}.png`;
}

async function init() {
  const saved = localStorage.getItem('manhua_project_path');
  if (saved) { await loadProject(saved); }
  else { openImportDialog(); }
}

async function loadProject(projectPath) {
  try {
    const resp = await fetch('/api/project/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_path: projectPath})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      showError(`加载失败：${e.detail || '未找到 pipeline.json'}`);
      localStorage.removeItem('manhua_project_path');
      openImportDialog();
      return;
    }
    state.projectPath = projectPath;
    state.templateCache = null;
    state.pipeline = await resp.json();
    state.projectName = state.pipeline.project || projectPath.split(/[/\\]/).pop();
    localStorage.setItem('manhua_project_path', projectPath);
    renderAll();
    startPolling();
  } catch(e) { showError('加载失败：' + e.message); }
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!state.projectPath) return;
    // 没有 submitted 任务时停止轮询，避免页面抖动
    if (!hasSubmittedTasks()) { stopPolling(); return; }
    try {
      const resp = await fetch(`/api/project/status?${projectPathParam()}`);
      if (resp.ok) {
        const newData = await resp.json();
        const keys = ['assets', 'storyboards'];
        const changed = keys.some(k => JSON.stringify(state.pipeline?.[k]) !== JSON.stringify(newData[k]));
        state.pipeline = newData;
        if (changed) renderAll();
      }
    } catch(e) {}
  }, 5000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function hasSubmittedTasks() {
  const p = state.pipeline;
  if (!p) return false;
  for (const v of Object.values(p.assets?.characters || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.scenes || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.props || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.storyboards || {})) {
    if (v.board_status === 'submitted') return true;
    for (const vp of v.video_parts || []) if (vp.video_status === 'submitted') return true;
    for (const mode of ['v1', 'v2', 'v3', 'v4']) {
      for (const output of getStoryboardOutputs(v, mode)) {
        if (output.board_status === 'submitted') return true;
        for (const vp of output.video_parts || []) if (vp.video_status === 'submitted') return true;
      }
    }
  }
  return false;
}

// ── 依赖检查 ──
function getDependencyInfo() {
  const p = state.pipeline;
  if (!p) return { storyboardBlocked: true, storyboardReason: '', videoBlocked: true, videoReason: '' };

  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;

  const storyboardBlocked = charDone === 0 || sceneDone === 0;
  let storyboardReason = '';
  if (charDone === 0) storyboardReason += '至少需要1个角色已完成';
  if (charDone === 0 && sceneDone === 0) storyboardReason += '，';
  if (sceneDone === 0) storyboardReason += '至少需要1个场景已完成';

  return { storyboardBlocked, storyboardReason, videoBlocked: false, videoReason: '',
           charDone, charTotal, sceneDone, sceneTotal };
}

async function ensureRequiredApiKey(kind) {
  try {
    const resp = await fetch('/api/settings');
    if (!resp.ok) throw new Error(resp.status);
    const settings = await resp.json();
    const required = {
      vidu: { ok: settings._has_vidu, label: 'Vidu' },
      wetoken: { ok: settings._has_wetoken, label: 'Wetoken' },
      idealab: { ok: settings._has_idealab, label: 'ideaLAB' },
      github: { ok: settings._has_gh, label: 'GitHub 素材上传配置' },
    }[kind];
    if (!required?.ok) {
      const message = kind === 'github'
        ? '缺少 GitHub 素材上传配置，请先在设置中填写 Token、Owner 和 Repo'
        : `缺少 ${required?.label || kind} API Key，请先在设置中配置`;
      showToast(message, 'error');
      return false;
    }
    return true;
  } catch(e) {
    showToast('无法读取 API 设置：' + e.message, 'error');
    return false;
  }
}

function getStoryboardReferenceIssues(board) {
  const p = state.pipeline;
  const issues = [];
  for (const char of (board.characters_in_scene || [])) {
    const info = p.assets?.characters?.[char];
    if (!info || info.status !== 'completed') issues.push(`角色「${char}」未完成`);
  }
  if (board.scene_location) {
    const scene = p.assets?.scenes?.[board.scene_location] || p.assets?.props?.[board.scene_location];
    if (!scene || scene.status !== 'completed') issues.push(`场景/道具「${board.scene_location}」未完成`);
  }
  return issues;
}

function showReferenceIssues(issues) {
  if (!issues.length) return false;
  const preview = issues.slice(0, 3).join('，');
  const suffix = issues.length > 3 ? ` 等 ${issues.length} 项` : '';
  showToast(`前置参考未完成：${preview}${suffix}`, 'error', 5000);
  return true;
}

function renderAll() {
  if (!state.pipeline) return;
  const p = state.pipeline;
  const totalScenes = Object.keys(p.storyboards || {}).length;
  document.getElementById('project-meta').textContent = `${p.project} · ${totalScenes} 场景`;

  let inProgress = 0;
  for (const [,v] of Object.entries(p.assets?.characters || {})) if (v.status === 'submitted') inProgress++;
  for (const [,v] of Object.entries(p.assets?.scenes || {})) if (v.status === 'submitted') inProgress++;
  for (const [,v] of Object.entries(p.storyboards || {})) {
    for (const mode of ['v1', 'v2', 'v3', 'v4']) {
      for (const output of getStoryboardOutputs(v, mode)) {
        if (output.board_status === 'submitted') inProgress++;
        for (const vp of output.video_parts || []) if (vp.video_status === 'submitted') inProgress++;
      }
    }
  }
  const badge = document.getElementById('tasks-badge');
  if (inProgress > 0) {
    badge.classList.remove('hidden');
    badge.textContent = `${inProgress} 任务进行中`;
  } else {
    badge.classList.add('hidden');
  }

  document.querySelectorAll('.phase-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.phase === state.currentPhase);
  });

  renderSidebarList();
  renderMainArea();
  updateStageProgress();
  lucide.createIcons();
}

function renderSidebarList() {
  const container = document.getElementById('sidebar-storyboard-list');
  container.replaceChildren();
  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') return;

  const p = state.pipeline;
  const byEpisode = {};
  for (const [key, board] of Object.entries(p.storyboards || {})) {
    const ep = board.episode || 1;
    if (!byEpisode[ep]) byEpisode[ep] = [];
    byEpisode[ep].push({key, board});
  }
  for (const ep of Object.keys(byEpisode).sort((a,b) => a-b)) {
    const group = document.createElement('div');
    group.className = 'episode-group';
    const label = document.createElement('div');
    label.className = 'episode-label';
    label.textContent = `第 ${ep} 集`;
    group.appendChild(label);
    for (const {key, board} of byEpisode[ep]) {
      const target = state.currentPhase === 'video_prompts'
        ? getStoryboardTarget(board, state.videoPromptMode, state.storyboardPage)
        : getStoryboardTarget(board, state.storyboardPromptMode, state.storyboardPage);
      const card = document.createElement('div');
      card.className = 'scene-card' + (state.selectedScene === key ? ' selected' : '');
      const vidParts = target.video_parts || [];
      const vidDone = vidParts.filter(x => x.video_status === 'completed').length;
      const name = document.createElement('div');
      name.className = 'scene-name';
      name.textContent = board.script_title || key;
      const summary = document.createElement('div');
      summary.className = 'scene-summary';
      summary.textContent = summarizeScript(board.script_segment || '', 42);
      const statusRow = document.createElement('div');
      statusRow.className = 'status-row';
      statusRow.appendChild(createStatusBadge(target.board_status, '板'));
      if (state.currentPhase === 'video_prompts') {
        const videoBadge = document.createElement('span');
        videoBadge.className = `status-badge ${vidParts.length > 0 && vidDone === vidParts.length ? 'done' : ''}`;
        videoBadge.textContent = `视 ${vidDone}/${vidParts.length}`;
        statusRow.appendChild(videoBadge);
      }
      card.append(name, summary, statusRow);
      card.addEventListener('click', () => { state.selectedScene = key; renderMainArea(); });
      group.appendChild(card);
    }
    container.appendChild(group);
  }
}

function renderMainArea() {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');

  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') {
    // 角色和场景阶段：显示批量工具栏 + 网格
    toolbar.classList.add('visible');
    updateToolbarButtons();
    emptyHint.style.display = 'none';
    if (state.selectedScene) {
      gridArea.classList.remove('visible');
      detailPanel.classList.add('visible');
      toolbar.classList.remove('visible');
      renderDetail(state.selectedScene);
    } else {
      detailPanel.classList.remove('visible');
      gridArea.classList.add('visible');
      renderAssetGrid(gridArea);
    }
  } else if (state.currentPhase === 'templates') {
    toolbar.classList.remove('visible');
    gridArea.classList.remove('visible');
    emptyHint.style.display = 'none';
    detailPanel.classList.add('visible');
    renderTemplateEditor(detailPanel);
  } else {
    // 故事板/视频阶段
    if (state.selectedScene) {
      toolbar.classList.remove('visible');
      gridArea.classList.remove('visible');
      emptyHint.style.display = 'none';
      detailPanel.classList.add('visible');
      renderDetail(state.selectedScene);
    } else {
      toolbar.classList.remove('visible');
      gridArea.classList.add('visible');
      detailPanel.classList.remove('visible');
      emptyHint.style.display = '';
      emptyHint.style.display = 'none';
      renderStoryboardOverview(gridArea);
    }
  }
}

function renderStoryboardOverview(container) {
  const p = state.pipeline;
  const boards = Object.entries(p.storyboards || {});
  const wrap = document.createElement('div');
  wrap.className = 'storyboard-browser';

  const header = document.createElement('div');
  header.className = 'storyboard-browser-header';
  const title = document.createElement('h2');
  title.textContent = state.currentPhase === 'video_prompts' ? '视频分段检索' : '故事板检索';
  const search = document.createElement('input');
  search.className = 'storyboard-search';
  search.type = 'search';
  search.placeholder = '搜索剧情、角色、场景';
  search.value = state.storyboardSearch;
  search.addEventListener('input', () => {
    state.storyboardSearch = search.value;
    renderStoryboardOverview(container);
  });
  header.append(title, search);

  const query = state.storyboardSearch.trim().toLowerCase();
  const filtered = boards.filter(([, board]) => {
    if (!query) return true;
    return [
      board.script_title || '',
      board.script_segment || '',
      board.scene_location || '',
      ...(board.characters_in_scene || []),
    ].join(' ').toLowerCase().includes(query);
  });

  const columns = document.createElement('div');
  columns.className = 'storyboard-columns';
  const byEpisode = {};
  for (const [key, board] of filtered) {
    const ep = board.episode || 1;
    if (!byEpisode[ep]) byEpisode[ep] = [];
    byEpisode[ep].push({key, board});
  }

  for (const ep of Object.keys(byEpisode).sort((a,b) => Number(a) - Number(b))) {
    const column = document.createElement('section');
    column.className = 'storyboard-column';
    const label = document.createElement('div');
    label.className = 'storyboard-column-title';
    label.textContent = `第 ${ep} 集`;
    column.appendChild(label);
    for (const {key, board} of byEpisode[ep]) {
      column.appendChild(createStoryboardOverviewCard(key, board));
    }
    columns.appendChild(column);
  }

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '没有匹配的故事板条目';
    columns.appendChild(empty);
  }
  wrap.append(header, columns);
  container.replaceChildren(wrap);
}

function createStoryboardOverviewCard(key, board) {
  const target = state.currentPhase === 'video_prompts'
    ? getStoryboardTarget(board, state.videoPromptMode, state.storyboardPage)
    : getStoryboardTarget(board, state.storyboardPromptMode, state.storyboardPage);
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'storyboard-overview-card';
  card.addEventListener('click', () => {
    state.selectedScene = key;
    renderMainArea();
  });

  const title = document.createElement('h3');
  title.textContent = board.script_title || key;
  const meta = document.createElement('div');
  meta.className = 'storyboard-overview-meta';
  meta.appendChild(createStatusBadge(target.board_status, '板'));
  if (board.scene_location) {
    const scene = document.createElement('span');
    scene.className = 'status-badge';
    scene.textContent = board.scene_location;
    meta.appendChild(scene);
  }
  const chars = (board.characters_in_scene || []).slice(0, 3);
  for (const char of chars) {
    const badge = document.createElement('span');
    badge.className = 'status-badge';
    badge.textContent = char;
    meta.appendChild(badge);
  }
  if (state.currentPhase === 'video_prompts') {
    const parts = target.video_parts || [];
    const done = parts.filter(p => p.video_status === 'completed').length;
    const badge = document.createElement('span');
    badge.className = `status-badge ${parts.length > 0 && done === parts.length ? 'done' : ''}`;
    badge.textContent = `视频 ${done}/${parts.length}`;
    meta.appendChild(badge);
  }

  const summary = document.createElement('div');
  summary.className = 'storyboard-overview-summary';
  summary.textContent = summarizeScript(board.script_segment || '', 110);
  card.append(title, meta, summary);
  return card;
}

function summarizeScript(text, maxLen = 80) {
  const cleaned = text
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
  if (!cleaned) return '暂无剧情摘要';
  return cleaned.length > maxLen ? cleaned.slice(0, maxLen - 1) + '…' : cleaned;
}

function renderTemplateEditor(container) {
  const TYPES = [
    { key: 'character', label: '角色' },
    { key: 'scene', label: '场景' },
    { key: 'prop', label: '道具' },
    { key: 'storyboard', label: '故事板' },
    { key: 'storyboard_v2', label: '故事板 v2' },
    { key: 'video', label: '视频' },
    { key: 'video_v2', label: '视频 v2' },
  ];

  const wrap = document.createElement('div');
  wrap.className = 'template-editor-wrap';
  const title = document.createElement('h2');
  title.textContent = '提示词模板';
  const select = document.createElement('select');
  select.className = 'template-type-select';
  select.id = 'tmpl-type-select';
  for (const type of TYPES) {
    const option = document.createElement('option');
    option.value = type.key;
    option.textContent = type.label;
    option.selected = state.templateType === type.key;
    select.appendChild(option);
  }
  const textarea = document.createElement('textarea');
  textarea.className = 'template-textarea';
  textarea.id = 'tmpl-textarea';
  textarea.placeholder = '加载中...';
  const actions = document.createElement('div');
  actions.className = 'template-actions';
  const reset = document.createElement('button');
  reset.type = 'button';
  reset.className = 'btn btn-secondary';
  reset.id = 'tmpl-reset-btn';
  reset.textContent = '重置默认';
  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'btn btn-primary';
  save.id = 'tmpl-save-btn';
  save.textContent = '保存';
  actions.append(reset, save);
  const toast = document.createElement('div');
  toast.id = 'tmpl-toast';
  toast.className = 'template-toast';
  wrap.append(title, select, textarea, actions, toast);
  container.replaceChildren(wrap);

  const selectEl = document.getElementById('tmpl-type-select');
  const textareaEl = document.getElementById('tmpl-textarea');
  const resetBtn = document.getElementById('tmpl-reset-btn');
  const saveBtn = document.getElementById('tmpl-save-btn');
  const toastEl = document.getElementById('tmpl-toast');

  // load templates from API
  async function loadTemplates() {
    try {
      const resp = await fetch(`/api/project/prompt-templates?${projectPathParam()}`);
      if (!resp.ok) throw new Error('加载失败');
      state.templateCache = await resp.json();
      textareaEl.value = state.templateCache[state.templateType] || '';
      textareaEl.placeholder = '（无内容）';
    } catch (e) {
      textareaEl.value = '';
      textareaEl.placeholder = '加载失败';
    }
  }

  selectEl.addEventListener('change', () => {
    state.templateType = selectEl.value;
    textareaEl.value = state.templateCache ? (state.templateCache[state.templateType] || '') : '';
  });

  saveBtn.addEventListener('click', async () => {
    if (!state.templateCache) return;
    state.templateCache[state.templateType] = textareaEl.value;
    try {
      const resp = await fetch(`/api/project/prompt-templates?${projectPathParam()}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [state.templateType]: textareaEl.value }),
      });
      if (!resp.ok) throw new Error('保存失败');
      toastEl.textContent = '已保存';
      toastEl.style.display = '';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
    } catch (e) {
      showError('保存失败：' + e.message);
    }
  });

  resetBtn.addEventListener('click', async () => {
    const confirmed = await confirmAction({
      title: '重置模板',
      message: '当前模板内容会被默认模板覆盖。此操作不会影响已经生成的提示词草稿。',
      confirmLabel: '重置默认',
    });
    if (!confirmed) return;
    try {
      const resp = await fetch(`/api/project/prompt-templates?${projectPathParam()}&defaults=true`);
      if (!resp.ok) throw new Error('获取默认失败');
      const defaults = await resp.json();
      textareaEl.value = defaults[state.templateType] || '';
      state.templateCache[state.templateType] = textareaEl.value;
      // also save the reset value
      const putResp = await fetch(`/api/project/prompt-templates?${projectPathParam()}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [state.templateType]: textareaEl.value }),
      });
      if (!putResp.ok) throw new Error('写入失败');
      toastEl.textContent = '已重置为默认';
      toastEl.style.display = '';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
    } catch (e) {
      showError('重置失败：' + e.message);
    }
  });

  loadTemplates();
}

// ── 阶段进度条 (#3) ──
function updateStageProgress() {
  const p = state.pipeline;
  if (!p) return;

  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;
  let boardTotal = 0, boardDone = 0;
  let vidTotal = 0, vidDone = 0;
  for (const board of Object.values(p.storyboards || {})) {
    if (state.storyboardPromptMode === 'v2') {
      const pages = getStoryboardPages(board);
      boardTotal += pages.length;
      boardDone += pages.filter(page => page.board_status === 'completed').length;
    } else {
      const v1 = getStoryboardTarget(board, 'v1');
      boardTotal++;
      if ((v1.board_status || board.board_status) === 'completed') boardDone++;
    }
    const videoTarget = state.videoPromptMode === 'v2'
      ? getStoryboardPages(board).find(page => page.page === state.storyboardPage) || getStoryboardPages(board)[0] || {}
      : getStoryboardTarget(board, 'v1');
    for (const vp of videoTarget.video_parts || []) { vidTotal++; if (vp.video_status === 'completed') vidDone++; }
  }

  const stages = [
    { label: `角色 ${charDone}/${charTotal}`, done: charDone, total: charTotal, phase: 'characters' },
    { label: `场景 ${sceneDone}/${sceneTotal}`, done: sceneDone, total: sceneTotal, phase: 'scenes_props' },
    { label: `故事板 ${boardDone}/${boardTotal}`, done: boardDone, total: boardTotal, phase: 'storyboards' },
    { label: `视频 ${vidDone}/${vidTotal || '-'}`, done: vidDone, total: vidTotal, phase: 'video_prompts' },
  ];

  const pipeline = document.getElementById('stage-pipeline');
  pipeline.replaceChildren();
  stages.forEach((s, i) => {
    const cls = s.total > 0 && s.done === s.total ? 'done' : (state.currentPhase === s.phase ? 'active' : '');
    const node = document.createElement('span');
    node.className = `stage-node ${cls}`;
    node.textContent = s.label;
    pipeline.appendChild(node);
    if (i < stages.length - 1) {
      const arrow = document.createElement('span');
      arrow.className = 'stage-arrow';
      arrow.textContent = '→';
      pipeline.appendChild(arrow);
    }
  });

  // 总体进度条
  const totalAll = charTotal + sceneTotal + boardTotal + vidTotal;
  const doneAll = charDone + sceneDone + boardDone + vidDone;
  const pct = totalAll > 0 ? Math.round(doneAll / totalAll * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── 卡片图片显示 (#2) ──
function renderAssetGrid(container) {
  const p = state.pipeline;
  const isChar = state.currentPhase === 'characters';
  const assets = isChar
    ? p.assets?.characters || {}
    : {...(p.assets?.scenes || {}), ...(p.assets?.props || {})};
  const category = isChar ? 'characters' : 'scenes_props';

  const grid = document.createElement('div');
  grid.className = 'asset-grid';
  for (const [name, info] of Object.entries(assets)) {
    const seedPreview = (info.seed || '').split('\n').slice(0,3).join(' ').substring(0, 60);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'asset-card' + (info.status === 'failed' ? ' failed' : '');
    card.addEventListener('click', () => selectAsset(name));

    const thumb = document.createElement('div');
    thumb.className = 'card-thumb';
    if (info.status === 'completed') {
      thumb.appendChild(createAssetImage(`${category}/${name}/${name}.png`));
    } else if (info.status === 'submitted') {
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      thumb.appendChild(spinner);
    } else {
      thumb.appendChild(createIcon('image', 'lucide-lg'));
    }

    const cardName = document.createElement('div');
    cardName.className = 'card-name';
    cardName.textContent = name;
    const cardSeed = document.createElement('div');
    cardSeed.className = 'card-seed';
    cardSeed.textContent = seedPreview;
    const cardStatus = document.createElement('div');
    cardStatus.className = 'card-status';
    cardStatus.appendChild(createStatusBadge(info.status));
    card.append(thumb, cardName, cardSeed, cardStatus);
    grid.appendChild(card);
  }
  container.replaceChildren(grid);
}

// ── 批量工具栏按钮状态 (#1) ──
function updateToolbarButtons() {
  const items = getPhaseItems();
  const needGen = items.filter(i => !i.draft_prompt && i.status === 'needed');
  const canSubmit = items.filter(i => i.draft_prompt && i.status === 'needed');
  const failed = items.filter(i => i.status === 'failed');

  document.getElementById('btn-batch-gen').disabled = state.batchRunning || needGen.length === 0;
  document.getElementById('btn-batch-submit').disabled = state.batchRunning || canSubmit.length === 0;
  document.getElementById('btn-batch-retry').disabled = state.batchRunning || failed.length === 0;

  const label = state.currentPhase === 'characters' ? '角色' : '场景';
  document.getElementById('toolbar-label').textContent = `${label}批量操作`;
}

function getPhaseItems() {
  const p = state.pipeline;
  if (state.currentPhase === 'characters') {
    return Object.entries(p.assets?.characters || {}).map(([name, info]) => ({name, ...info, _type: 'character'}));
  } else {
    const scenes = Object.entries(p.assets?.scenes || {}).map(([name, info]) => ({name, ...info, _type: 'scene'}));
    const props = Object.entries(p.assets?.props || {}).map(([name, info]) => ({name, ...info, _type: 'prop'}));
    return [...scenes, ...props];
  }
}

// ── 批量操作逻辑 (#1) ──
async function batchGeneratePrompts() {
  if (state.batchRunning) return;
  if (!await ensureRequiredApiKey('idealab')) return;
  const items = getPhaseItems().filter(i => !i.draft_prompt && i.status === 'needed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  for (const item of items) {
    progress.textContent = `生成提示词 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type === 'character' ? 'character' : (item._type === 'prop' ? 'prop' : 'scene');
      const seed = item.seed || '';
      const resp = await fetch('/api/prompts/generate', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_path: state.projectPath, name: item.name, appearance_seed: seed})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '生成失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
  }
  await refreshStatus();
  progress.textContent = `完成 ${ok + fail}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提示词生成完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
}

async function batchSubmitAll() {
  if (state.batchRunning) return;
  if (!await ensureRequiredApiKey('vidu')) return;
  const items = getPhaseItems().filter(i => i.draft_prompt && i.status === 'needed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  for (const item of items) {
    progress.textContent = `提交 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type;
      const resp = await fetch('/api/tasks/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_path: state.projectPath, name: item.name, prompt: item.draft_prompt, image_paths: []})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '提交失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
    await refreshStatus();
  }
  progress.textContent = `完成 ${ok + fail}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提交完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
}

async function batchRetryFailed() {
  if (state.batchRunning) return;
  if (!await ensureRequiredApiKey('vidu')) return;
  const items = getPhaseItems().filter(i => i.status === 'failed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0, skip = 0;
  for (const item of items) {
    const prompt = item.draft_prompt || item.seed || '';
    if (!prompt) { skip++; continue; }
    progress.textContent = `重试 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type;
      const resp = await fetch('/api/tasks/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_path: state.projectPath, name: item.name, prompt, image_paths: []})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '重试失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
    await refreshStatus();
  }
  progress.textContent = `完成 ${ok + fail + skip}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`重试完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}${skip > 0 ? `，${skip} 跳过` : ''}`, fail > 0 ? 'error' : 'success');
}

function selectAsset(name) {
  state.selectedScene = name;
  renderMainArea();
}

function statusClass(s) {
  if (s === 'completed') return 'done';
  if (s === 'submitted') return 'progress';
  if (s === 'failed') return 'failed';
  return '';
}
function statusIcon(s) {
  const icons = {
    completed: '<i data-lucide="check" class="lucide-sm"></i>',
    submitted: '<i data-lucide="loader" class="lucide-sm spin-icon"></i>',
    failed: '<i data-lucide="x" class="lucide-sm"></i>',
    needed: '<i data-lucide="circle" class="lucide-sm"></i>',
    pending: '<i data-lucide="circle" class="lucide-sm"></i>',
  };
  return icons[s] || '<i data-lucide="minus" class="lucide-sm"></i>';
}

function renderDetail(key) {
  const p = state.pipeline;
  const content = document.getElementById('detail-panel');

  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') {
    const category = state.currentPhase === 'characters' ? 'characters' : 'scenes_props';
    const assets = state.currentPhase === 'characters'
      ? p.assets?.characters : {...p.assets?.scenes, ...p.assets?.props};
    const assetType = state.currentPhase === 'characters' ? 'characters'
      : (p.assets?.scenes?.[key] !== undefined ? 'scenes' : 'props');
    renderAssetDetail(content, key, assetType, assets[key] || {});
  } else if (state.currentPhase === 'storyboards') {
    renderStoryboardDetail(content, key, p.storyboards?.[key] || {});
  } else {
    renderVideoDetail(content, key, p.storyboards?.[key] || {});
  }
}

function createTextAreaField({id, label, value, extraClass = '', textareaClass = ''}) {
  const field = document.createElement('div');
  field.className = `story-input-field ${extraClass}`.trim();
  const labelEl = document.createElement('label');
  labelEl.setAttribute('for', id);
  labelEl.textContent = label;
  const textarea = document.createElement('textarea');
  textarea.id = id;
  textarea.className = `prompt-editor ${textareaClass}`.trim();
  textarea.value = value || '';
  field.append(labelEl, textarea);
  return field;
}

function formatShotPlan(plan) {
  if (!plan || Object.keys(plan).length === 0) return '';
  try {
    return JSON.stringify(plan, null, 2);
  } catch (_) {
    return '';
  }
}

function readShotPlanFromEditor() {
  const raw = document.getElementById('shot-plan-input')?.value.trim() || '';
  if (!raw) return {};
  try {
    return JSON.parse(raw);
  } catch (_) {
    showToast('分镜计划 JSON 格式不正确', 'error');
    return null;
  }
}

async function saveStoryboardInput(sceneKey, {silent = false} = {}) {
  const shotPlan = readShotPlanFromEditor();
  if (shotPlan === null) return false;
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  const target = getStoryboardTarget(board, state.storyboardPromptMode, state.storyboardPage);
  try {
    const resp = await fetch('/api/project/storyboard-input', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_path: state.projectPath,
        scene_key: sceneKey,
        mode: state.storyboardPromptMode,
        page: state.storyboardPromptMode === 'v2' ? state.storyboardPage : undefined,
        output_id: target.id,
        story_summary: document.getElementById('story-summary-input')?.value || '',
        conflict_summary: document.getElementById('conflict-summary-input')?.value || '',
        shot_plan: shotPlan,
        draft_prompt: document.getElementById('board-prompt')?.value || undefined,
      })
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      showToast('保存失败：' + (e.detail || resp.status), 'error');
      return false;
    }
    await refreshStatus();
    if (!silent) showToast('故事板输入已保存', 'success');
    return true;
  } catch(e) {
    showToast('保存失败：' + e.message, 'error');
    return false;
  }
}

      card.appendChild(createErrorBanner(part.video_error));

      card.appendChild(createWarnBanner(`本地下载失败：${part.video_download_error}`));

    row.className = 'btn-row';
    const submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'btn btn-primary';
    submitBtn.textContent = '提交视频';
    submitBtn.addEventListener('click', () => submitVideoPart(key, part.part));
    row.appendChild(submitBtn);
    if (mediaUrl) {
      const downloadLink = document.createElement('a');
      downloadLink.href = mediaUrl;
      downloadLink.target = '_blank';
      downloadLink.rel = 'noopener';
      downloadLink.className = 'btn btn-secondary';
      downloadLink.textContent = '下载';
      row.appendChild(downloadLink);
    }
    card.append(textarea, row);
    container.appendChild(card);
  }

function createModeSelector({label, stateKey, onChange}) {
  const row = document.createElement('div');
  row.className = 'mode-row';
  const text = document.createElement('span');
  text.className = 'mode-label';
  text.textContent = label;
  const control = document.createElement('div');
  control.className = 'segmented-control';
  for (const mode of ['v1', 'v2']) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = state[stateKey] === mode ? 'active' : '';
    btn.textContent = mode;
    btn.setAttribute('aria-pressed', state[stateKey] === mode ? 'true' : 'false');
    btn.addEventListener('click', () => {
      state[stateKey] = mode;
      onChange();
    });
    control.appendChild(btn);
  }
  row.append(text, control);
  return row;
}

async function generateAssetPrompt(name, category, btn) {
  const type = category === 'characters' ? 'character' : (category === 'props' ? 'prop' : 'scene');
  const seed = state.pipeline?.assets?.[category]?.[name]?.seed || '';
  if (!await ensureRequiredApiKey('idealab')) return;
  if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
  try {
    const resp = await fetch('/api/prompts/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, project_path: state.projectPath, name, appearance_seed: seed})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(()=>({}));
      showToast('生成失败：' + (e.detail || resp.status), 'error');
      return;
    }
    const data = await resp.json();
    const ta = document.getElementById('asset-prompt');
    if (ta) ta.value = data.prompt;
  } catch(e) { showToast('生成失败：' + e.message, 'error'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '生成提示词'; } }
}

async function submitAsset(name, category) {

  if (!prompt) { showToast('请先填写或生成提示词', 'error'); return; }
  if (!await ensureRequiredApiKey('vidu')) return;
  const type = category === 'characters' ? 'character' : (category === 'props' ? 'prop' : 'scene');
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, project_path: state.projectPath, name, prompt, image_paths: []})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(()=>({}));
      showToast('提交失败：' + (e.detail || resp.status), 'error');
      return;
    }
    await refreshStatus();
  } catch(e) { showToast('提交失败：' + e.message, 'error'); }
}

async function generateBoardPrompt(sceneKey) {
  const saved = await saveStoryboardInput(sceneKey, {silent: true});

  const target = getStoryboardTarget(board, state.storyboardPromptMode, state.storyboardPage);
  if (!await ensureRequiredApiKey('idealab')) return;

      method: 'POST', headers: {'Content-Type': 'application/json'},

        type: 'storyboard', project_path: state.projectPath, scene_key: sceneKey,
        page: state.storyboardPromptMode === 'v2' ? state.storyboardPage : undefined,
        output_id: target.id,
        characters: board.characters_in_scene || [], scene_location: board.scene_location || '',

        shot_plan: target.shot_plan || board.shot_plan || {},

      })

async function submitBoard(sceneKey) {
  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) { showToast('前置条件未满足：' + dep.storyboardReason, 'error'); return; }
  const saved = await saveStoryboardInput(sceneKey, {silent: true});
  if (!saved) return;
  if (!await ensureRequiredApiKey('vidu')) return;
  const prompt = document.getElementById('board-prompt').value;
  if (!prompt) { showToast('请先填写或生成提示词', 'error'); return; }
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  const target = getStoryboardTarget(board, state.storyboardPromptMode, state.storyboardPage);
  if (showReferenceIssues(getStoryboardReferenceIssues(board))) return;
  const imagePaths = [];
  for (const char of (board.characters_in_scene || [])) imagePaths.push(`characters/${char}/${char}.png`);
  if (board.scene_location) imagePaths.push(`scenes_props/${board.scene_location}/${board.scene_location}.png`);
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'storyboard', project_path: state.projectPath,
        scene_key: sceneKey, mode: state.storyboardPromptMode,
        page: state.storyboardPromptMode === 'v2' ? state.storyboardPage : undefined,
        output_id: target.id,
        prompt, image_paths: imagePaths})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(()=>({}));
      showToast('提交失败：' + (e.detail || resp.status), 'error');
      return;
    }
    await refreshStatus();
  } catch(e) { showToast('提交失败：' + e.message, 'error'); }
}

async function generateVideoPrompts(sceneKey) {
  const board = state.pipeline?.storyboards?.[sceneKey] || {};

async function submitVideoPart(sceneKey, partNum) {
  const prompt = document.getElementById(`video-prompt-${partNum}`)?.value || '';
  if (!prompt) { showToast('请先填写视频提示词', 'error'); return; }
  if (!await ensureRequiredApiKey('wetoken')) return;
  if (!await ensureRequiredApiKey('github')) return;
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  const target = getStoryboardTarget(board, state.videoPromptMode, state.storyboardPage);
  if ((target.board_status || board.board_status) !== 'completed') {
    showToast('故事板尚未完成，无法提交视频', 'error');
    return;
  }
  if (showReferenceIssues(getStoryboardReferenceIssues(board))) return;
  const partInfo = (target.video_parts || []).find(p => p.part === partNum);
  const duration = (partInfo && partInfo.duration) || target.video_duration || board.video_duration || 10;
  const ratio = target.video_ratio || board.video_ratio || '16:9';
  const imagePaths = [];
  for (const char of (board.characters_in_scene || [])) imagePaths.push(`characters/${char}/${char}.png`);
  if (board.scene_location) imagePaths.push(`scenes_props/${board.scene_location}/${board.scene_location}.png`);
  imagePaths.push(storyboardImagePath(sceneKey, state.videoPromptMode, state.storyboardPage));
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'video', project_path: state.projectPath,
        scene_key: sceneKey, mode: state.videoPromptMode,
        page: state.videoPromptMode === 'v2' ? state.storyboardPage : undefined,
        output_id: target.id,
        part: partNum, prompt, image_paths: imagePaths,
        duration: duration, ratio: ratio})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(()=>({}));
      showToast('提交失败：' + (e.detail || resp.status), 'error');
      return;
    }
    await refreshStatus();
  } catch(e) { showToast('提交失败：' + e.message, 'error'); }
}

async function refreshStatus() {
  if (!state.projectPath) return;
  const resp = await fetch(`/api/project/status?${projectPathParam()}`);
  if (resp.ok) {
    const newData = await resp.json();
    state.pipeline = newData;
    renderAll();
    // 提交后或有进行中任务时确保轮询在跑
    if (hasSubmittedTasks()) startPolling();
  }
}
