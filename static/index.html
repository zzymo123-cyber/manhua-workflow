<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精品原型v1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-base: #ffffff;
  --bg-surface: #f8f9fb;
  --bg-elevated: #ffffff;
  --bg-muted: #f1f3f5;
  --text-primary: #1a1d23;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --text-on-accent: #ffffff;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-light: #eef2ff;
  --accent-muted: #c7d2fe;
  --success: #22c55e;
  --success-light: #f0fdf4;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --error: #ef4444;
  --error-light: #fef2f2;
  --border: #e5e7eb;
  --border-hover: #d1d5db;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --overlay-scrim: rgba(0,0,0,0.3);
  --shadow-fab: 0 2px 12px rgba(99,102,241,0.4);
  --warning-dark: #e65100;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg-base); color: var(--text-primary); height: 100vh;
       display: flex; flex-direction: column; overflow: hidden;
       font-size: var(--text-base); line-height: 1.5; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; }
svg.lucide-sm { width: 14px; height: 14px; }
svg.lucide-lg { width: 20px; height: 20px; }

#header { background: var(--bg-surface); border-bottom: 1px solid var(--border);
          padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-4);
          flex-shrink: 0; }
#header h1 { font-size: var(--text-md); font-weight: 600; color: var(--accent); }
#header .meta { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; }
#header .meta:hover { color: var(--text-primary); }
#header .tasks-badge { background: var(--bg-muted); border-radius: 12px;
                        padding: 3px 10px; font-size: var(--text-sm); color: var(--warning); }
#header .settings-btn { margin-left: auto; background: none; border: none;
                        color: var(--text-secondary); cursor: pointer; padding: var(--space-2) var(--space-3);
                        border-radius: var(--radius-sm); display: flex; align-items: center; }
#header .settings-btn:hover { background: var(--bg-muted); color: var(--accent); }

#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 200px; background: var(--bg-elevated); border-right: 1px solid var(--border);
           display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#phase-tabs { padding: var(--space-2); display: flex; flex-direction: column; gap: 2px;
              border-bottom: 1px solid var(--border); }
.phase-tab { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-sm);
             cursor: pointer; background: var(--bg-base); color: var(--text-secondary);
             border: 1px solid transparent; transition: all 0.15s;
             display: flex; align-items: center; gap: var(--space-2); }
.phase-tab.active { background: var(--accent-light); color: var(--accent); border-left: 2px solid var(--accent); }
.phase-tab:hover { color: var(--text-primary); background: var(--bg-muted); }
#sidebar-storyboard-list { flex: 1; overflow-y: auto; padding: var(--space-2); }
.episode-group { margin-bottom: var(--space-2); }
.episode-label { font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) var(--space-2); }
.scene-card { background: var(--bg-muted); border-radius: var(--radius-sm); padding: var(--space-2); margin-bottom: 4px;
              cursor: pointer; border: 1px solid transparent; }
.scene-card:hover { background: var(--bg-surface); }
.scene-card.selected { background: var(--accent-light); border-left: 2px solid var(--accent-muted); }
.scene-card .scene-name { font-size: var(--text-sm); font-weight: 500; margin-bottom: var(--space-1); }
.scene-card .status-row { display: flex; gap: 4px; }
.status-badge { font-size: var(--text-xs); padding: 1px 5px; border-radius: 4px;
                background: var(--bg-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 3px; }
.status-badge.done { color: var(--success); background: var(--success-light); }
.status-badge.progress { color: var(--warning); background: var(--warning-light); }
.status-badge.failed { color: var(--error); background: var(--error-light); }

#stage-progress-wrap { padding: var(--space-2); border-top: 1px solid var(--border); }
#stage-progress-wrap .stage-pipeline { display: flex; align-items: center; gap: 2px; margin-bottom: var(--space-1); flex-wrap: wrap; }
.stage-node { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: 3px; background: var(--bg-muted); color: var(--text-muted); white-space: nowrap; }
.stage-node.active { background: var(--accent-light); color: var(--accent); }
.stage-node.done { background: var(--success-light); color: var(--success); }
.stage-arrow { font-size: var(--text-xs); color: var(--text-muted); }
#progress-bar { height: 4px; background: var(--bg-muted); border-radius: 2px; margin-top: var(--space-1); }
#progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

#content-panel { flex: 1; overflow-y: auto; background: var(--bg-base); display: flex; flex-direction: column; }

#batch-toolbar { background: var(--bg-surface); border-bottom: 1px solid var(--border);
                 padding: var(--space-2) var(--space-4); display: none; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#batch-toolbar.visible { display: flex; }
#batch-toolbar .toolbar-label { font-size: var(--text-sm); color: var(--text-secondary); margin-right: var(--space-1); }
#batch-toolbar .batch-progress { font-size: var(--text-xs); color: var(--warning); margin-left: var(--space-2); }

#grid-area { padding: var(--space-4); display: none; }
#grid-area.visible { display: block; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
.asset-card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: var(--space-3); cursor: pointer;
              border: 1px solid var(--border); transition: all 0.15s; position: relative;
              box-shadow: var(--shadow-sm); }
.asset-card:hover { background: var(--bg-surface); border-color: var(--border-hover); box-shadow: var(--shadow-md); }
.asset-card.selected { background: var(--accent-light); border-color: var(--accent); border-left-width: 2px; }
.asset-card.failed { border-color: var(--error); }
.asset-card .card-name { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary); }
.asset-card .card-seed { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; max-height: 36px; overflow: hidden; }
.asset-card .card-status { margin-top: var(--space-2); }

.card-thumb { width: 100%; height: 100px; border-radius: 4px; margin-bottom: var(--space-2); background: var(--bg-muted);
              overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-thumb .placeholder { color: var(--text-muted); }
.card-thumb .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--warning);
                       border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#detail-panel { flex: 1; overflow-y: auto; padding: var(--space-5); display: none; }
#detail-panel.visible { display: block; }
#detail-panel h2 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-3); color: var(--accent); }
.back-link { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; margin-bottom: var(--space-3); display: inline-block; }
.back-link:hover { color: var(--accent); }
.empty-state { color: var(--text-muted); font-size: var(--text-base); text-align: center; margin-top: 60px; }
.stage-section { margin-bottom: var(--space-5); }
.stage-section h3 { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
.prompt-editor { width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                 border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); color: var(--text-primary);
                 line-height: 1.6; resize: vertical; min-height: 120px; }
.prompt-editor:focus { outline: none; border-color: var(--accent-muted); }
.img-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--radius-md);
               background: var(--bg-surface); margin-bottom: var(--space-3); }
.btn { padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-size: var(--text-sm); cursor: pointer;
       border: none; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-1); }
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-secondary { background: var(--bg-muted); color: var(--text-secondary); }
.btn-secondary:hover { background: var(--bg-surface); color: var(--text-primary); }
.btn-secondary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-danger { background: var(--error); color: var(--text-on-accent); }
.btn-row { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.video-part-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
                   padding: var(--space-3); margin-bottom: var(--space-2); }
.video-part-card .part-header { font-size: var(--text-sm); font-weight: 600; color: var(--accent); margin-bottom: var(--space-2); }

.modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay-scrim);
                  z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.visible { display: flex; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
         padding: var(--space-6); width: 440px; max-width: 90vw; box-shadow: var(--shadow-lg); }
.modal h2 { font-size: var(--text-lg); color: var(--accent); margin-bottom: var(--space-4); }
.modal label { display: block; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-1); margin-top: var(--space-3); }
.modal input { width: 100%; background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); }
.modal input:focus { outline: none; border-color: var(--accent-muted); }
.modal .btn-row { margin-top: var(--space-5); justify-content: flex-end; }

#agent-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px;
               background: var(--bg-elevated); border-left: 1px solid var(--border);
               display: flex; flex-direction: column; z-index: 50;
               transform: translateX(100%); transition: transform 0.2s ease;
               box-shadow: var(--shadow-lg); }
#agent-panel.open { transform: translateX(0); }
#agent-panel-header { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border);
                       display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#agent-panel-header span { font-size: var(--text-sm); font-weight: 600; color: var(--accent); flex: 1; }
#agent-clear { background: none; border: 1px solid var(--border); border-radius: 5px;
               color: var(--text-muted); font-size: var(--text-xs); padding: 3px var(--space-2); cursor: pointer; }
#agent-clear:hover { color: var(--text-secondary); border-color: var(--border-hover); }
#agent-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: var(--space-1) var(--space-2); line-height: 1;
               display: flex; align-items: center; }
#agent-close:hover { color: var(--text-secondary); }
#agent-messages { flex: 1; overflow-y: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.amsg-user { align-self: flex-end; background: var(--accent-light); border-radius: 10px 10px 2px 10px;
             padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; }
.amsg-assistant { align-self: flex-start; background: var(--bg-muted); border-radius: 10px 10px 10px 2px;
                  padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; line-height: 1.5; }
.amsg-tool { align-self: flex-start; display: flex; align-items: center; gap: var(--space-2);
             font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0; }
.amsg-tool .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.amsg-tool.ok .tool-dot { background: var(--success); }
.amsg-tool.fail .tool-dot { background: var(--error); }
.amsg-thinking { align-self: flex-start; font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0;
                  display: flex; align-items: center; gap: var(--space-2); }
.amsg-thinking .dots span { animation: blink 1.2s infinite; display: inline-block; }
.amsg-thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
.amsg-thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
#agent-input-row { padding: var(--space-3) var(--space-3); border-top: 1px solid var(--border); display: flex; gap: var(--space-2); flex-shrink: 0; }
#agent-input { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); resize: none; height: 36px;
               line-height: 1.4; }
#agent-input:focus { outline: none; border-color: var(--accent-muted); }
#agent-input:disabled { opacity: 0.5; }
#agent-send { background: var(--accent); color: var(--text-on-accent); border: none; border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-4); font-size: var(--text-sm); cursor: pointer; white-space: nowrap; }
#agent-send:hover { background: var(--accent-hover); }
#agent-send:disabled { background: var(--bg-muted); cursor: not-allowed; }
#agent-fab { position: fixed; right: var(--space-4); bottom: 20px; background: var(--accent); color: var(--text-on-accent);
             border: none; border-radius: 50%; width: 44px; height: 44px;
             cursor: pointer; box-shadow: var(--shadow-fab); z-index: 49;
             display: flex; align-items: center; justify-content: center; }
#agent-fab:hover { background: var(--accent-hover); }
#agent-fab.hidden { display: none; }
.warn-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning); margin-bottom: var(--space-3); }
.block-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning-dark); margin-bottom: var(--space-3); }
.error-banner { background: var(--error-light); border: 1px solid var(--error); border-radius: var(--radius-sm);
                padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--error); margin-bottom: var(--space-3); }
#toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: var(--radius-sm); font-size: var(--text-sm); box-shadow: var(--shadow-md);
         animation: toast-in 0.25s ease; max-width: 360px; }
.toast.success { background: var(--success-light); border: 1px solid var(--success); color: #166534; }
.toast.error { background: var(--error-light); border: 1px solid var(--error); color: #991b1b; }
.toast.info { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.recent-project-item { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
                        padding: var(--space-2) var(--space-3); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); }
.recent-project-item:hover { background: var(--bg-surface); border-color: var(--accent-muted); }
.recent-project-item .rp-name { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
.recent-project-item .rp-path { font-size: var(--text-xs); color: var(--text-muted); flex: 1; overflow: hidden;
                                  text-overflow: ellipsis; white-space: nowrap; }

/* Template editor */
.template-editor-wrap { padding: var(--space-5); display: flex; flex-direction: column; height: 100%; }
.template-editor-wrap h2 { font-size: var(--text-lg); color: var(--accent); margin-bottom: var(--space-4); }
.template-type-select { width: 100%; background: var(--bg-base); border: 1px solid var(--border);
                        border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
                        font-size: var(--text-sm); color: var(--text-primary); margin-bottom: var(--space-3); }
.template-type-select:focus { outline: none; border-color: var(--accent-muted); }
.template-textarea { flex: 1; width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                     border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm);
                     color: var(--text-primary); line-height: 1.6; resize: none; font-family: var(--font-mono); }
.template-textarea:focus { outline: none; border-color: var(--accent-muted); }

.import-preview-box { display: none; margin-top: var(--space-3); background: var(--bg-surface);
                      border: 1px solid var(--border); border-radius: var(--radius-sm);
                      padding: 10px 14px; font-size: var(--text-sm); line-height: 1.8; color: var(--text-secondary); }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div id="header">
  <h1>精品原型v1</h1>
  <span class="meta" id="project-meta" onclick="openImportDialog()">未加载项目</span>
  <span class="tasks-badge" id="tasks-badge" style="display:none">0 任务进行中</span>
  <button class="settings-btn" onclick="openSettings()" title="设置"><i data-lucide="settings"></i></button>
</div>

<div id="main">
  <div id="sidebar">
    <div id="phase-tabs">
      <div class="phase-tab" data-phase="characters"><i data-lucide="users"></i> 角色</div>
      <div class="phase-tab" data-phase="scenes_props"><i data-lucide="image"></i> 场景</div>
      <div class="phase-tab" data-phase="storyboards"><i data-lucide="layout-grid"></i> 故事板</div>
      <div class="phase-tab" data-phase="video_prompts"><i data-lucide="video"></i> 视频</div>
      <div class="phase-tab" data-phase="templates"><i data-lucide="file-text"></i> 模板</div>
    </div>
    <div id="sidebar-storyboard-list"></div>
    <div id="stage-progress-wrap">
      <div class="stage-pipeline" id="stage-pipeline"></div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="content-panel">
    <div id="batch-toolbar">
      <span class="toolbar-label" id="toolbar-label">批量操作</span>
      <button class="btn btn-secondary" id="btn-batch-gen" onclick="batchGeneratePrompts()">全部生成提示词</button>
      <button class="btn btn-primary" id="btn-batch-submit" onclick="batchSubmitAll()">全部提交</button>
      <button class="btn btn-danger" id="btn-batch-retry" onclick="batchRetryFailed()">全部重试失败</button>
      <span class="batch-progress" id="batch-progress"></span>
    </div>
    <div class="empty-state" id="empty-hint">选择左侧场景查看详情</div>
    <div id="grid-area"></div>
    <div id="detail-panel"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settings-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>API 设置</h2>
    <label>Vidu API Key</label>
    <input id="set-vidu" type="password" placeholder="输入 Vidu API Key">
    <label>Wetoken API Key</label>
    <input id="set-wetoken" type="password" placeholder="输入 Wetoken API Key">
    <label>ideaLAB API Key</label>
    <input id="set-idealab" type="password" placeholder="输入 ideaLAB API Key">
    <label>ideaLAB Base URL</label>
    <input id="set-idealab-url" type="text" placeholder="https://api.idealab.com/v1">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div id="chat-bar" style="display:none"></div>

<!-- 导入项目对话框 -->
<div class="modal-overlay" id="import-overlay">
  <div class="modal" style="width:500px">
    <h2>打开项目</h2>

    <!-- 最近项目列表 -->
    <div id="import-recent-section">
      <label style="margin-top:0">最近项目</label>
      <div id="import-recent-list" style="margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto"></div>
    </div>

    <!-- 新建：路径输入 -->
    <label style="margin-top:16px">从剧本目录导入（新建）</label>
    <div style="display:flex;gap:6px;margin-top:4px">
      <input id="import-path" type="text" placeholder="粘贴目录绝对路径，如 C:\Desktop\剧本标准输入" list="import-path-history" style="flex:1">
      <datalist id="import-path-history"></datalist>
    </div>
    <label style="margin-top:8px">项目名称</label>
    <input id="import-name" type="text" placeholder="自动从目录名填充，可修改">

    <!-- 解析预览 -->
    <div id="import-preview" class="import-preview-box"></div>
    <div id="import-error" style="display:none" class="error-banner"></div>

    <div class="btn-row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-secondary" id="import-cancel-btn" onclick="closeImportDialog()">取消</button>
      <button class="btn btn-secondary" id="import-parse-btn" onclick="doParsePreview()">解析预览</button>
      <button class="btn btn-primary" id="import-confirm-btn" onclick="doImportConfirm()" disabled>导入</button>
    </div>
  </div>
</div>

<!-- 助手侧边面板 -->
<div id="agent-panel">
  <div id="agent-panel-header">
    <span>助手</span>
    <button id="agent-clear" onclick="clearAgentHistory()">清空对话</button>
    <button id="agent-close" onclick="closeAgentPanel()"><i data-lucide="x"></i></button>
  </div>
  <div id="agent-messages"></div>
  <div id="agent-input-row">
    <textarea id="agent-input" placeholder="修改提示词 / 提交任务 / 询问进度..." rows="1"></textarea>
    <button id="agent-send" onclick="sendAgentMessage()">发送</button>
  </div>
</div>

<!-- Toast 通知 -->
<div id="toast-container"></div>

<!-- 浮动打开按钮 -->
<button id="agent-fab" onclick="openAgentPanel()" title="助手"><i data-lucide="sparkles"></i></button>

<script>
let state = {
  projectPath: null,   // 完整绝对路径，传给后端
  projectName: null,   // 显示名称（短名）
  pipeline: null,
  currentPhase: 'characters',
  selectedScene: null,
  chatHistory: [],
  batchRunning: false,
  templateCache: null,
  templateType: 'character',
};

async function init() {
  const saved = localStorage.getItem('manhua_project_path');
  if (saved) { await loadProject(saved); }
  else { openImportDialog(); }
}

async function loadProject(projectPath) {
  try {
    const resp = await fetch('/api/project/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_path: projectPath})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      showError(`加载失败：${e.detail || '未找到 pipeline.json'}`);
      localStorage.removeItem('manhua_project_path');
      openImportDialog();
      return;
    }
    state.projectPath = projectPath;
    state.templateCache = null;
    state.pipeline = await resp.json();
    state.projectName = state.pipeline.project || projectPath.split(/[/\\]/).pop();
    localStorage.setItem('manhua_project_path', projectPath);
    renderAll();
    startPolling();
  } catch(e) { showError('加载失败：' + e.message); }
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!state.projectPath) return;
    // 没有 submitted 任务时停止轮询，避免页面抖动
    if (!hasSubmittedTasks()) { stopPolling(); return; }
    try {
      const resp = await fetch(`/api/project/status?project_name=${encodeURIComponent(state.projectPath)}`);
      if (resp.ok) {
        const newData = await resp.json();
        const keys = ['assets', 'storyboards'];
        const changed = keys.some(k => JSON.stringify(state.pipeline?.[k]) !== JSON.stringify(newData[k]));
        state.pipeline = newData;
        if (changed) renderAll();
      }
    } catch(e) {}
  }, 5000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function hasSubmittedTasks() {
  const p = state.pipeline;
  if (!p) return false;
  for (const v of Object.values(p.assets?.characters || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.scenes || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.props || {})) if (v.status === 'submitted') return true;
  for (const v of Object.values(p.storyboards || {})) {
    if (v.board_status === 'submitted') return true;
    for (const vp of v.video_parts || []) if (vp.video_status === 'submitted') return true;
  }
  return false;
}

// ── 依赖检查 ──
function getDependencyInfo() {
  const p = state.pipeline;
  if (!p) return { storyboardBlocked: true, storyboardReason: '', videoBlocked: true, videoReason: '' };

  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;

  const storyboardBlocked = charDone === 0 || sceneDone === 0;
  let storyboardReason = '';
  if (charDone === 0) storyboardReason += '至少需要1个角色已完成';
  if (charDone === 0 && sceneDone === 0) storyboardReason += '，';
  if (sceneDone === 0) storyboardReason += '至少需要1个场景已完成';

  return { storyboardBlocked, storyboardReason, videoBlocked: false, videoReason: '',
           charDone, charTotal, sceneDone, sceneTotal };
}

function renderAll() {
  if (!state.pipeline) return;
  const p = state.pipeline;
  const totalScenes = Object.keys(p.storyboards || {}).length;
  document.getElementById('project-meta').textContent = `${p.project} · ${totalScenes} 场景`;

  let inProgress = 0;
  for (const [,v] of Object.entries(p.assets?.characters || {})) if (v.status === 'submitted') inProgress++;
  for (const [,v] of Object.entries(p.assets?.scenes || {})) if (v.status === 'submitted') inProgress++;
  for (const [,v] of Object.entries(p.storyboards || {})) {
    if (v.board_status === 'submitted') inProgress++;
    for (const vp of v.video_parts || []) if (vp.video_status === 'submitted') inProgress++;
  }
  const badge = document.getElementById('tasks-badge');
  if (inProgress > 0) { badge.style.display = ''; badge.textContent = `${inProgress} 任务进行中`; }
  else badge.style.display = 'none';

  document.querySelectorAll('.phase-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.phase === state.currentPhase);
  });

  renderSidebarList();
  renderMainArea();
  updateStageProgress();
  lucide.createIcons();
}

function renderSidebarList() {
  const container = document.getElementById('sidebar-storyboard-list');
  container.innerHTML = '';
  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') return;

  const p = state.pipeline;
  const byEpisode = {};
  for (const [key, board] of Object.entries(p.storyboards || {})) {
    const ep = board.episode || 1;
    if (!byEpisode[ep]) byEpisode[ep] = [];
    byEpisode[ep].push({key, board});
  }
  for (const ep of Object.keys(byEpisode).sort((a,b) => a-b)) {
    const group = document.createElement('div');
    group.className = 'episode-group';
    group.innerHTML = `<div class="episode-label">第 ${ep} 集</div>`;
    for (const {key, board} of byEpisode[ep]) {
      const card = document.createElement('div');
      card.className = 'scene-card' + (state.selectedScene === key ? ' selected' : '');
      const vidParts = board.video_parts || [];
      const vidDone = vidParts.filter(x => x.video_status === 'completed').length;
      card.innerHTML = `
        <div class="scene-name">${board.script_title || key}</div>
        <div class="status-row">
          <span class="status-badge ${statusClass(board.board_status)}">板${statusIcon(board.board_status)}</span>
          ${state.currentPhase === 'video_prompts' ? `<span class="status-badge ${vidParts.length > 0 && vidDone === vidParts.length ? 'done' : ''}">视${vidDone}/${vidParts.length}</span>` : ''}
        </div>`;
      card.onclick = () => { state.selectedScene = key; renderMainArea(); };
      group.appendChild(card);
    }
    container.appendChild(group);
  }
}

function renderMainArea() {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');

  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') {
    // 角色和场景阶段：显示批量工具栏 + 网格
    toolbar.classList.add('visible');
    updateToolbarButtons();
    emptyHint.style.display = 'none';
    if (state.selectedScene) {
      gridArea.classList.remove('visible');
      detailPanel.classList.add('visible');
      toolbar.classList.remove('visible');
      renderDetail(state.selectedScene);
    } else {
      detailPanel.classList.remove('visible');
      gridArea.classList.add('visible');
      renderAssetGrid(gridArea);
    }
  } else if (state.currentPhase === 'templates') {
    toolbar.classList.remove('visible');
    gridArea.classList.remove('visible');
    emptyHint.style.display = 'none';
    detailPanel.classList.add('visible');
    renderTemplateEditor(detailPanel);
  } else {
    // 故事板/视频阶段
    if (state.selectedScene) {
      toolbar.classList.remove('visible');
      gridArea.classList.remove('visible');
      emptyHint.style.display = 'none';
      detailPanel.classList.add('visible');
      renderDetail(state.selectedScene);
    } else {
      toolbar.classList.remove('visible');
      gridArea.classList.remove('visible');
      detailPanel.classList.remove('visible');
      emptyHint.style.display = '';
      emptyHint.textContent = '选择左侧场景查看详情';
    }
  }
}

function renderTemplateEditor(container) {
  const TYPES = [
    { key: 'character', label: '角色' },
    { key: 'scene', label: '场景' },
    { key: 'prop', label: '道具' },
    { key: 'storyboard', label: '故事板' },
    { key: 'video', label: '视频' },
  ];

  container.innerHTML = `
    <div class="template-editor-wrap">
      <h2>提示词模板</h2>
      <select class="template-type-select" id="tmpl-type-select">
        ${TYPES.map(t => `<option value="${t.key}"${state.templateType === t.key ? ' selected' : ''}>${t.label}</option>`).join('')}
      </select>
      <textarea class="template-textarea" id="tmpl-textarea" placeholder="加载中..."></textarea>
      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-3);">
        <button id="tmpl-reset-btn" style="flex:1;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;padding:var(--space-2) var(--space-3);">重置默认</button>
        <button id="tmpl-save-btn" style="flex:1;background:var(--accent);border:none;border-radius:var(--radius-sm);color:var(--text-on-accent);cursor:pointer;padding:var(--space-2) var(--space-3);">保存</button>
      </div>
      <div id="tmpl-toast" style="display:none;margin-top:var(--space-2);text-align:center;color:var(--success);font-size:var(--text-sm);"></div>
    </div>`;
  lucide.createIcons();

  const selectEl = document.getElementById('tmpl-type-select');
  const textareaEl = document.getElementById('tmpl-textarea');
  const resetBtn = document.getElementById('tmpl-reset-btn');
  const saveBtn = document.getElementById('tmpl-save-btn');
  const toastEl = document.getElementById('tmpl-toast');

  // load templates from API
  async function loadTemplates() {
    try {
      const resp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}`);
      if (!resp.ok) throw new Error('加载失败');
      state.templateCache = await resp.json();
      textareaEl.value = state.templateCache[state.templateType] || '';
      textareaEl.placeholder = '（无内容）';
    } catch (e) {
      textareaEl.value = '';
      textareaEl.placeholder = '加载失败';
    }
  }

  selectEl.addEventListener('change', () => {
    state.templateType = selectEl.value;
    textareaEl.value = state.templateCache ? (state.templateCache[state.templateType] || '') : '';
  });

  saveBtn.addEventListener('click', async () => {
    if (!state.templateCache) return;
    state.templateCache[state.templateType] = textareaEl.value;
    try {
      const resp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [state.templateType]: textareaEl.value }),
      });
      if (!resp.ok) throw new Error('保存失败');
      toastEl.textContent = '已保存';
      toastEl.style.display = '';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
    } catch (e) {
      showError('保存失败：' + e.message);
    }
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('确定要重置为默认模板吗？当前编辑内容将丢失。')) return;
    try {
      const resp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}&defaults=true`);
      if (!resp.ok) throw new Error('获取默认失败');
      const defaults = await resp.json();
      textareaEl.value = defaults[state.templateType] || '';
      state.templateCache[state.templateType] = textareaEl.value;
      // also save the reset value
      const putResp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [state.templateType]: textareaEl.value }),
      });
      if (!putResp.ok) throw new Error('写入失败');
      toastEl.textContent = '已重置为默认';
      toastEl.style.display = '';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2000);
    } catch (e) {
      showError('重置失败：' + e.message);
    }
  });

  loadTemplates();
}

// ── 阶段进度条 (#3) ──
function updateStageProgress() {
  const p = state.pipeline;
  if (!p) return;

  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;
  const boardTotal = Object.keys(p.storyboards || {}).length;
  const boardDone = Object.values(p.storyboards || {}).filter(v => v.board_status === 'completed').length;
  let vidTotal = 0, vidDone = 0;
  for (const board of Object.values(p.storyboards || {})) {
    for (const vp of board.video_parts || []) { vidTotal++; if (vp.video_status === 'completed') vidDone++; }
  }

  const stages = [
    { label: `角色 ${charDone}/${charTotal}`, done: charDone, total: charTotal, phase: 'characters' },
    { label: `场景 ${sceneDone}/${sceneTotal}`, done: sceneDone, total: sceneTotal, phase: 'scenes_props' },
    { label: `故事板 ${boardDone}/${boardTotal}`, done: boardDone, total: boardTotal, phase: 'storyboards' },
    { label: `视频 ${vidDone}/${vidTotal || '-'}`, done: vidDone, total: vidTotal, phase: 'video_prompts' },
  ];

  const pipeline = document.getElementById('stage-pipeline');
  pipeline.innerHTML = stages.map((s, i) => {
    const cls = s.total > 0 && s.done === s.total ? 'done' : (state.currentPhase === s.phase ? 'active' : '');
    const arrow = i < stages.length - 1 ? '<span class="stage-arrow">→</span>' : '';
    return `<span class="stage-node ${cls}">${s.label}</span>${arrow}`;
  }).join('');

  // 总体进度条
  const totalAll = charTotal + sceneTotal + boardTotal + vidTotal;
  const doneAll = charDone + sceneDone + boardDone + vidDone;
  const pct = totalAll > 0 ? Math.round(doneAll / totalAll * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── 卡片图片显示 (#2) ──
function renderAssetGrid(container) {
  const p = state.pipeline;
  const isChar = state.currentPhase === 'characters';
  const assets = isChar
    ? p.assets?.characters || {}
    : {...(p.assets?.scenes || {}), ...(p.assets?.props || {})};
  const category = isChar ? 'characters' : 'scenes_props';

  let html = `<div class="asset-grid">`;
  for (const [name, info] of Object.entries(assets)) {
    const seedPreview = (info.seed || '').split('\n').slice(0,3).join(' ').substring(0, 60);
    const failedClass = info.status === 'failed' ? ' failed' : '';
    let thumbHtml;
    if (info.status === 'completed') {
      const fileDir = (category === 'scenes' || category === 'props') ? 'scenes_props' : category;
      thumbHtml = `<div class="card-thumb"><img src="/api/asset-file?project_path=${encodeURIComponent(state.projectPath)}&file_path=${fileDir}/${encodeURIComponent(name)}/${encodeURIComponent(name)}.png" onerror="this.parentElement.innerHTML='<i data-lucide=image class=lucide-lg></i>';lucide.createIcons()"></div>`;
    } else if (info.status === 'submitted') {
      thumbHtml = `<div class="card-thumb"><div class="spinner"></div></div>`;
    } else {
      thumbHtml = `<div class="card-thumb"><i data-lucide="image" class="lucide-lg"></i></div>`;
    }
    html += `<div class="asset-card${failedClass}" onclick="selectAsset('${name.replace(/'/g,"\\'")}')">
      ${thumbHtml}
      <div class="card-name">${name}</div>
      <div class="card-seed">${seedPreview}</div>
      <div class="card-status"><span class="status-badge ${statusClass(info.status)}">${statusIcon(info.status)} ${info.status || 'needed'}</span></div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

// ── 批量工具栏按钮状态 (#1) ──
function updateToolbarButtons() {
  const items = getPhaseItems();
  const needGen = items.filter(i => !i.draft_prompt && i.status === 'needed');
  const canSubmit = items.filter(i => i.draft_prompt && i.status === 'needed');
  const failed = items.filter(i => i.status === 'failed');

  document.getElementById('btn-batch-gen').disabled = state.batchRunning || needGen.length === 0;
  document.getElementById('btn-batch-submit').disabled = state.batchRunning || canSubmit.length === 0;
  document.getElementById('btn-batch-retry').disabled = state.batchRunning || failed.length === 0;

  const label = state.currentPhase === 'characters' ? '角色' : '场景';
  document.getElementById('toolbar-label').textContent = `${label}批量操作`;
}

function getPhaseItems() {
  const p = state.pipeline;
  if (state.currentPhase === 'characters') {
    return Object.entries(p.assets?.characters || {}).map(([name, info]) => ({name, ...info, _type: 'character'}));
  } else {
    const scenes = Object.entries(p.assets?.scenes || {}).map(([name, info]) => ({name, ...info, _type: 'scene'}));
    const props = Object.entries(p.assets?.props || {}).map(([name, info]) => ({name, ...info, _type: 'prop'}));
    return [...scenes, ...props];
  }
}

// ── 批量操作逻辑 (#1) ──
async function batchGeneratePrompts() {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => !i.draft_prompt && i.status === 'needed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  for (const item of items) {
    progress.textContent = `生成提示词 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type === 'character' ? 'character' : (item._type === 'prop' ? 'prop' : 'scene');
      const seed = item.seed || '';
      const resp = await fetch('/api/prompts/generate', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_name: state.projectPath, name: item.name, appearance_seed: seed})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '生成失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
  }
  await refreshStatus();
  progress.textContent = `完成 ${ok + fail}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提示词生成完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
}

async function batchSubmitAll() {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => i.draft_prompt && i.status === 'needed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  for (const item of items) {
    progress.textContent = `提交 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type;
      const resp = await fetch('/api/tasks/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_name: state.projectPath, name: item.name, prompt: item.draft_prompt, image_paths: []})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '提交失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
    await refreshStatus();
  }
  progress.textContent = `完成 ${ok + fail}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提交完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
}

async function batchRetryFailed() {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => i.status === 'failed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0, skip = 0;
  for (const item of items) {
    const prompt = item.draft_prompt || item.seed || '';
    if (!prompt) { skip++; continue; }
    progress.textContent = `重试 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type;
      const resp = await fetch('/api/tasks/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_name: state.projectPath, name: item.name, prompt, image_paths: []})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '重试失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
    await refreshStatus();
  }
  progress.textContent = `完成 ${ok + fail + skip}/${items.length}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`重试完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}${skip > 0 ? `，${skip} 跳过` : ''}`, fail > 0 ? 'error' : 'success');
}

function selectAsset(name) {
  state.selectedScene = name;
  renderMainArea();
}

function statusClass(s) {
  if (s === 'completed') return 'done';
  if (s === 'submitted') return 'progress';
  if (s === 'failed') return 'failed';
  return '';
}
function statusIcon(s) {
  const icons = {
    completed: '<i data-lucide="check" class="lucide-sm"></i>',
    submitted: '<i data-lucide="loader" class="lucide-sm" style="animation:spin 0.8s linear infinite"></i>',
    failed: '<i data-lucide="x" class="lucide-sm"></i>',
    needed: '<i data-lucide="circle" class="lucide-sm"></i>',
    pending: '<i data-lucide="circle" class="lucide-sm"></i>',
  };
  return icons[s] || '<i data-lucide="minus" class="lucide-sm"></i>';
}

function renderDetail(key) {
  const p = state.pipeline;
  const content = document.getElementById('detail-panel');

  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') {
    const category = state.currentPhase === 'characters' ? 'characters' : 'scenes_props';
    const assets = state.currentPhase === 'characters'
      ? p.assets?.characters : {...p.assets?.scenes, ...p.assets?.props};
    const assetType = state.currentPhase === 'characters' ? 'characters'
      : (p.assets?.scenes?.[key] !== undefined ? 'scenes' : 'props');
    renderAssetDetail(content, key, assetType, assets[key] || {});
  } else if (state.currentPhase === 'storyboards') {
    renderStoryboardDetail(content, key, p.storyboards?.[key] || {});
  } else {
    renderVideoDetail(content, key, p.storyboards?.[key] || {});
  }
}

function renderAssetDetail(container, name, category, info) {
  container.innerHTML = `<span class="back-link" onclick="state.selectedScene=null;renderMainArea()">&larr; 返回列表</span>
    <h2>${name}</h2>`;
  if (info.status === 'completed') {
    const fileDir = (category === 'scenes' || category === 'props') ? 'scenes_props' : category;
    const encodedName = encodeURIComponent(name);
    const imgUrl = `/api/asset-file?project_path=${encodeURIComponent(state.projectPath)}&file_path=${fileDir}/${encodedName}/${encodedName}.png`;
    const imgWrap = document.createElement('div');
    imgWrap.style = 'position:relative;display:inline-block;';
    imgWrap.innerHTML = `<img class="img-preview" src="${imgUrl}" onerror="this.style.display='none'">
      <button onclick="openLightbox('${imgUrl}')" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);border:none;border-radius:4px;padding:4px 8px;cursor:pointer;color:#fff;font-size:13px;">⛶ 放大</button>`;
    container.appendChild(imgWrap);
  }
  const section = document.createElement('div');
  section.className = 'stage-section';
  section.innerHTML = `<h3>提示词草稿</h3>
    <textarea class="prompt-editor" id="asset-prompt">${info.draft_prompt || info.seed || ''}</textarea>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="generateAssetPrompt('${name.replace(/'/g,"\\'")}','${category}',this)">生成提示词</button>
      <button class="btn btn-primary" onclick="submitAsset('${name.replace(/'/g,"\\'")}','${category}')">提交生成</button>
      ${info.status === 'failed' ? `<button class="btn btn-danger" onclick="submitAsset('${name.replace(/'/g,"\\'")}','${category}')">重试</button>` : ''}
    </div>`;
  container.appendChild(section);
}

function renderStoryboardDetail(container, key, board) {
  container.innerHTML = `<h2>${board.script_title || key}</h2>`;

  // 智能阻塞提示 (#4)
  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) {
    container.innerHTML += `<div class="block-banner">无法提交故事板：${dep.storyboardReason}</div>`;
  }

  if (board.board_status === 'completed') {
    const imgUrl = `/api/asset-file?project_path=${encodeURIComponent(state.projectPath)}&file_path=storyboards/${key}/${key}.png`;
    const imgWrap = document.createElement('div');
    imgWrap.style = 'position:relative;display:inline-block;';
    imgWrap.innerHTML = `<img class="img-preview" src="${imgUrl}" onerror="this.style.display='none'">
      <button onclick="openLightbox('${imgUrl}')" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);border:none;border-radius:4px;padding:4px 8px;cursor:pointer;color:#fff;font-size:13px;">⛶ 放大</button>`;
    container.appendChild(imgWrap);
  }
  const section = document.createElement('div');
  section.className = 'stage-section';
  const blockedAttr = dep.storyboardBlocked ? ' disabled' : '';
  section.innerHTML = `<h3>故事板提示词草稿</h3>
    <textarea class="prompt-editor" id="board-prompt">${board.draft_prompt || ''}</textarea>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="generateBoardPrompt('${key}')"${blockedAttr}>生成提示词</button>
      <button class="btn btn-primary" onclick="submitBoard('${key}')"${blockedAttr}>提交故事板</button>
    </div>`;
  container.appendChild(section);
}

function renderVideoDetail(container, key, board) {
  container.innerHTML = `<h2>${board.script_title || key} — 视频</h2>`;
  if (board.board_status !== 'completed') {
    container.innerHTML += `<div class="block-banner">故事板尚未完成，无法生成视频。请先完成该场景的故事板。</div>`;
    return;
  }
  const parts = board.video_parts || [];
  if (parts.length === 0) {
    container.innerHTML += `<div class="btn-row">
      <button class="btn btn-secondary" onclick="generateVideoPrompts('${key}')">生成视频提示词（AI拆分）</button>
    </div>`;
    return;
  }
  for (const part of parts) {
    const card = document.createElement('div');
    card.className = 'video-part-card';
    card.innerHTML = `
      <div class="part-header">Part ${part.part} [${statusIcon(part.video_status)}]${part.duration ? ` ${part.duration}s` : ''}</div>
      ${part.video_url || part.local_path ? `<video src="${part.local_path ? '/api/asset-file?project_path=' + encodeURIComponent(state.projectPath) + '&file_path=' + encodeURIComponent(part.local_path) : part.video_url}" controls style="width:100%;max-height:300px;border-radius:8px;margin-bottom:8px;"></video>` : ''}
      <textarea class="prompt-editor" id="video-prompt-${part.part}" style="min-height:80px">${part.draft_prompt || part.prompt || ''}</textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="submitVideoPart('${key}', ${part.part})">提交视频</button>
        ${part.video_url || part.local_path ? `<a href="${part.local_path ? '/api/asset-file?project_path=' + encodeURIComponent(state.projectPath) + '&file_path=' + encodeURIComponent(part.local_path) : part.video_url}" target="_blank" class="btn btn-secondary">下载</a>` : ''}
      </div>`;
    container.appendChild(card);
  }
}

async function generateAssetPrompt(name, category, btn) {
  const type = category === 'characters' ? 'character' : (category === 'props' ? 'prop' : 'scene');
  const seed = state.pipeline?.assets?.[category]?.[name]?.seed || '';
  if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
  try {
    const resp = await fetch('/api/prompts/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, project_name: state.projectPath, name, appearance_seed: seed})
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('生成失败：' + (e.detail || resp.status)); return; }
    const data = await resp.json();
    const ta = document.getElementById('asset-prompt');
    if (ta) ta.value = data.prompt;
  } catch(e) { alert('生成失败：' + e.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '生成提示词'; } }
}

async function submitAsset(name, category) {
  const prompt = document.getElementById('asset-prompt').value;
  if (!prompt) { alert('请先填写或生成提示词'); return; }
  const type = category === 'characters' ? 'character' : (category === 'props' ? 'prop' : 'scene');
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, project_name: state.projectPath, name, prompt, image_paths: []})
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('提交失败：' + (e.detail || resp.status)); return; }
    await refreshStatus();
  } catch(e) { alert('提交失败：' + e.message); }
}

async function generateBoardPrompt(sceneKey) {
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  try {
    const resp = await fetch('/api/prompts/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        type: 'storyboard', project_name: state.projectPath, scene_key: sceneKey,
        characters: board.characters_in_scene || [], scene_location: board.scene_location || '',
        script_segment: board.script_segment || '',
      })
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('生成失败：' + (e.detail || resp.status)); return; }
    const data = await resp.json();
    document.getElementById('board-prompt').value = data.prompt;
  } catch(e) { alert('生成失败：' + e.message); }
}

async function submitBoard(sceneKey) {
  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) { alert('前置条件未满足：' + dep.storyboardReason); return; }
  const prompt = document.getElementById('board-prompt').value;
  if (!prompt) { alert('请先填写或生成提示词'); return; }
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  const imagePaths = [];
  for (const char of (board.characters_in_scene || [])) imagePaths.push(`characters/${char}/${char}.png`);
  if (board.scene_location) imagePaths.push(`scenes_props/${board.scene_location}/${board.scene_location}.png`);
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'storyboard', project_name: state.projectPath,
        scene_key: sceneKey, prompt, image_paths: imagePaths})
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('提交失败：' + (e.detail || resp.status)); return; }
    await refreshStatus();
  } catch(e) { alert('提交失败：' + e.message); }
}

async function generateVideoPrompts(sceneKey) {
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  try {
    const resp = await fetch('/api/prompts/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'video', project_name: state.projectPath,
        scene_key: sceneKey, script_segment: board.script_segment || ''})
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('生成失败：' + (e.detail || resp.status)); return; }
    await refreshStatus();
  } catch(e) { alert('生成失败：' + e.message); }
}

async function submitVideoPart(sceneKey, partNum) {
  const prompt = document.getElementById(`video-prompt-${partNum}`)?.value || '';
  if (!prompt) { alert('请先填写视频提示词'); return; }
  const board = state.pipeline?.storyboards?.[sceneKey] || {};
  // 从 video_parts 中取该段的 duration
  const partInfo = (board.video_parts || []).find(p => p.part === partNum);
  const duration = (partInfo && partInfo.duration) || 10;
  const imagePaths = [];
  for (const char of (board.characters_in_scene || [])) imagePaths.push(`characters/${char}/${char}.png`);
  if (board.scene_location) imagePaths.push(`scenes_props/${board.scene_location}/${board.scene_location}.png`);
  imagePaths.push(`storyboards/${sceneKey}/${sceneKey}.png`);
  try {
    const resp = await fetch('/api/tasks/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'video', project_name: state.projectPath,
        scene_key: sceneKey, part: partNum, prompt, image_paths: imagePaths,
        duration: duration})
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); alert('提交失败：' + (e.detail || resp.status)); return; }
    await refreshStatus();
  } catch(e) { alert('提交失败：' + e.message); }
}

async function refreshStatus() {
  if (!state.projectPath) return;
  const resp = await fetch(`/api/project/status?project_name=${encodeURIComponent(state.projectPath)}`);
  if (resp.ok) {
    const newData = await resp.json();
    state.pipeline = newData;
    renderAll();
    // 提交后或有进行中任务时确保轮询在跑
    if (hasSubmittedTasks()) startPolling();
  }
}

// ── 设置弹窗 ──
async function openSettings() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    document.getElementById('set-vidu').value = '';
    document.getElementById('set-vidu').placeholder = s._has_vidu ? s.vidu_api_key : '输入 Vidu API Key';
    document.getElementById('set-wetoken').value = '';
    document.getElementById('set-wetoken').placeholder = s._has_wetoken ? s.wetoken_api_key : '输入 Wetoken API Key';
    document.getElementById('set-idealab').value = '';
    document.getElementById('set-idealab').placeholder = s._has_idealab ? s.idealab_api_key : '输入 ideaLAB API Key';
    document.getElementById('set-idealab-url').value = s.idealab_base_url || '';
  } catch(e) {}
  document.getElementById('settings-overlay').classList.add('visible');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('visible');
}

async function saveSettings() {
  const body = {};
  const vidu = document.getElementById('set-vidu').value.trim();
  const wetoken = document.getElementById('set-wetoken').value.trim();
  const idealab = document.getElementById('set-idealab').value.trim();
  const url = document.getElementById('set-idealab-url').value.trim();
  if (vidu) body.vidu_api_key = vidu;
  if (wetoken) body.wetoken_api_key = wetoken;
  if (idealab) body.idealab_api_key = idealab;
  if (url) body.idealab_base_url = url;
  try {
    const resp = await fetch('/api/settings', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (resp.ok) { closeSettings(); alert('设置已保存'); }
    else {
      let detail = resp.status;
      try { const e = await resp.json(); detail = e.detail || JSON.stringify(e); } catch(_){}
      alert('保存失败：' + detail);
    }
  } catch(e) { alert('保存失败：' + e.message); }
}

// ── 助手面板 ──
function openAgentPanel() {
  document.getElementById('agent-panel').classList.add('open');
  document.getElementById('agent-fab').classList.add('hidden');
}
function closeAgentPanel() {
  document.getElementById('agent-panel').classList.remove('open');
  document.getElementById('agent-fab').classList.remove('hidden');
}
function clearAgentHistory() {
  state.chatHistory = [];
  document.getElementById('agent-messages').innerHTML = '';
}

document.getElementById('agent-send').onclick = sendAgentMessage;
document.getElementById('agent-input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAgentMessage(); }
};

async function sendAgentMessage() {
  const input = document.getElementById('agent-input');
  const msg = input.value.trim();
  if (!msg || !state.projectPath) return;
  input.value = '';
  input.disabled = true;
  document.getElementById('agent-send').disabled = true;

  appendAgentMsg('user', msg);
  state.chatHistory.push({role: 'user', content: msg});

  const thinkingEl = appendAgentThinking();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_name: state.projectPath,
        message: msg,
        history: state.chatHistory.slice(-20),
        current_scene_key: state.selectedScene,
      })
    });
    const data = await resp.json();
    thinkingEl.remove();

    for (const t of (data.tool_results || [])) {
      appendAgentTool(t.label, t.ok !== false);
    }

    if (data.reply) {
      appendAgentMsg('assistant', data.reply);
      state.chatHistory.push({role: 'assistant', content: data.reply});
    }

    if (data.has_writes) await refreshStatus();
  } catch(e) {
    thinkingEl.remove();
    appendAgentMsg('assistant', '请求失败：' + e.message);
  }

  input.disabled = false;
  document.getElementById('agent-send').disabled = false;
  input.focus();
}

function appendAgentMsg(role, text) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'amsg-user' : 'amsg-assistant';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  lucide.createIcons();
  return div;
}

function appendAgentTool(label, ok) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-tool' + (ok ? ' ok' : ' fail');
  div.innerHTML = `<span class="tool-dot"></span><span>${label}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  lucide.createIcons();
}

function appendAgentThinking() {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-thinking';
  div.innerHTML = `<span class="dots"><span>●</span><span>●</span><span>●</span></span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

document.querySelectorAll('.phase-tab').forEach(tab => {
  tab.onclick = () => {
    state.currentPhase = tab.dataset.phase;
    state.selectedScene = null;
    renderAll();
  };
});

function showToast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, duration);
}

function showError(msg) {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');
  gridArea.classList.remove('visible');
  detailPanel.classList.remove('visible');
  toolbar.classList.remove('visible');
  emptyHint.style.display = 'none';
  detailPanel.classList.add('visible');
  detailPanel.innerHTML = `<div class="error-banner">${msg}</div>`;
}

// ── 导入对话框 ──
let _importParsedData = null;  // 解析预览结果缓存

async function openImportDialog() {
  _importParsedData = null;
  document.getElementById('import-preview').style.display = 'none';
  document.getElementById('import-error').style.display = 'none';
  document.getElementById('import-confirm-btn').disabled = true;
  document.getElementById('import-path').value = '';
  document.getElementById('import-name').value = '';

  // 填充路径历史 datalist
  _fillPathHistory();

  // 加载最近项目列表
  await _loadRecentProjects();

  // 如果已有项目，允许取消
  document.getElementById('import-cancel-btn').style.display =
    state.projectPath ? '' : 'none';

  document.getElementById('import-overlay').classList.add('visible');
}

function closeImportDialog() {
  document.getElementById('import-overlay').classList.remove('visible');
}

function _fillPathHistory() {
  const history = JSON.parse(localStorage.getItem('manhua_path_history') || '[]');
  const dl = document.getElementById('import-path-history');
  dl.innerHTML = history.map(p => `<option value="${p}">`).join('');
}

function _savePathHistory(path) {
  let history = JSON.parse(localStorage.getItem('manhua_path_history') || '[]');
  history = [path, ...history.filter(p => p !== path)].slice(0, 10);
  localStorage.setItem('manhua_path_history', JSON.stringify(history));
}

async function _loadRecentProjects() {
  const list = document.getElementById('import-recent-list');
  const section = document.getElementById('import-recent-section');
  list.innerHTML = '<span style="font-size:11px;color:var(--text-muted)">加载中...</span>';
  try {
    const resp = await fetch('/api/project/list-recent');
    const data = await resp.json();
    if (!data.projects || data.projects.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = '';
    list.innerHTML = data.projects.map(p => `
      <div class="recent-project-item" onclick="loadProject(${JSON.stringify(p.path)});closeImportDialog()">
        <span class="rp-name">${p.name}</span>
        <span class="rp-path" title="${p.path}">${p.path}</span>
      </div>`).join('');
  } catch(e) {
    section.style.display = 'none';
  }
  lucide.createIcons();
}

// 路径输入时自动填充项目名
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('import-path').addEventListener('input', function() {
    const p = this.value.trim();
    if (!p) return;
    const name = p.split(/[/\\]/).filter(Boolean).pop() || '';
    const nameInput = document.getElementById('import-name');
    if (!nameInput.dataset.userEdited) nameInput.value = name;
  });
  document.getElementById('import-name').addEventListener('input', function() {
    this.dataset.userEdited = this.value ? '1' : '';
  });
});

async function doParsePreview() {
  const inputDir = document.getElementById('import-path').value.trim();
  const projectName = document.getElementById('import-name').value.trim();
  const errDiv = document.getElementById('import-error');
  const previewDiv = document.getElementById('import-preview');
  const confirmBtn = document.getElementById('import-confirm-btn');

  errDiv.style.display = 'none';
  previewDiv.style.display = 'none';
  confirmBtn.disabled = true;
  _importParsedData = null;

  if (!inputDir) { errDiv.textContent = '请输入目录路径'; errDiv.style.display = ''; return; }
  if (!projectName) { errDiv.textContent = '请输入项目名称'; errDiv.style.display = ''; return; }

  const parseBtn = document.getElementById('import-parse-btn');
  parseBtn.disabled = true;
  parseBtn.textContent = '解析中...';

  try {
    const resp = await fetch('/api/project/parse', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({input_dir: inputDir, project_name: projectName})
    });
    const data = await resp.json();
    if (!resp.ok) {
      errDiv.textContent = data.detail || '解析失败';
      errDiv.style.display = '';
      return;
    }
    _importParsedData = data;
    const s = data.stats;
    previewDiv.innerHTML = `
      <strong style="color:var(--accent)">解析完成</strong><br>
      角色：${s.characters} 个　场景：${s.scenes} 个　道具：${s.props} 个　故事板条目：${s.storyboards} 个<br>
      <span style="color:var(--text-muted);font-size:11px">pipeline.json 已写入：${data.input_dir}</span>`;
    previewDiv.style.display = '';
    confirmBtn.disabled = false;
    lucide.createIcons();
  } catch(e) {
    errDiv.textContent = '请求失败：' + e.message;
    errDiv.style.display = '';
  } finally {
    parseBtn.disabled = false;
    parseBtn.textContent = '解析预览';
  }
}

async function doImportConfirm() {
  if (!_importParsedData) return;
  _savePathHistory(_importParsedData.input_dir);
  closeImportDialog();
  await loadProject(_importParsedData.input_dir);
}

function openLightbox(url) {
  let lb = document.getElementById('lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.style = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;cursor:zoom-out;display:flex;align-items:center;justify-content:center;';
    lb.innerHTML = '<img id="lightbox-img" style="max-width:90vw;max-height:90vh;border-radius:6px;">';
    lb.onclick = () => lb.style.display = 'none';
    document.body.appendChild(lb);
  }
  document.getElementById('lightbox-img').src = url;
  lb.style.display = 'flex';
}
