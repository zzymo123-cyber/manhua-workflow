function renderDocumentsList(docs) {
  const list = document.getElementById('documents-list');
  list.innerHTML = '';
  if (!docs.length) {
    list.innerHTML = '<div class="document-empty">当前项目没有找到可打开的文档或资产目录。</div>';
    return;
  }
  for (const doc of docs) {
    const row = document.createElement('div');
    row.className = 'document-item';
    const main = document.createElement('div');
    main.className = 'document-item-main';
    const name = document.createElement('div');
    name.className = 'document-item-name';
    name.textContent = doc.name || doc.path || '';
    const path = document.createElement('div');
    path.className = 'document-item-path';
    path.title = doc.path || '';
    path.textContent = doc.path === doc.name ? '项目根目录' : (doc.path || '');
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.innerHTML = doc.kind === 'folder'
      ? '<i data-lucide="folder-open"></i> 打开目录'
      : '<i data-lucide="external-link"></i> 打开';
    btn.addEventListener('click', () => openProjectDocument(doc.path, btn));
    main.appendChild(name);
    main.appendChild(path);
    row.appendChild(main);
    row.appendChild(btn);
    list.appendChild(row);
  }
  lucide.createIcons();
}

async function openProjectDocument(filePath, btn) {
  if (!state.projectPath || !filePath) return;
  const oldHtml = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = '打开中...';
  try {
    const resp = await fetch('/api/project/open-document', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_path: state.projectPath, file_path: filePath})
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      showToast(data.detail || '打开失败', 'error');
      return;
    }
    showToast('已打开本地文档', 'success');
  } catch(e) {
    showToast('打开失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = oldHtml;
    lucide.createIcons();
  }
}

// ── 设置弹窗 ──
async function openSettings() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    document.getElementById('set-vidu').value = '';
    document.getElementById('set-vidu').placeholder = s._has_vidu ? s.vidu_api_key : '输入 Vidu API Key';
    document.getElementById('set-wetoken').value = '';
    document.getElementById('set-wetoken').placeholder = s._has_wetoken ? s.wetoken_api_key : '输入 Wetoken API Key';
    document.getElementById('set-idealab').value = '';
    document.getElementById('set-idealab').placeholder = s._has_idealab ? s.idealab_api_key : '输入 ideaLAB API Key';
    document.getElementById('set-idealab-url').value = s.idealab_base_url || '';
    document.getElementById('set-llm-provider').value = s.llm_provider || 'idealab';
    document.getElementById('set-deepseek').value = '';
    document.getElementById('set-deepseek').placeholder = s._has_deepseek ? s.deepseek_api_key : '输入 DeepSeek API Key';
    document.getElementById('set-deepseek-url').value = s.deepseek_base_url || 'https://api.deepseek.com';
    document.getElementById('set-deepseek-model').value = s.deepseek_model || 'deepseek-v4-flash';
  } catch(e) {}
  document.getElementById('settings-overlay').classList.add('visible');
}
function closeSettings() { document.getElementById('settings-overlay').classList.remove('visible'); }
async function saveSettings() {
  const body = {};
  const vidu = document.getElementById('set-vidu').value.trim();
  const wetoken = document.getElementById('set-wetoken').value.trim();
  const idealab = document.getElementById('set-idealab').value.trim();
  const url = document.getElementById('set-idealab-url').value.trim();
  const provider = document.getElementById('set-llm-provider').value;
  const deepseek = document.getElementById('set-deepseek').value.trim();
  const deepseekUrl = document.getElementById('set-deepseek-url').value.trim();
  const deepseekModel = document.getElementById('set-deepseek-model').value.trim();
  if (vidu) body.vidu_api_key = vidu;
  if (wetoken) body.wetoken_api_key = wetoken;
  if (idealab) body.idealab_api_key = idealab;
  if (url) body.idealab_base_url = url;
  body.llm_provider = provider;
  if (deepseek) body.deepseek_api_key = deepseek;
  if (deepseekUrl) body.deepseek_base_url = deepseekUrl;
  if (deepseekModel) body.deepseek_model = deepseekModel;
  try {
    const resp = await fetch('/api/settings', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    if (resp.ok) { closeSettings(); alert('设置已保存'); }
    else { let detail = resp.status; try { const e = await resp.json(); detail = e.detail || JSON.stringify(e); } catch(_){} alert('保存失败：' + detail); }
  } catch(e) { alert('保存失败：' + e.message); }
}

// ── 助手面板 ──
function openAgentPanel() { document.getElementById('agent-panel').classList.add('open'); document.getElementById('agent-fab').classList.add('hidden'); }
function closeAgentPanel() { document.getElementById('agent-panel').classList.remove('open'); document.getElementById('agent-fab').classList.remove('hidden'); }
function clearAgentHistory() { state.chatHistory = []; document.getElementById('agent-messages').innerHTML = ''; }

document.getElementById('agent-send').onclick = sendAgentMessage;
document.getElementById('agent-input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAgentMessage(); } };

async function sendAgentMessage() {
  const input = document.getElementById('agent-input');
  const msg = input.value.trim();
  if (!msg || !state.projectPath) return;
  input.value = ''; input.disabled = true; document.getElementById('agent-send').disabled = true;
  appendAgentMsg('user', msg);
  state.chatHistory.push({role: 'user', content: msg});
  const thinkingEl = appendAgentThinking();
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_name: state.projectPath,
        message: msg,
        history: state.chatHistory.slice(-20),
        current_scene_key: state.selectedScene,
        active_board_version: state.activeBoardVersion,
      })
    });
    const data = await resp.json();
    thinkingEl.remove();
    for (const t of (data.tool_results || [])) appendAgentTool(t.label, t.ok !== false);
    if (data.reply) { appendAgentMsg('assistant', data.reply); state.chatHistory.push({role: 'assistant', content: data.reply}); }
    if (data.has_writes) await refreshStatus();
  } catch(e) { thinkingEl.remove(); appendAgentMsg('assistant', '请求失败：' + e.message); }
  input.disabled = false; document.getElementById('agent-send').disabled = false; input.focus();
}

function appendAgentMsg(role, text) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'amsg-user' : 'amsg-assistant';
  div.textContent = text;
  container.appendChild(div); container.scrollTop = container.scrollHeight; lucide.createIcons(); return div;
}
function appendAgentTool(label, ok) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-tool' + (ok ? ' ok' : ' fail');
  div.innerHTML = `<span class="tool-dot"></span><span>${label}</span>`;
  container.appendChild(div); container.scrollTop = container.scrollHeight;
}
function appendAgentThinking() {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-thinking';
  div.innerHTML = `<span class="dots"><span>\u25CF</span><span>\u25CF</span><span>\u25CF</span></span>`;
  container.appendChild(div); container.scrollTop = container.scrollHeight; return div;
}

// ── 阶段切换 ──
document.querySelectorAll('.phase-tab').forEach(tab => {
  tab.onclick = () => {
    state.currentPhase = tab.dataset.phase;
    state.selectedScene = null;
    if (isBoardPhase()) {
      const vers = getAvailableVersionKeys();
      if (!state.activeBoardVersion || !vers.includes(state.activeBoardVersion)) {
        state.activeBoardVersion = vers.length > 0 ? vers[0] : null;
      }
    }
    renderAll();
    if (state.currentPhase === 'templates' && !state.templateCache && state.projectPath) {
      fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => { if (data) { state.templateCache = data; renderAll(); } })
        .catch(() => {});
    }
  };
});

function showToast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg;
  container.appendChild(el); setTimeout(() => { el.remove(); }, duration);
}

function showError(msg) {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');
  gridArea.classList.remove('visible'); detailPanel.classList.remove('visible');
  toolbar.classList.remove('visible'); emptyHint.style.display = 'none';
  detailPanel.classList.add('visible');
  detailPanel.innerHTML = `<div class="error-banner">${msg}</div>`;
}

// ── 模板编辑器 ──
// 模板列表：角色/场景/道具固定；故事板/视频按版本动态生成
function getTemplateTypes() {
  const fixed = [
    { key: 'character', label: '角色' },
    { key: 'scene', label: '场景' },
    { key: 'prop', label: '道具' },
  ];
  const vers = getAvailableVersionKeys();
  const dynamic = [];
  for (const v of vers) {
    dynamic.push({ key: `storyboard_${v}`, label: `故事板 ${v}` });
  }
  for (const v of vers) {
    dynamic.push({ key: `video_${v}`, label: `视频 ${v}` });
  }
  return [...fixed, ...dynamic];
}

function renderTemplateEditor(container) {
  const types = getTemplateTypes();
  // 若当前 templateType 不在列表中则重置
  if (!types.find(t => t.key === state.templateType)) state.templateType = 'character';

  container.innerHTML = `
    <div class="template-editor-wrap">
      <h2>提示词模板</h2>
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-3);">
        <select class="template-type-select" id="tmpl-type-select" style="flex:1">
          ${types.map(t => `<option value="${t.key}"${state.templateType === t.key ? ' selected' : ''}>${t.label}</option>`).join('')}
        </select>
      </div>
      <textarea class="template-textarea" id="tmpl-textarea" placeholder="加载中..."></textarea>
      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-3);">
        <button id="tmpl-reset-btn" style="flex:1;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;padding:var(--space-2) var(--space-3);">重置默认</button>
        <button id="tmpl-save-btn" style="flex:1;background:var(--accent);border:none;border-radius:var(--radius-sm);color:var(--text-on-accent);cursor:pointer;padding:var(--space-2) var(--space-3);">保存</button>
      </div>
      <div id="tmpl-toast" style="display:none;margin-top:var(--space-2);text-align:center;color:var(--success);font-size:var(--text-sm);"></div>
    </div>`;

  const typeSelectEl = document.getElementById('tmpl-type-select');
  const textareaEl = document.getElementById('tmpl-textarea');
  const resetBtn = document.getElementById('tmpl-reset-btn');
  const saveBtn = document.getElementById('tmpl-save-btn');
  const toastEl = document.getElementById('tmpl-toast');

  function getCurrentText() {
    if (!state.templateCache) return '';
    return state.templateCache[state.templateType] || '';
  }
  function showToastMsg(msg) { toastEl.textContent = msg; toastEl.style.display = ''; setTimeout(() => { toastEl.style.display = 'none'; }, 2000); }

  async function loadTemplates() {
    try {
      const resp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}`);
      if (!resp.ok) throw new Error('加载失败');
      state.templateCache = await resp.json();
      textareaEl.value = getCurrentText();
      textareaEl.placeholder = '（无内容）';
    } catch(e) { textareaEl.value = ''; textareaEl.placeholder = '加载失败'; }
  }

  typeSelectEl.addEventListener('change', () => {
    state.templateType = typeSelectEl.value;
    textareaEl.value = getCurrentText();
  });

  saveBtn.addEventListener('click', async () => {
    try {
      const resp = await fetch('/api/project/prompt-templates', {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project_path: state.projectPath, updates: {[state.templateType]: textareaEl.value}})
      });
      if (!resp.ok) throw new Error('保存失败');
      if (!state.templateCache) state.templateCache = {};
      state.templateCache[state.templateType] = textareaEl.value;
      showToastMsg('已保存');
    } catch(e) { showError('保存失败：' + e.message); }
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('确定要重置为默认模板吗？')) return;
    try {
      const resp = await fetch(`/api/project/prompt-templates?project_name=${encodeURIComponent(state.projectPath)}&defaults=true`);
      if (!resp.ok) throw new Error('获取默认失败');
      const defaults = await resp.json();
      // 默认值里 storyboard_v1/video_v1 对应 storyboard/video
      let defText = defaults[state.templateType] || '';
      // 兼容：若是 storyboard_v1 → 取 defaults.storyboard_v1 或 defaults.storyboard
      if (!defText && state.templateType.startsWith('storyboard_')) defText = defaults['storyboard_v1'] || defaults['storyboard'] || '';
      if (!defText && state.templateType.startsWith('video_')) defText = defaults['video_v1'] || defaults['video'] || '';
      const putResp = await fetch('/api/project/prompt-templates', {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project_path: state.projectPath, updates: {[state.templateType]: defText}})
      });
      if (!putResp.ok) throw new Error('写入失败');
      if (!state.templateCache) state.templateCache = {};
      state.templateCache[state.templateType] = defText;
      textareaEl.value = defText;
      showToastMsg('已重置为默认');
    } catch(e) { showError('重置失败：' + e.message); }
  });

  loadTemplates();
}

// ── 导入对话框 ──
let _importParsedData = null;
async function openImportDialog() {
  _importParsedData = null;
  document.getElementById('import-preview').style.display = 'none';
  document.getElementById('import-error').style.display = 'none';
  document.getElementById('import-confirm-btn').disabled = true;
  document.getElementById('import-path').value = '';
  document.getElementById('import-name').value = '';
  _fillPathHistory();
  await _loadRecentProjects();
  document.getElementById('import-cancel-btn').style.display = state.projectPath ? '' : 'none';
  document.getElementById('import-overlay').classList.add('visible');
}
function closeImportDialog() { document.getElementById('import-overlay').classList.remove('visible'); }
function _fillPathHistory() { const history = JSON.parse(localStorage.getItem('manhua_path_history') || '[]'); document.getElementById('import-path-history').innerHTML = history.map(p => `<option value="${p}">`).join(''); }
function _savePathHistory(path) { let history = JSON.parse(localStorage.getItem('manhua_path_history') || '[]'); history = [path, ...history.filter(p => p !== path)].slice(0, 10); localStorage.setItem('manhua_path_history', JSON.stringify(history)); }
async function _loadRecentProjects() {
  const list = document.getElementById('import-recent-list'); const section = document.getElementById('import-recent-section');
  list.innerHTML = '<span style="font-size:11px;color:var(--text-muted)">加载中...</span>';
  try {
    const resp = await fetch('/api/project/list-recent'); const data = await resp.json();
    if (!data.projects || data.projects.length === 0) { section.style.display = 'none'; return; }
    section.style.display = '';
    list.innerHTML = '';
    for (const p of data.projects) {
      const item = document.createElement('div');
      item.className = 'recent-project-item';
      const name = document.createElement('span');
      name.className = 'rp-name';
      name.textContent = p.name || '';
      const path = document.createElement('span');
      path.className = 'rp-path';
      path.title = p.path || '';
      path.textContent = p.path || '';
      item.appendChild(name);
      item.appendChild(path);
      item.addEventListener('click', () => { loadProject(p.path); closeImportDialog(); });
      list.appendChild(item);
    }
  } catch(e) { section.style.display = 'none'; }
  lucide.createIcons();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('import-path').addEventListener('input', function() {
    const p = this.value.trim(); if (!p) return;
    const name = p.split(/[/\\]/).filter(Boolean).pop() || '';
    const nameInput = document.getElementById('import-name');
    if (!nameInput.dataset.userEdited) nameInput.value = name;
  });
  document.getElementById('import-name').addEventListener('input', function() { this.dataset.userEdited = this.value ? '1' : ''; });
});

async function doParsePreview() {
  const inputDir = document.getElementById('import-path').value.trim();
  const projectName = document.getElementById('import-name').value.trim();
  const errDiv = document.getElementById('import-error'); const previewDiv = document.getElementById('import-preview'); const confirmBtn = document.getElementById('import-confirm-btn');
  errDiv.style.display = 'none'; previewDiv.style.display = 'none'; confirmBtn.disabled = true; _importParsedData = null;
  if (!inputDir) { errDiv.textContent = '请输入目录路径'; errDiv.style.display = ''; return; }
  if (!projectName) { errDiv.textContent = '请输入项目名称'; errDiv.style.display = ''; return; }
  const parseBtn = document.getElementById('import-parse-btn'); parseBtn.disabled = true; parseBtn.textContent = '解析中...';
  try {
    const resp = await fetch('/api/project/parse', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({input_dir: inputDir, project_name: projectName, dry_run: true}) });
    const data = await resp.json();
    if (!resp.ok) { errDiv.textContent = data.detail || '解析失败'; errDiv.style.display = ''; return; }
    _importParsedData = data; const s = data.stats;
    // 显示各版本场景数和实际分镜板页数
    const verInfo = s.storyboard_versions
      && Object.keys(s.storyboard_versions).length > 0
      ? Object.entries(s.storyboard_versions).map(([v, n]) => {
          const pages = s.storyboard_pages?.[v];
          return `${v}:${n}场景${pages !== undefined ? `/${pages}张板` : ''}`;
        }).join('  ')
      : `原始场次:${s.source_scenes || 0}场，导入后选择 v1 或 v2 路线`;
    previewDiv.innerHTML = `<strong style="color:var(--accent)">解析完成</strong><br>角色：${s.characters} 个  场景：${s.scenes} 个  道具：${s.props} 个<br>故事板：${verInfo}<br><span style="color:var(--text-muted);font-size:11px">预览未写入文件，点击“导入”后创建 pipeline.json</span>`;
    previewDiv.style.display = ''; confirmBtn.disabled = false;
  } catch(e) { errDiv.textContent = '请求失败：' + e.message; errDiv.style.display = ''; }
  finally { parseBtn.disabled = false; parseBtn.textContent = '解析预览'; }
}
async function doImportConfirm() {
  if (!_importParsedData) return;
  const inputDir = _importParsedData.input_dir;
  const projectName = _importParsedData.project_name || document.getElementById('import-name').value.trim();
  const confirmBtn = document.getElementById('import-confirm-btn');
  confirmBtn.disabled = true; confirmBtn.textContent = '导入中...';
  try {
    const resp = await fetch('/api/project/parse', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({input_dir: inputDir, project_name: projectName, dry_run: false})
    });
    const data = await resp.json();
    if (!resp.ok) { showError(data.detail || '导入失败'); return; }
    _savePathHistory(inputDir);
    closeImportDialog();
    await loadProject(inputDir);
  } catch(e) {
    showError('导入失败：' + e.message);
  } finally {
    confirmBtn.disabled = false; confirmBtn.textContent = '导入';
  }
}

function openLightbox(url) {
  let lb = document.getElementById('lightbox');
  if (!lb) { lb = document.createElement('div'); lb.id = 'lightbox'; lb.style = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;cursor:zoom-out;display:flex;align-items:center;justify-content:center;'; lb.innerHTML = '<img id="lightbox-img" style="max-width:90vw;max-height:90vh;border-radius:6px;">'; lb.onclick = () => lb.style.display = 'none'; document.body.appendChild(lb); }
  document.getElementById('lightbox-img').src = url; lb.style.display = 'flex';
}

init();
</script>
