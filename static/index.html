<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Manhua Workflow v5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-base: #ffffff;
  --bg-surface: #f8f9fb;
  --bg-elevated: #ffffff;
  --bg-muted: #f1f3f5;
  --text-primary: #1a1d23;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --text-on-accent: #ffffff;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-light: #eef2ff;
  --accent-muted: #c7d2fe;
  --success: #22c55e;
  --success-light: #f0fdf4;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --error: #ef4444;
  --error-light: #fef2f2;
  --border: #e5e7eb;
  --border-hover: #d1d5db;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-md: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --overlay-scrim: rgba(0,0,0,0.3);
  --shadow-fab: 0 2px 12px rgba(99,102,241,0.4);
  --warning-dark: #e65100;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg-base); color: var(--text-primary); height: 100vh;
       display: flex; flex-direction: column; overflow: hidden;
       font-size: var(--text-base); line-height: 1.5; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; }
svg.lucide-sm { width: 14px; height: 14px; }
svg.lucide-lg { width: 20px; height: 20px; }

#header { background: var(--bg-surface); border-bottom: 1px solid var(--border);
          padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-4);
          flex-shrink: 0; }
#header h1 { font-size: var(--text-md); font-weight: 600; color: var(--accent); }
#header .meta { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; }
#header .meta:hover { color: var(--text-primary); }
#header .tasks-badge { background: var(--bg-muted); border-radius: 12px;
                        padding: 3px 10px; font-size: var(--text-sm); color: var(--warning); }
#header .header-action { background: none; border: 1px solid var(--border);
                         color: var(--text-secondary); cursor: pointer; padding: var(--space-2) var(--space-3);
                         border-radius: var(--radius-sm); display: flex; align-items: center; gap: var(--space-1);
                         font-size: var(--text-sm); }
#header .header-action:hover { background: var(--bg-muted); color: var(--accent); }
#header .settings-btn { margin-left: auto; background: none; border: none;
                        color: var(--text-secondary); cursor: pointer; padding: var(--space-2) var(--space-3);
                        border-radius: var(--radius-sm); display: flex; align-items: center; }
#header .settings-btn:hover { background: var(--bg-muted); color: var(--accent); }

#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 200px; background: var(--bg-elevated); border-right: 1px solid var(--border);
           display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#phase-tabs { padding: var(--space-2); display: flex; flex-direction: column; gap: 2px;
              border-bottom: 1px solid var(--border); }
.phase-tab { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-sm);
             cursor: pointer; background: var(--bg-base); color: var(--text-secondary);
             border: 1px solid transparent; transition: all 0.15s;
             display: flex; align-items: center; gap: var(--space-2); }
.phase-tab.active { background: var(--accent-light); color: var(--accent); border-left: 2px solid var(--accent); }
.phase-tab:hover { color: var(--text-primary); background: var(--bg-muted); }

/* 版本面板（故事板/视频阶段） */
#version-panel { display: none; flex-direction: column; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#version-panel.visible { display: flex; }
.ver-tabs { display: flex; padding: 8px 8px 0; gap: 2px; }
.ver-tab { flex: 1; text-align: center; padding: 5px 0; border-radius: 6px 6px 0 0;
           font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted);
           background: var(--bg-base); border: 1px solid var(--border); border-bottom: none;
           transition: all 0.12s; }
.ver-tab:hover { color: var(--text-primary); }
.ver-tab.active { background: var(--accent-light); color: var(--accent); }
.ver-tab.selected-mark::after { content: '\2605'; font-size: 9px; margin-left: 2px; }
.ver-tab-add { flex: 0 0 32px; display: flex; align-items: center; justify-content: center;
               border-radius: 6px 6px 0 0; font-size: 16px; cursor: pointer;
               color: var(--text-muted); background: var(--bg-base);
               border: 1px dashed var(--border); border-bottom: none; }
.ver-tab-add:hover { color: var(--accent); border-color: var(--accent-muted); }
.ver-actions { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.va-row { display: flex; flex-direction: column; gap: 2px; }
.va-label { font-size: 11px; color: var(--text-muted); }
.va-select { width: 100%; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border);
             border-radius: 4px; background: var(--bg-base); color: var(--text-primary); }
.va-btn { width: 100%; font-size: 12px; padding: 5px 0; border-radius: 4px; cursor: pointer;
          border: none; font-weight: 500; background: var(--accent); color: var(--text-on-accent);
          text-align: center; transition: background 0.12s; }
.va-btn:hover { background: var(--accent-hover); }
.va-btn:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.va-btn-secondary { background: var(--bg-surface); color: var(--text-secondary);
                    border: 1px solid var(--border); }
.va-btn-secondary:hover { background: var(--bg-base); color: var(--text-primary); }
.va-btn-secondary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }

.status-badge { font-size: var(--text-xs); padding: 1px 5px; border-radius: 4px;
                background: var(--bg-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 3px; }
.status-badge.done { color: var(--success); background: var(--success-light); }
.status-badge.progress { color: var(--warning); background: var(--warning-light); }
.status-badge.failed { color: var(--error); background: var(--error-light); }

#stage-progress-wrap { padding: var(--space-2); border-top: 1px solid var(--border); margin-top: auto; }
#stage-progress-wrap .stage-pipeline { display: flex; align-items: center; gap: 2px; margin-bottom: var(--space-1); flex-wrap: wrap; }
.stage-node { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: 3px; background: var(--bg-muted); color: var(--text-muted); white-space: nowrap; }
.stage-node.active { background: var(--accent-light); color: var(--accent); }
.stage-node.done { background: var(--success-light); color: var(--success); }
.stage-arrow { font-size: var(--text-xs); color: var(--text-muted); }
#progress-bar { height: 4px; background: var(--bg-muted); border-radius: 2px; margin-top: var(--space-1); }
#progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

#content-panel { flex: 1; overflow-y: auto; background: var(--bg-base); display: flex; flex-direction: column; }

#batch-toolbar { background: var(--bg-surface); border-bottom: 1px solid var(--border);
                 padding: var(--space-2) var(--space-4); display: none; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#batch-toolbar.visible { display: flex; }
#batch-toolbar .toolbar-label { font-size: var(--text-sm); color: var(--text-secondary); margin-right: var(--space-1); }
#batch-toolbar .batch-progress { font-size: var(--text-xs); color: var(--warning); margin-left: var(--space-2); }

#grid-area { padding: var(--space-4); display: none; }
#grid-area.visible { display: block; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
.asset-card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: var(--space-3); cursor: pointer;
              border: 1px solid var(--border); transition: all 0.15s; position: relative;
              box-shadow: var(--shadow-sm); }
.asset-card:hover { background: var(--bg-surface); border-color: var(--border-hover); box-shadow: var(--shadow-md); }
.asset-card.selected { background: var(--accent-light); border-color: var(--accent); border-left-width: 2px; }
.asset-card.failed { border-color: var(--error); }
.asset-card .card-name { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary); }
.asset-card .card-seed { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; max-height: 36px; overflow: hidden; }
.asset-card .card-status { margin-top: var(--space-2); }
.asset-card .card-task-meta { margin-top: var(--space-1); font-size: var(--text-xs); color: var(--text-muted); line-height: 1.35; }
.asset-card .card-task-error { color: var(--error); }

/* 场景缩略卡片网格 */
.scene-thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); padding: var(--space-4); }
.scene-thumb-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
                    overflow: hidden; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow-sm); }
.scene-thumb-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.stc-thumb { width: 100%; height: 120px; background: var(--bg-muted); overflow: hidden;
             display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
.stc-thumb img { width: 100%; height: 100%; object-fit: cover; }
.stc-thumb .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--warning);
                      border-radius: 50%; animation: spin 0.8s linear infinite; }
.stc-body { padding: var(--space-2) var(--space-3); }
.stc-body .stc-name { font-size: var(--text-base); font-weight: 600; }
.stc-body .stc-ep { font-size: var(--text-xs); color: var(--text-muted); margin-left: 4px; }
.stc-body .stc-status { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
.stc-body .stc-prompt { font-size: var(--text-xs); color: var(--text-muted); margin-top: 3px;
                        max-height: 28px; overflow: hidden; line-height: 1.4; }

.card-thumb { width: 100%; height: 100px; border-radius: 4px; margin-bottom: var(--space-2); background: var(--bg-muted);
              overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-thumb .placeholder { color: var(--text-muted); }
.card-thumb .missing-file { color: var(--error); font-size: var(--text-xs); padding: var(--space-2); text-align: center; }
.card-thumb .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--warning);
                       border-radius: 50%; animation: spin 0.8s linear infinite; }
.card-thumb.image-loading { position: relative; }
.card-thumb.image-loading img { opacity: 0; }
.card-thumb.image-loading .spinner { position: absolute; }
.card-thumb:not(.image-loading) .image-spinner { display: none; }
.stc-thumb.image-loading { position: relative; }
.stc-thumb.image-loading img { opacity: 0; }
.stc-thumb.image-loading .spinner { position: absolute; }
.stc-thumb:not(.image-loading) .image-spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

#detail-panel { flex: 1; overflow-y: auto; padding: var(--space-5); display: none; }
#detail-panel.visible { display: block; }
#detail-panel h2 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-3); color: var(--accent); }
.back-link { font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; margin-bottom: var(--space-3); display: inline-block; }
.back-link:hover { color: var(--accent); }
.empty-state { color: var(--text-muted); font-size: var(--text-base); text-align: center; margin-top: 60px; }
.stage-section { margin-bottom: var(--space-5); }
.stage-section h3 { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
.prompt-editor { width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                 border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); color: var(--text-primary);
                 line-height: 1.6; resize: vertical; min-height: 120px; }
.prompt-editor:focus { outline: none; border-color: var(--accent-muted); }
.img-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--radius-md);
               background: var(--bg-surface); margin-bottom: var(--space-3); }
.btn { padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-size: var(--text-sm); cursor: pointer;
       border: none; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-1); }
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-secondary { background: var(--bg-muted); color: var(--text-secondary); }
.btn-secondary:hover { background: var(--bg-surface); color: var(--text-primary); }
.btn-secondary:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.btn-danger { background: var(--error); color: var(--text-on-accent); }
.btn .spinner, .va-btn .spinner, .header-action .spinner { display: inline-block; border: 2px solid var(--border); border-top-color: currentColor;
                       border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
.btn-row { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.video-part-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
                   padding: var(--space-3); margin-bottom: var(--space-2); }
.video-part-card .part-header { font-size: var(--text-sm); font-weight: 600; color: var(--accent); margin-bottom: var(--space-2); }
.ver-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;
             background: rgba(99,102,241,0.12); color: var(--accent); margin-left: 8px; }

.modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay-scrim);
                  z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.visible { display: flex; }
#settings-overlay { z-index: 120; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
         padding: var(--space-6); width: 440px; max-width: 90vw; max-height: 90vh;
         overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal h2 { font-size: var(--text-lg); color: var(--accent); margin-bottom: var(--space-4); }
.modal label { display: block; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-1); margin-top: var(--space-3); }
.modal input, .modal select { width: 100%; background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); }
.modal input:focus, .modal select:focus { outline: none; border-color: var(--accent-muted); }
.modal .btn-row { margin-top: var(--space-5); justify-content: flex-end; }
.document-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-3); }
.document-item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2);
                 border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-surface); }
.document-item-main { min-width: 0; flex: 1; }
.document-item-name { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.document-item-path { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.document-empty { color: var(--text-muted); font-size: var(--text-sm); padding: var(--space-3); background: var(--bg-surface); border-radius: var(--radius-sm); }

#agent-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px;
               background: var(--bg-elevated); border-left: 1px solid var(--border);
               display: flex; flex-direction: column; z-index: 50;
               transform: translateX(100%); transition: transform 0.2s ease;
               box-shadow: var(--shadow-lg); }
#agent-panel.open { transform: translateX(0); }
#agent-panel-header { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border);
                       display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
#agent-panel-header span { font-size: var(--text-sm); font-weight: 600; color: var(--accent); flex: 1; }
#agent-clear { background: none; border: 1px solid var(--border); border-radius: 5px;
               color: var(--text-muted); font-size: var(--text-xs); padding: 3px var(--space-2); cursor: pointer; }
#agent-clear:hover { color: var(--text-secondary); border-color: var(--border-hover); }
#agent-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: var(--space-1) var(--space-2); line-height: 1;
               display: flex; align-items: center; }
#agent-close:hover { color: var(--text-secondary); }
#agent-messages { flex: 1; overflow-y: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.amsg-user { align-self: flex-end; background: var(--accent-light); border-radius: 10px 10px 2px 10px;
             padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; }
.amsg-assistant { align-self: flex-start; background: var(--bg-muted); border-radius: 10px 10px 10px 2px;
                  padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); max-width: 85%; line-height: 1.5; }
.amsg-tool { align-self: flex-start; display: flex; align-items: center; gap: var(--space-2);
             font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0; }
.amsg-tool .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.amsg-tool.ok .tool-dot { background: var(--success); }
.amsg-tool.fail .tool-dot { background: var(--error); }
.amsg-thinking { align-self: flex-start; font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-1) 0;
                  display: flex; align-items: center; gap: var(--space-2); }
.amsg-thinking .dots span { animation: blink 1.2s infinite; display: inline-block; }
.amsg-thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
.amsg-thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
#agent-input-row { padding: var(--space-3) var(--space-3); border-top: 1px solid var(--border); display: flex; gap: var(--space-2); flex-shrink: 0; }
#agent-input { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text-primary); resize: none; height: 36px;
               line-height: 1.4; }
#agent-input:focus { outline: none; border-color: var(--accent-muted); }
#agent-input:disabled { opacity: 0.5; }
#agent-send { background: var(--accent); color: var(--text-on-accent); border: none; border-radius: var(--radius-sm);
              padding: var(--space-2) var(--space-4); font-size: var(--text-sm); cursor: pointer; white-space: nowrap; }
#agent-send:hover { background: var(--accent-hover); }
#agent-send:disabled { background: var(--bg-muted); cursor: not-allowed; }
#agent-fab { position: fixed; right: var(--space-4); bottom: 20px; background: var(--accent); color: var(--text-on-accent);
             border: none; border-radius: 50%; width: 44px; height: 44px;
             cursor: pointer; box-shadow: var(--shadow-fab); z-index: 49;
             display: flex; align-items: center; justify-content: center; }
#agent-fab:hover { background: var(--accent-hover); }
#agent-fab.hidden { display: none; }
.warn-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning); margin-bottom: var(--space-3); }
.block-banner { background: var(--warning-light); border: 1px solid var(--warning); border-radius: var(--radius-sm);
               padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--warning-dark); margin-bottom: var(--space-3); }
.error-banner { background: var(--error-light); border: 1px solid var(--error); border-radius: var(--radius-sm);
                padding: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--error); margin-bottom: var(--space-3); }
#toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: var(--radius-sm); font-size: var(--text-sm); box-shadow: var(--shadow-md);
         animation: toast-in 0.25s ease; max-width: 360px; }
.toast.success { background: var(--success-light); border: 1px solid var(--success); color: #166534; }
.toast.error { background: var(--error-light); border: 1px solid var(--error); color: #991b1b; }
.toast.info { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.recent-project-item { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
                        padding: var(--space-2) var(--space-3); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); }
.recent-project-item:hover { background: var(--bg-surface); border-color: var(--accent-muted); }
.recent-project-item .rp-name { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
.recent-project-item .rp-path { font-size: var(--text-xs); color: var(--text-muted); flex: 1; overflow: hidden;
                                  text-overflow: ellipsis; white-space: nowrap; }

/* Template editor */
.template-editor-wrap { padding: var(--space-5); display: flex; flex-direction: column; height: 100%; }
.template-editor-wrap h2 { font-size: var(--text-lg); color: var(--accent); margin-bottom: var(--space-4); }
.template-type-select { width: 100%; background: var(--bg-base); border: 1px solid var(--border);
                        border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
                        font-size: var(--text-sm); color: var(--text-primary); margin-bottom: var(--space-3); }
.template-type-select:focus { outline: none; border-color: var(--accent-muted); }
.template-textarea { flex: 1; width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
                     border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm);
                     color: var(--text-primary); line-height: 1.6; resize: none; font-family: var(--font-mono); }
.template-textarea:focus { outline: none; border-color: var(--accent-muted); }

.import-preview-box { display: none; margin-top: var(--space-3); background: var(--bg-surface);
                      border: 1px solid var(--border); border-radius: var(--radius-sm);
                      padding: 10px 14px; font-size: var(--text-sm); line-height: 1.8; color: var(--text-secondary); }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div id="header">
  <h1>Manhua Workflow v5</h1>
  <span class="meta" id="project-meta" onclick="openImportDialog()">未加载项目</span>
  <span class="tasks-badge" id="tasks-badge" style="display:none">0 任务进行中</span>
  <button class="header-action" id="documents-btn" onclick="openDocumentsDialog()" title="打开本地输出文档和资产目录" disabled><i data-lucide="file-output"></i> 文档/资产</button>
  <button class="settings-btn" onclick="openSettings()" title="设置"><i data-lucide="settings"></i></button>
</div>

<div id="main">
  <div id="sidebar">
    <div id="phase-tabs">
      <div class="phase-tab" data-phase="characters"><i data-lucide="users"></i> 角色</div>
      <div class="phase-tab" data-phase="scenes_props"><i data-lucide="image"></i> 场景</div>
      <div class="phase-tab" data-phase="storyboards"><i data-lucide="layout-grid"></i> 故事板</div>
      <div class="phase-tab" data-phase="video_prompts"><i data-lucide="video"></i> 视频</div>
      <div class="phase-tab" data-phase="templates"><i data-lucide="file-text"></i> 模板</div>
    </div>
    <div id="version-panel">
      <div class="ver-tabs" id="ver-tabs"></div>
      <div class="ver-actions" id="ver-actions"></div>
    </div>
    <div id="stage-progress-wrap">
      <div class="stage-pipeline" id="stage-pipeline"></div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="content-panel">
    <div id="batch-toolbar">
      <span class="toolbar-label" id="toolbar-label">批量操作</span>
      <button class="btn btn-secondary" id="btn-refresh-status" onclick="refreshStatus()">刷新状态</button>
      <button class="btn btn-secondary" id="btn-batch-gen" onclick="batchGeneratePrompts(this)">全部生成提示词</button>
      <button class="btn btn-primary" id="btn-batch-submit" onclick="batchSubmitAll(this)">全部提交</button>
      <button class="btn btn-danger" id="btn-batch-retry" onclick="batchRetryFailed(this)">全部重试失败</button>
      <span class="batch-progress" id="batch-progress"></span>
    </div>
    <div class="empty-state" id="empty-hint">选择左侧场景查看详情</div>
    <div id="grid-area"></div>
    <div id="detail-panel"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settings-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>API 设置</h2>
    <label>Vidu API Key</label>
    <input id="set-vidu" type="password" placeholder="输入 Vidu API Key">
    <label>Wetoken API Key</label>
    <input id="set-wetoken" type="password" placeholder="输入 Wetoken API Key">
    <label>ideaLAB API Key</label>
    <input id="set-idealab" type="password" placeholder="输入 ideaLAB API Key">
    <label>ideaLAB Base URL</label>
    <input id="set-idealab-url" type="text" placeholder="https://api.idealab.com/v1">
    <label>LLM Provider</label>
    <select id="set-llm-provider">
      <option value="idealab">ideaLAB</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <label>DeepSeek API Key</label>
    <input id="set-deepseek" type="password" placeholder="输入 DeepSeek API Key">
    <label>DeepSeek Base URL</label>
    <input id="set-deepseek-url" type="text" placeholder="https://api.deepseek.com">

  <div class="modal" style="width:500px">
    <h2>打开项目</h2>

      <label style="margin-top:0">最近项目</label>
      <div id="import-recent-list" style="margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto"></div>

    <div style="display:flex;gap:6px;margin-top:4px">
      <input id="import-path" type="text" placeholder="粘贴目录绝对路径，如 C:\Desktop\剧本标准输入" list="import-path-history" style="flex:1">

    <div class="btn-row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="openSettings()" style="margin-right:auto"><i data-lucide="settings"></i> API 设置</button>
      <button class="btn btn-secondary" id="import-cancel-btn" onclick="closeImportDialog()">取消</button>
      <button class="btn btn-secondary" id="import-parse-btn" onclick="doParsePreview()">解析预览</button>
      <button class="btn btn-primary" id="import-confirm-btn" onclick="doImportConfirm()" disabled>导入</button>

</div>

<!-- 输出文档弹窗 -->
<div class="modal-overlay" id="documents-overlay" onclick="if(event.target===this)closeDocumentsDialog()">
  <div class="modal" style="width:560px">
    <h2>文档/资产</h2>
    <div id="documents-list" class="document-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeDocumentsDialog()">关闭</button>
    </div>

</div>

<!-- 助手侧边面板 -->
<div id="agent-panel">
  <div id="agent-panel-header">
    <span>助手</span>
    <button id="agent-clear" onclick="clearAgentHistory()">清空对话</button>
    <button id="agent-close" onclick="closeAgentPanel()"><i data-lucide="x"></i></button>
  </div>
  <div id="agent-messages"></div>
  <div id="agent-input-row">
    <textarea id="agent-input" placeholder="修改提示词 / 提交任务 / 询问进度..." rows="1"></textarea>
    <button id="agent-send" onclick="sendAgentMessage()">发送</button>
  </div>
</div>

<div id="toast-container"></div>
<button id="agent-fab" onclick="openAgentPanel()" title="助手"><i data-lucide="sparkles"></i></button>

<script>
let state = {
  projectPath: null,
  projectName: null,
  pipeline: null,
  currentPhase: 'characters',
  selectedScene: null,
  chatHistory: [],
  batchRunning: false,
  templateCache: null,
  templateType: 'character',
  activeBoardVersion: null,   // 全局当前版本键，如 "v1"/"v2"
  versionQuality: 'high',
  versionResolution: '2K',
  actionLocks: new Set(),
};

async function init() {
  const saved = localStorage.getItem('manhua_project_path');
  if (saved) { await loadProject(saved); }
  else { openImportDialog(); }
}

async function loadProject(projectPath) {
  try {
    const resp = await fetch('/api/project/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_path: projectPath})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      showError(`加载失败：${e.detail || '未找到 pipeline.json'}`);
      localStorage.removeItem('manhua_project_path');
      openImportDialog();
      return;
    }
    state.projectPath = projectPath;
    state.templateCache = null;
    state.pipeline = await resp.json();
    state.projectName = state.pipeline.project || projectPath.split(/[/\\]/).pop();
    const vers = getAvailableVersionKeys();
    if (!state.activeBoardVersion || !vers.includes(state.activeBoardVersion)) {
      state.activeBoardVersion = vers.length > 0 ? vers[0] : null;
    }
    localStorage.setItem('manhua_project_path', projectPath);
    document.getElementById('documents-btn').disabled = false;
    renderAll();
    startPolling();
  } catch(e) { showError('加载失败：' + e.message); }
}

let pollTimer = null;
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!state.projectPath) return;
    if (!hasSubmittedTasks()) { stopPolling(); return; }
    try {
      const resp = await fetch(`/api/project/status?project_path=${encodeURIComponent(state.projectPath)}`);
      if (resp.ok) {
        const newData = await resp.json();
        const keys = ['assets', 'storyboards'];
        const changed = keys.some(k => JSON.stringify(state.pipeline?.[k]) !== JSON.stringify(newData[k]));
        state.pipeline = newData;
        if (changed) renderAll();
      }
    } catch(e) {}
  }, 5000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function hasSubmittedTasks() {
  const p = state.pipeline;
  if (!p) return false;
  for (const v of Object.values(p.assets?.characters || {}))
    if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.scenes || {}))
    if (v.status === 'submitted') return true;
  for (const v of Object.values(p.assets?.props || {}))
    if (v.status === 'submitted') return true;
  // 新结构: storyboards[verKey][sceneKey]
  for (const scenes of Object.values(p.storyboards || {})) {
    if (!scenes || typeof scenes !== 'object') continue;
    for (const scene of Object.values(scenes)) {
      if (!scene || typeof scene !== 'object') continue;
      for (const board of getSceneBoards(scene)) {
        if (board.status === 'submitted') return true;
        for (const vp of board.video_parts || [])
          if (vp.video_status === 'submitted') return true;
      }
    }
  }
  return false;
}

function deriveAssetStatus(asset) { return asset?.status || 'needed'; }

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function relativeTime(iso) {
  if (!iso) return '';
  const ts = Date.parse(iso);
  if (!Number.isFinite(ts)) return '';
  const seconds = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (seconds < 60) return `${seconds}s前`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h前`;
  return `${Math.floor(hours / 24)}d前`;
}

function taskMetaHtml(info, statusField = 'status', taskField = 'task_id') {
  const status = info?.[statusField] || 'needed';
  const rows = [];
  if (status === 'submitted') {
    rows.push(`已提交${info.submitted_at ? ` · ${relativeTime(info.submitted_at)}` : ''}`);
    if (info.last_checked_at) rows.push(`最近检查 · ${relativeTime(info.last_checked_at)}`);
    if (info[taskField]) rows.push(`任务 ${String(info[taskField]).slice(-8)}`);
    if (info.status_message) rows.push(info.status_message);
  } else if (status === 'failed') {
    rows.push(info.error || info.status_message || '生成失败');
  } else if (status === 'completed' && info.completed_at) {
    rows.push(`完成 · ${relativeTime(info.completed_at)}`);
  }
  if (!rows.length) return '';
  const cls = status === 'failed' ? ' card-task-error' : '';
  return `<div class="card-task-meta${cls}">${rows.map(escapeHtml).join('<br>')}</div>`;
}

// 获取 storyboards 顶层版本键列表，如 ["v1","v2"]
function getAvailableVersionKeys() {
  const sb = state.pipeline?.storyboards || {};
  return Object.keys(sb).filter(k => sb[k] && typeof sb[k] === 'object').sort();
}

// 获取当前版本下某场景对象（直接是扁平 scene 对象）
function getActiveScene(sceneKey) {
  if (!state.activeBoardVersion) return null;
  return state.pipeline?.storyboards?.[state.activeBoardVersion]?.[sceneKey] || null;
}

function getSceneBoards(scene) {
  if (!scene || typeof scene !== 'object') return [];
  if (Array.isArray(scene.boards)) return scene.boards;
  if (Array.isArray(scene.boards) && scene.boards.length) return scene.boards;
  return [scene];
}

function getBoardById(scene, boardId) {
  const boards = getSceneBoards(scene);
  if (boardId) return boards.find(b => b.board_id === boardId) || null;
  return boards[0] || null;
}

function boardDomId(board) {
  return String(board?.board_id || 'legacy').replace(/[^a-zA-Z0-9_-]/g, '_');
}

function boardAssetRefs(scene, board) {
  const refs = board?.asset_refs || {};
  return {
    characters: board?.characters || refs.characters || scene?.characters_in_scene || [],
    scene: board?.scene_location || refs.scene || scene?.scene_location || '',
    props: board?.props || refs.props || [],
  };
}

function assetRefImagePaths(scene, board) {
  const refs = boardAssetRefs(scene, board);
  const paths = [];
  for (const char of (refs.characters || [])) paths.push(`characters/${char}/${char}.png`);
  if (refs.scene) paths.push(`scenes_props/${refs.scene}/${refs.scene}.png`);
  for (const prop of (refs.props || [])) paths.push(`scenes_props/${prop}/${prop}.png`);
  return Array.from(new Set(paths));
}

function boardImagePath(ver, sceneKey, board) {
  const filename = board?.board_id ? `${board.board_id}.png` : `${sceneKey}.png`;
  return `storyboards/${ver}/${sceneKey}/${filename}`;
}

function assetFileUrl(filePath, versionKey = '') {
  const params = new URLSearchParams({
    project_path: state.projectPath || '',
    file_path: filePath || '',
  });
  if (versionKey) params.set('_v', versionKey);
  return `/api/asset-file?${params.toString()}`;
}

function imageVersionKey(info) {
  return info?.completed_at || info?.submitted_at || info?.task_id || state.pipeline?.updated_at || '';
}

function assetResultPath(info, fallbackPath) {
  return info?.result_url || info?.local_path || fallbackPath;
}

function getDependencyInfo() {
  const p = state.pipeline;
  if (!p) return { storyboardBlocked: true, storyboardReason: '' };
  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;
  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;
  const storyboardBlocked = charDone === 0 || sceneDone === 0;
  let storyboardReason = '';
  if (charDone === 0) storyboardReason += '至少需要1个角色已完成';
  if (charDone === 0 && sceneDone === 0) storyboardReason += '，';
  if (sceneDone === 0) storyboardReason += '至少需要1个场景已完成';
  return { storyboardBlocked, storyboardReason, charDone, charTotal, sceneDone, sceneTotal };
}

function isBoardPhase() { return state.currentPhase === 'storyboards' || state.currentPhase === 'video_prompts'; }

function renderAll() {
  if (!state.pipeline) return;
  const p = state.pipeline;
  // 显示当前版本的场景数
  const activeScenesDict = state.activeBoardVersion ? (p.storyboards?.[state.activeBoardVersion] || {}) : {};
  const activeScenes = Object.values(activeScenesDict).filter(s => s && typeof s === 'object').length;
  const activeBoards = Object.values(activeScenesDict).reduce((sum, s) => sum + getSceneBoards(s).length, 0);
  const verKeys = getAvailableVersionKeys();
  document.getElementById('project-meta').textContent = `${p.project} · ${verKeys.length} 版本 · ${activeScenes} 场景 · ${activeBoards} 张板`;

  let inProgress = 0;
  for (const v of Object.values(p.assets?.characters || {})) if (v.status === 'submitted') inProgress++;
  for (const v of Object.values(p.assets?.scenes || {})) if (v.status === 'submitted') inProgress++;
  for (const v of Object.values(p.assets?.props || {})) if (v.status === 'submitted') inProgress++;
  for (const scenes of Object.values(p.storyboards || {})) {
    if (!scenes || typeof scenes !== 'object') continue;
    for (const scene of Object.values(scenes)) {
      if (!scene || typeof scene !== 'object') continue;
      for (const board of getSceneBoards(scene)) {
        if (board.status === 'submitted') inProgress++;
        for (const vp of board.video_parts || []) if (vp.video_status === 'submitted') inProgress++;
      }
    }
  }
  const badge = document.getElementById('tasks-badge');
  if (inProgress > 0) { badge.style.display = ''; badge.textContent = `${inProgress} 任务进行中`; }
  else badge.style.display = 'none';

  document.querySelectorAll('.phase-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.phase === state.currentPhase);
  });

  renderVersionPanel();
  renderMainArea();
  updateStageProgress();
  lucide.createIcons();
}

// ── 左侧版本面板 ──
function renderVersionPanel() {
  const panel = document.getElementById('version-panel');
  if (!isBoardPhase()) { panel.classList.remove('visible'); return; }
  panel.classList.add('visible');

  const keys = getAvailableVersionKeys();
  const tabsEl = document.getElementById('ver-tabs');
  const actionsEl = document.getElementById('ver-actions');

  if (keys.length === 0) {
    tabsEl.innerHTML = '<div class="ver-tab active">未选择</div>';
    actionsEl.innerHTML = `
      <button class="va-btn" onclick="selectStoryboardRoute('v1', this)" ${state.batchRunning?'disabled':''}>选择 v1 九宫格路线</button>
      <button class="va-btn" onclick="selectStoryboardRoute('v2', this)" ${state.batchRunning?'disabled':''}>选择 v2 导演分镜路线</button>
    `;
    return;
  }

  let tabsHtml = '';
  for (const vk of keys) {
    const isActive = vk === state.activeBoardVersion;
    tabsHtml += `<div class="ver-tab${isActive ? ' active' : ''}" onclick="switchVersion('${vk}')">${vk}</div>`;
  }
  tabsEl.innerHTML = tabsHtml;

  actionsEl.innerHTML = `
    <div class="va-row">
      <span class="va-label">画质 (image2)</span>
      <select class="va-select" onchange="state.versionQuality=this.value">
        <option value="high"${state.versionQuality==='high'?' selected':''}>high</option>
        <option value="medium"${state.versionQuality==='medium'?' selected':''}>medium</option>
        <option value="low"${state.versionQuality==='low'?' selected':''}>low</option>
      </select>
    </div>
    <div class="va-row">
      <span class="va-label">分辨率</span>
      <select class="va-select" onchange="state.versionResolution=this.value">
        <option value="2K"${state.versionResolution==='2K'?' selected':''}>2K</option>
        <option value="1K"${state.versionResolution==='1K'?' selected':''}>1K</option>
      </select>
    </div>
    <button class="va-btn" onclick="batchGenBoardPrompts(this)" ${state.batchRunning?'disabled':''}>批量生成提示词</button>
    <button class="va-btn" onclick="batchSubmitBoards(this)" ${state.batchRunning?'disabled':''}>批量生成板图</button>
    <button class="va-btn va-btn-secondary" onclick="batchSubmitVideos(this)" ${state.batchRunning?'disabled':''}>批量提交视频</button>
  `;
}

function switchVersion(vk) {
  state.activeBoardVersion = vk;
  state.selectedScene = null;
  renderAll();
}

// ── 主内容区 ──
function renderMainArea() {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');

  if (state.currentPhase === 'characters' || state.currentPhase === 'scenes_props') {
    toolbar.classList.add('visible');
    updateToolbarButtons();
    emptyHint.style.display = 'none';
    if (state.selectedScene) {
      gridArea.classList.remove('visible');
      detailPanel.classList.add('visible');
      toolbar.classList.remove('visible');
      renderDetail(state.selectedScene);
    } else {
      detailPanel.classList.remove('visible');
      gridArea.classList.add('visible');
      renderAssetGrid(gridArea);
    }
  } else if (state.currentPhase === 'templates') {
    toolbar.classList.remove('visible');
    gridArea.classList.remove('visible');
    emptyHint.style.display = 'none';
    detailPanel.classList.add('visible');
    renderTemplateEditor(detailPanel);
  } else {
    // 故事板/视频阶段
    toolbar.classList.remove('visible');
    if (state.selectedScene) {
      gridArea.classList.remove('visible');
      detailPanel.classList.add('visible');
      emptyHint.style.display = 'none';
      renderDetail(state.selectedScene);
    } else {
      detailPanel.classList.remove('visible');
      gridArea.classList.add('visible');
      emptyHint.style.display = 'none';
      renderSceneGrid(gridArea);
    }
  }
}

// ── 场景缩略卡片网格 ──
function renderSceneGrid(container) {
  const p = state.pipeline;
  const ver = state.activeBoardVersion;
  const scenes = ver ? (p.storyboards?.[ver] || {}) : {};
  if (Object.keys(scenes).length === 0) {
    if (!ver) {
      container.innerHTML = `<div class="empty-state">
        <div style="margin-bottom:12px">请选择一条故事板生产线</div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-secondary" onclick="selectStoryboardRoute('v1', this)">v1 九宫格路线</button>
          <button class="btn btn-primary" onclick="selectStoryboardRoute('v2', this)">v2 导演分镜路线</button>
        </div>
      </div>`;
    } else {
      container.innerHTML = `<div class="empty-state">版本 ${ver} 暂无场景</div>`;
    }
    return;
  }

  let html = '<div class="scene-thumb-grid">';
  for (const [key, scene] of Object.entries(scenes)) {
    if (!scene || typeof scene !== 'object') continue;
    const boards = getSceneBoards(scene);
    const firstBoard = boards[0] || scene;
    const boardDone = boards.filter(b => b.status === 'completed').length;
    const boardSubmitted = boards.some(b => b.status === 'submitted');
    const isCompleted = boardDone > 0;
    const isSubmitted = boardSubmitted;
    const vidParts = boards.flatMap(b => b.video_parts || []);
    const vidDone = vidParts.filter(vp => vp.video_status === 'completed').length;
    const ep = scene.episode || 1;

    let thumbHtml;
    if (isCompleted) {
      const completedBoard = boards.find(b => b.status === 'completed') || firstBoard;
      const imgPath = assetResultPath(completedBoard, boardImagePath(ver, key, completedBoard));
      thumbHtml = `<div class="stc-thumb image-loading"><div class="spinner image-spinner"></div><img loading="lazy" src="${assetFileUrl(imgPath, imageVersionKey(completedBoard))}" onload="this.parentElement.classList.remove('image-loading')" onerror="this.parentElement.classList.remove('image-loading');this.parentElement.innerHTML='板图缺失'"></div>`;
    } else if (isSubmitted) {
      thumbHtml = `<div class="stc-thumb"><div class="spinner"></div></div>`;
    } else {
      thumbHtml = `<div class="stc-thumb">未生成</div>`;
    }

    const promptPreview = (firstBoard.draft_prompt || scene.draft_prompt || '').substring(0, 50);
    const planStatus = boards.length ? (firstBoard.status || scene.status || 'unplanned') : (scene.status || 'unplanned');
    const statusLabel = state.currentPhase === 'video_prompts'
      ? `板图: ${boardDone}/${boards.length} · 视频: ${vidDone}/${vidParts.length || '-'}`
      : `规划: ${planStatus} · 板图: ${boardDone}/${boards.length || '-'}`;

    html += `<div class="scene-thumb-card" onclick="selectScene('${key.replace(/'/g,"\\'")}')">
      ${thumbHtml}
      <div class="stc-body">
        <div class="stc-name">${scene.script_title || key}<span class="stc-ep">第${ep}集</span></div>
        <div class="stc-status">${statusLabel}</div>
        ${promptPreview ? `<div class="stc-prompt">${promptPreview}...</div>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function selectScene(key) { state.selectedScene = key; renderMainArea(); }
function selectAsset(name) { state.selectedScene = name; renderMainArea(); }

// ── 阶段进度条 ──
function updateStageProgress() {
  const p = state.pipeline;
  if (!p) return;
  const charTotal = Object.keys(p.assets?.characters || {}).length;
  const charDone = Object.values(p.assets?.characters || {}).filter(v => v.status === 'completed').length;
  const sceneTotal = Object.keys(p.assets?.scenes || {}).length;
  const sceneDone = Object.values(p.assets?.scenes || {}).filter(v => v.status === 'completed').length;

  // 故事板进度：基于当前激活版本（过滤掉非对象值，防止旧格式迁移产生的null）
  const activeScenes = state.activeBoardVersion
    ? Object.values(p.storyboards?.[state.activeBoardVersion] || {}).filter(s => s && typeof s === 'object')
    : [];
  const activeBoards = activeScenes.flatMap(s => getSceneBoards(s));
  const boardTotal = activeBoards.length;
  const boardDone = activeBoards.filter(b => b.status === 'completed').length;

  let vidTotal = 0, vidDone = 0;
  for (const board of activeBoards) {
    for (const vp of (board.video_parts || [])) {
      vidTotal++;
      if (vp.video_status === 'completed') vidDone++;
    }
  }

  const stages = [
    { label: `角色 ${charDone}/${charTotal}`, done: charDone, total: charTotal, phase: 'characters' },
    { label: `场景 ${sceneDone}/${sceneTotal}`, done: sceneDone, total: sceneTotal, phase: 'scenes_props' },
    { label: `故事板 ${boardDone}/${boardTotal}`, done: boardDone, total: boardTotal, phase: 'storyboards' },
    { label: `视频 ${vidDone}/${vidTotal || '-'}`, done: vidDone, total: vidTotal, phase: 'video_prompts' },
  ];
  const pipeline = document.getElementById('stage-pipeline');
  pipeline.innerHTML = stages.map((s, i) => {
    const cls = s.total > 0 && s.done === s.total ? 'done' : (state.currentPhase === s.phase ? 'active' : '');
    const arrow = i < stages.length - 1 ? '<span class="stage-arrow">\u2192</span>' : '';
    return `<span class="stage-node ${cls}">${s.label}</span>${arrow}`;
  }).join('');
  const totalAll = charTotal + sceneTotal + boardTotal + vidTotal;
  const doneAll = charDone + sceneDone + boardDone + vidDone;
  const pct = totalAll > 0 ? Math.round(doneAll / totalAll * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── 资产网格 ──
function renderAssetGrid(container) {
  const p = state.pipeline;
  const isChar = state.currentPhase === 'characters';
  const assets = isChar
    ? p.assets?.characters || {}
    : {...(p.assets?.scenes || {}), ...(p.assets?.props || {})};

  for (const [name, info] of Object.entries(assets)) {
    const seedPreview = (info.seed || '').split('\n').slice(0,3).join(' ').substring(0, 60);
    const assetStatus = info.status || 'needed';
    const failedClass = assetStatus === 'failed' ? ' failed' : '';
    let thumbHtml;
    if (assetStatus === 'completed') {
      const fileDir = (category === 'scenes' || category === 'props') ? 'scenes_props' : category;
      const imgPath = assetResultPath(info, `${fileDir}/${name}/${name}.png`);
      thumbHtml = `<div class="card-thumb image-loading"><div class="spinner image-spinner"></div><img loading="lazy" src="${assetFileUrl(imgPath, imageVersionKey(info))}" onload="this.parentElement.classList.remove('image-loading')" onerror="this.parentElement.classList.remove('image-loading');this.parentElement.innerHTML='<div class=missing-file>本地图片缺失<br>等待重新拉取</div>'"></div>`;
    } else if (assetStatus === 'submitted') {
      thumbHtml = `<div class="card-thumb"><div class="spinner"></div></div>`;
    } else {
      thumbHtml = `<div class="card-thumb"><i data-lucide="image" class="lucide-lg"></i></div>`;
    }
    html += `<div class="asset-card${failedClass}" onclick="selectAsset('${name.replace(/'/g,"\\'")}')">
      ${thumbHtml}
      <div class="card-name">${escapeHtml(name)}</div>

      <div class="card-status"><span class="status-badge ${statusClass(assetStatus)}">${statusIcon(assetStatus)} ${assetStatus}</span></div>
      ${taskMetaHtml(info)}

  container.innerHTML = html;
}

function updateToolbarButtons() {
  const items = getPhaseItems();
  const needGen = items.filter(i => !i.draft_prompt && i.status === 'needed');
  const canSubmit = items.filter(i => i.draft_prompt && (i.status === 'needed' || i.status === 'drafted'));
  const failed = items.filter(i => i.status === 'failed');
  document.getElementById('btn-batch-gen').disabled = state.batchRunning || needGen.length === 0;
  document.getElementById('btn-batch-submit').disabled = state.batchRunning || canSubmit.length === 0;
  document.getElementById('btn-batch-retry').disabled = state.batchRunning || failed.length === 0;
  const label = state.currentPhase === 'characters' ? '角色' : '场景';
  document.getElementById('toolbar-label').textContent = `${label}批量操作`;
}

function getPhaseItems() {
  const p = state.pipeline;
  function enrich(name, info, type) {
    return {name, seed: info.seed || '', _type: type, status: info.status || 'needed', draft_prompt: info.draft_prompt || ''};
  }
  if (state.currentPhase === 'characters') {
    return Object.entries(p.assets?.characters || {}).map(([name, info]) => enrich(name, info, 'character'));
  } else {
    const scenes = Object.entries(p.assets?.scenes || {}).map(([name, info]) => enrich(name, info, 'scene'));
    const props = Object.entries(p.assets?.props || {}).map(([name, info]) => enrich(name, info, 'prop'));
    return [...scenes, ...props];
  }
}

function markAssetSubmitted(item, taskId) {
  const p = state.pipeline;
  if (!p || !item) return;
  const category = item._type === 'character' ? 'characters' : (item._type === 'prop' ? 'props' : 'scenes');
  const asset = p.assets?.[category]?.[item.name];
  if (!asset) return;
  asset.status = 'submitted';
  if (taskId) asset.task_id = taskId;
  asset.submitted_at = new Date().toISOString();
  asset.last_checked_at = null;
  asset.status_message = '已提交，等待生成结果';
  delete asset.error;
}

function setButtonBusy(btn, label) {
  if (!btn) return () => {};
  const oldHtml = btn.innerHTML;
  btn.disabled = true;
  btn.dataset.busy = '1';
  btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> ${label}`;
  return () => {
    btn.disabled = false;
    delete btn.dataset.busy;
    btn.innerHTML = oldHtml;
    lucide.createIcons();
  };
}

async function runLockedAction(key, btn, busyLabel, action) {
  if (state.actionLocks.has(key)) {
    showToast('这个操作已经在处理中', 'info');
    return;
  }
  state.actionLocks.add(key);
  const restoreButton = setButtonBusy(btn, busyLabel);
  try {
    return await action();
  } finally {
    state.actionLocks.delete(key);
    if (btn && document.body.contains(btn)) restoreButton();
  }
}

function snapshotFields(obj, fields) {
  const snapshot = {};
  for (const field of fields) {
    if (Object.prototype.hasOwnProperty.call(obj, field)) snapshot[field] = obj[field];
    else snapshot[field] = undefined;
  }
  return () => {
    for (const field of fields) {
      if (snapshot[field] === undefined) delete obj[field];
      else obj[field] = snapshot[field];
    }
  };
}

function markAssetSubmitting(name, category) {
  const asset = state.pipeline?.assets?.[category]?.[name];
  if (!asset) return () => {};
  const restore = snapshotFields(asset, ['status', 'task_id', 'submitted_at', 'last_checked_at', 'status_message', 'error']);
  asset.status = 'submitted';
  asset.submitted_at = new Date().toISOString();
  asset.last_checked_at = null;
  asset.status_message = '正在提交到生成服务...';
  delete asset.error;
  renderAll();
  return restore;
}

function markBoardSubmitting(scene, board) {
  const restore = snapshotFields(board, ['status', 'board_task_id', 'submitted_at', 'last_checked_at', 'status_message', 'error']);
  board.status = 'submitted';
  board.submitted_at = new Date().toISOString();
  board.last_checked_at = null;
  board.status_message = '正在提交到生成服务...';
  delete board.error;
  _syncSceneFromBoardForUi(scene);
  renderAll();
  return restore;
}

function markVideoPartSubmitting(partInfo) {
  if (!partInfo) return () => {};
  const restore = snapshotFields(partInfo, ['video_status', 'video_task_id', 'submitted_at', 'last_checked_at', 'status_message', 'error']);
  partInfo.video_status = 'submitted';
  partInfo.submitted_at = new Date().toISOString();
  partInfo.last_checked_at = null;
  partInfo.status_message = '正在提交到生成服务...';
  delete partInfo.error;
  renderAll();
  return restore;
}

function _syncSceneFromBoardForUi(scene) {
  const first = getSceneBoards(scene)[0];
  if (!first) return;
  scene.draft_prompt = first.draft_prompt || '';
  scene.status = first.status || 'needed';
  scene.board_task_id = first.board_task_id;
  scene.video_parts = first.video_parts || [];
}

async function runLimited(items, limit, worker) {
  let next = 0;
  async function runOne() {
    while (next < items.length) {
      const index = next++;
      await worker(items[index], index);
    }
  }
  const runners = Array.from({length: Math.min(limit, items.length)}, runOne);
  await Promise.all(runners);
}

async function submitBatchItems(items) {
  const resp = await fetch('/api/tasks/batch-submit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({project_path: state.projectPath, items})
  });
  if (!resp.ok) {
    const e = await resp.json().catch(() => ({}));
    throw new Error(e.detail || '批量提交失败');
  }
  return await resp.json();
}

function summarizeBatchResults(results) {
  const ok = results.filter(r => r.ok).length;
  const fail = results.length - ok;
  for (const r of results) {
    if (!r.ok) showToast(`${r.name || '任务'}: ${r.error || '提交失败'}`, 'error');
  }
  return {ok, fail};
}

async function batchGeneratePrompts(btn = null) {
  return runLockedAction('batch-generate-assets', btn, '生成中...', async () => {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => !i.draft_prompt && i.status === 'needed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  for (const item of items) {
    progress.textContent = `生成提示词 ${ok + fail + 1}/${items.length}: ${item.name}`;
    try {
      const type = item._type;
      const resp = await fetch('/api/prompts/generate', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type, project_path: state.projectPath, name: item.name, appearance_seed: item.seed})
      });
      if (resp.ok) { ok++; } else { fail++; const e = await resp.json().catch(() => ({})); showToast(`${item.name}: ${e.detail || '生成失败'}`, 'error'); }
    } catch(e) { fail++; showToast(`${item.name}: 网络错误`, 'error'); }
  }
  await refreshStatus();
  progress.textContent = `提示词草稿已生成 ${ok}/${items.length}${fail > 0 ? ` · 失败 ${fail}` : ''}`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提示词生成完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
  });
}

async function batchSubmitAll(btn = null) {
  return runLockedAction('batch-submit-assets', btn, '提交中...', async () => {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => i.draft_prompt && (i.status === 'needed' || i.status === 'drafted'));
  if (items.length === 0) return;
  state.batchRunning = true;
  updateToolbarButtons();
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0;
  progress.textContent = `批量提交中 ${items.length} 个任务（后端最多3个并发）`;
  try {
    const payloadItems = items.map(item => ({
      type: item._type,
      name: item.name,
      prompt: item.draft_prompt,
      image_paths: [],
    }));
    const data = await submitBatchItems(payloadItems);
    ({ok, fail} = summarizeBatchResults(data.results || []));
  } catch(e) {
    fail = items.length;
    showToast(e.message || '批量提交失败', 'error');
  }
  await refreshStatus();
  progress.textContent = `提交请求结束：成功 ${ok}/${items.length}${fail > 0 ? ` · 失败 ${fail}` : ''} · 等待生成结果`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`提交完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
  });
}

async function batchRetryFailed(btn = null) {
  return runLockedAction('batch-retry-assets', btn, '重试中...', async () => {
  if (state.batchRunning) return;
  const items = getPhaseItems().filter(i => i.status === 'failed');
  if (items.length === 0) return;
  state.batchRunning = true;
  const progress = document.getElementById('batch-progress');
  let ok = 0, fail = 0, skip = 0;
  const payloadItems = [];
  for (const item of items) {
    const prompt = item.draft_prompt || item.seed || '';
    if (!prompt) { skip++; continue; }
    payloadItems.push({type: item._type, name: item.name, prompt, image_paths: []});
  }
  if (payloadItems.length) {
    progress.textContent = `批量重试提交中 ${payloadItems.length} 个任务（后端最多3个并发）`;
    try {
      const data = await submitBatchItems(payloadItems);
      ({ok, fail} = summarizeBatchResults(data.results || []));
    } catch(e) {
      fail = payloadItems.length;
      showToast(e.message || '批量重试失败', 'error');
    }
  }
  progress.textContent = `重试请求结束：成功 ${ok}/${items.length}${fail > 0 ? ` · 失败 ${fail}` : ''}${skip > 0 ? ` · 跳过 ${skip}` : ''} · 等待生成结果`;
  state.batchRunning = false;
  updateToolbarButtons();
  showToast(`重试完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}${skip > 0 ? `，${skip} 跳过` : ''}`, fail > 0 ? 'error' : 'success');
  });
}

function statusClass(s) {
  if (s === 'completed') return 'done';
  if (s === 'submitted') return 'progress';
  if (s === 'failed') return 'failed';
  return '';
}
function statusIcon(s) {
  const icons = {
    completed: '<i data-lucide="check" class="lucide-sm"></i>',
    submitted: '<i data-lucide="loader" class="lucide-sm" style="animation:spin 0.8s linear infinite"></i>',
    failed: '<i data-lucide="x" class="lucide-sm"></i>',
    unplanned: '<i data-lucide="circle" class="lucide-sm"></i>',
    planned: '<i data-lucide="list-checks" class="lucide-sm"></i>',
    locked: '<i data-lucide="lock" class="lucide-sm"></i>',
    needed: '<i data-lucide="circle" class="lucide-sm"></i>',
    drafted: '<i data-lucide="minus" class="lucide-sm"></i>',
  };
  return icons[s] || '<i data-lucide="minus" class="lucide-sm"></i>';
}

function renderStoryboardDetail(container, key) {
  const ver = state.activeBoardVersion;
  const scene = getActiveScene(key);
  // 元信息从各版本任取一个（scene_location/characters等在各版本中一致）
  const anyScene = scene || Object.values(state.pipeline?.storyboards || {}).filter(v => v && typeof v === 'object').map(v => v[key]).find(Boolean) || {};

  container.innerHTML = `<span class="back-link" onclick="state.selectedScene=null;renderMainArea()">&larr; 返回总览</span>
    <h2>${anyScene.script_title || key} <span class="ver-badge">${ver}</span></h2>`;

  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) {
    container.innerHTML += `<div class="block-banner">无法提交故事板：${dep.storyboardReason}</div>`;
  }

  if (!scene) {
    container.innerHTML += `<div class="empty-state">版本 ${ver} 无此场景</div>`;
    return;
  }

  const blockedAttr = dep.storyboardBlocked ? ' disabled' : '';
  const boards = getSceneBoards(scene);
  const analysis = scene.scene_analysis || {};
  const analysisText = Object.keys(analysis).length ? JSON.stringify(analysis, null, 2) : '尚未生成';
  const planningSection = document.createElement('div');
  planningSection.className = 'stage-section';
  planningSection.innerHTML = `<h3>故事板规划</h3>
    <div class="card-seed" style="white-space:pre-wrap;margin-bottom:10px">${analysisText}</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="analyzeScene('${key}', this)"${blockedAttr}>生成导演分析</button>
      <button class="btn btn-secondary" onclick="planSceneStoryboards('${key}', this)"${blockedAttr}>生成 ${ver} 规划</button>
      <button class="btn btn-primary" onclick="lockScenePlan('${key}', this)"${boards.length ? '' : ' disabled'}>锁定规划</button>
    </div>`;
  container.appendChild(planningSection);

  if (!boards.length) {
    container.innerHTML += `<div class="empty-state">当前场景尚未规划故事板。</div>`;
    return;
  }

  for (const board of boards) {
    const boardId = board.board_id || '';
    const domId = boardDomId(board);
    const boardStatus = board.status || 'needed';
    if (boardStatus === 'completed') {
      const imgPath = boardImagePath(ver, key, board);
      const imgUrl = `/api/asset-file?project_path=${encodeURIComponent(state.projectPath)}&file_path=${encodeURIComponent(imgPath)}`;
      const imgWrap = document.createElement('div');
      imgWrap.style = 'position:relative;display:inline-block;margin-bottom:12px;';

    }

    const section = document.createElement('div');
    section.className = 'stage-section';
    const pageText = board.total_pages ? `第${board.page || 1}/共${board.total_pages}张` : `第${board.page || 1}张`;
    const meta = `${pageText} · ${board.layout || ver} · ${board.shot_count || '-'}镜头${board.estimated_duration ? ` · ${board.estimated_duration}s` : ''}`;
    const refs = boardAssetRefs(scene, board);
    const refsText = `角色：${(refs.characters || []).join('、') || '-'} · 场景：${refs.scene || '-'} · 道具：${(refs.props || []).join('、') || '-'}`;
    const canGenerate = boardStatus === 'locked' && !dep.storyboardBlocked;
    const canSubmit = boardStatus === 'drafted' && !dep.storyboardBlocked;
    section.innerHTML = `<h3>故事板提示词草稿 (${ver} · ${meta} · ${boardStatus})</h3>
      <div class="meta-line" style="margin-bottom:8px">${refsText}</div>
      <div class="card-seed" style="white-space:pre-wrap;margin-bottom:8px">${board.prompt_seed || ''}</div>
      <textarea class="prompt-editor" id="board-prompt-${domId}">${board.draft_prompt || ''}</textarea>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="generateBoardPrompt('${key}', '${boardId}', this)"${canGenerate ? '' : ' disabled'}>生成最终提示词</button>
        <button class="btn btn-primary" onclick="submitBoard('${key}', '${boardId}', this)"${canSubmit ? '' : ' disabled'}>提交故事板</button>
      </div>`;
    container.appendChild(section);
  }
}

function renderVideoDetail(container, key) {
  const ver = state.activeBoardVersion;
  const scene = getActiveScene(key);
  const anyScene = scene || Object.values(state.pipeline?.storyboards || {}).filter(v => v && typeof v === 'object').map(v => v[key]).find(Boolean) || {};

  container.innerHTML = `<span class="back-link" onclick="state.selectedScene=null;renderMainArea()">&larr; 返回总览</span>
    <h2>${anyScene.script_title || key} — 视频 <span class="ver-badge">${ver}</span></h2>`;

  if (!scene) {
    container.innerHTML += `<div class="block-banner">当前版本无此场景。</div>`;
    return;
  }

  for (const board of getSceneBoards(scene)) {
    const boardId = board.board_id || '';
    const domId = boardDomId(board);
    const boardTitle = board.total_pages ? `第${board.page || 1}/共${board.total_pages}张` : `第${board.page || 1}张`;
    const section = document.createElement('div');
    section.className = 'stage-section';
    section.innerHTML = `<h3>${boardTitle} · ${board.layout || ver}</h3>`;
    if (board.status !== 'completed') {
      section.innerHTML += `<div class="block-banner">这张故事板尚未完成，无法生成视频。</div>`;
      container.appendChild(section);
      continue;
    }
    const parts = board.video_parts || [];
    if (parts.length === 0) {
      section.innerHTML += `<div class="btn-row"><button class="btn btn-secondary" onclick="generateVideoPrompts('${key}', '${boardId}', this)">生成视频提示词（AI拆分）</button></div>`;
      container.appendChild(section);
      continue;
    }
    for (const part of parts) {
      const vStatus = part.video_status || 'needed';
      const videoUrl = part.local_path
        ? `/api/asset-file?project_path=${encodeURIComponent(state.projectPath)}&file_path=${encodeURIComponent(part.local_path)}`
        : part.video_url || '';
      section.innerHTML += `
        <div class="video-part-card">
          <div class="part-header">Part ${part.part} [${statusIcon(vStatus)} ${vStatus}]${part.duration ? ` ${part.duration}s` : ''}</div>
          ${taskMetaHtml(part, 'video_status', 'video_task_id')}
          ${videoUrl ? `<video src="${videoUrl}" controls style="width:100%;max-height:300px;border-radius:8px;margin-bottom:8px;"></video>` : ''}
          <textarea class="prompt-editor" id="video-prompt-${domId}-${part.part}" style="min-height:80px">${part.draft_prompt || part.prompt || ''}</textarea>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="submitVideoPart('${key}', '${boardId}', ${part.part}, this)">提交视频</button>
            ${videoUrl ? `<a href="${videoUrl}" target="_blank" class="btn btn-secondary">下载</a>` : ''}
          </div>
        </div>`;
    }
    container.appendChild(section);
  }
}

// ── 批量版本操作 ──
async function batchGenBoardPrompts(btn = null) {
  return runLockedAction(`batch-generate-board-prompts-${state.activeBoardVersion}`, btn, '生成中...', async () => {
  if (state.batchRunning) return;
  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) { alert('前置条件未满足：' + dep.storyboardReason); return; }
  const ver = state.activeBoardVersion;
  const scenes = ver ? (state.pipeline?.storyboards?.[ver] || {}) : {};
  const items = [];
  for (const [key, scene] of Object.entries(scenes)) {
    if (!scene || typeof scene !== 'object') continue;
    for (const board of getSceneBoards(scene)) {
      if (!board.draft_prompt && (board.status || 'unplanned') === 'locked') {
        items.push({key, scene, board});
      }
    }
  }
  if (items.length === 0) { showToast('没有需要生成提示词的场景', 'info'); return; }
  state.batchRunning = true;
  renderVersionPanel();
  let ok = 0, fail = 0;
  try {
    const payloadItems = items.map(item => ({
      type: 'storyboard',
      scene_key: item.key,
      board_version: ver,
      board_id: item.board.board_id || undefined,
      script_segment: item.board.covered_text || item.scene.script_segment || '',
    }));
    const resp = await fetch('/api/prompts/batch-generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_path: state.projectPath, items: payloadItems})
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.detail || '批量生成失败');
    }
    const data = await resp.json();
    const results = data.results || [];
    ok = results.filter(r => r.ok).length;
    fail = results.length - ok;
    for (const r of results) {
      if (!r.ok) showToast(`${r.name || '故事板'}: ${r.error || '生成失败'}`, 'error');
    }
  } catch(e) {
    fail = items.length;
    showToast(e.message || '批量生成失败', 'error');
  }
  await refreshStatus();
  state.batchRunning = false;
  renderVersionPanel();
  showToast(`提示词生成完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
  });
}

async function batchSubmitBoards(btn = null) {
  return runLockedAction(`batch-submit-boards-${state.activeBoardVersion}`, btn, '提交中...', async () => {
  if (state.batchRunning) return;
  const dep = getDependencyInfo();
  if (dep.storyboardBlocked) { alert('前置条件未满足：' + dep.storyboardReason); return; }
  const ver = state.activeBoardVersion;
  const scenes = ver ? (state.pipeline?.storyboards?.[ver] || {}) : {};
  const items = [];
  for (const [key, scene] of Object.entries(scenes)) {
    if (!scene || typeof scene !== 'object') continue;
    for (const board of getSceneBoards(scene)) {
      const status = board.status || 'needed';
      if (board.draft_prompt && status === 'drafted') {

    }

  if (items.length === 0) { showToast('没有可提交的故事板', 'info'); return; }

  let ok = 0, fail = 0;
  const payloadItems = items.map(item => {

      type: 'storyboard',
      scene_key: item.key,
      board_id: item.board.board_id || undefined,
      prompt: item.board.draft_prompt,
      image_paths: imagePaths,
      board_version: ver,
    };
  });
  try {
    showToast(`正在批量提交 ${items.length} 张板图（后端最多3个并发）`, 'info');
    const data = await submitBatchItems(payloadItems);

  await refreshStatus();
  state.batchRunning = false;
  renderVersionPanel();
  showToast(`板图提交完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');

async function batchSubmitVideos(btn = null) {
  return runLockedAction(`batch-submit-videos-${state.activeBoardVersion}`, btn, '提交中...', async () => {
  if (state.batchRunning) return;
  const ver = state.activeBoardVersion;
  const scenes = ver ? (state.pipeline?.storyboards?.[ver] || {}) : {};
  const items = [];
  for (const [key, scene] of Object.entries(scenes)) {
    if (!scene || typeof scene !== 'object') continue;
    for (const board of getSceneBoards(scene)) {
      if (board.status !== 'completed') continue;
      for (const part of (board.video_parts || [])) {
        if ((part.video_status === 'needed' || part.video_status === 'drafted') && (part.draft_prompt || part.prompt)) {
          const imagePaths = assetRefImagePaths(scene, board);
          imagePaths.push(boardImagePath(ver, key, board));
          items.push({key, board, part, prompt: part.draft_prompt || part.prompt, imagePaths});
        }
      }
    }
  }
  if (items.length === 0) { showToast('没有可提交的视频', 'info'); return; }
  state.batchRunning = true;
  renderVersionPanel();
  let ok = 0, fail = 0;
  const payloadItems = items.map(item => ({
    type: 'video',
    scene_key: item.key,
    board_id: item.board.board_id || undefined,
    part: item.part.part,
    prompt: item.prompt,
    image_paths: item.imagePaths,
    duration: item.part.duration || 10,
    board_version: ver,
  }));
  try {
    showToast(`正在批量提交 ${items.length} 个视频任务（后端最多3个并发）`, 'info');
    const data = await submitBatchItems(payloadItems);
    ({ok, fail} = summarizeBatchResults(data.results || []));
  } catch(e) {
    fail = items.length;
    showToast(e.message || '视频批量提交失败', 'error');
  }
  await refreshStatus();
  state.batchRunning = false;
  renderVersionPanel();
  showToast(`视频提交完毕：${ok} 成功${fail > 0 ? `，${fail} 失败` : ''}`, fail > 0 ? 'error' : 'success');
  });
}
