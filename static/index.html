}

function setSettingsClearState(key, enabled, cleared = false) {
  const btn = getSettingsClearButton(key);
  if (!btn) return;
  btn.disabled = !enabled;
  btn.dataset.cleared = cleared ? 'true' : 'false';
  btn.setAttribute('aria-pressed', cleared ? 'true' : 'false');
}

function markSettingForClear(key) {
  const field = SETTINGS_SECRET_FIELDS.find(item => item.key === key);
  if (!field) return;
  const input = document.getElementById(field.inputId);
  if (input) {
    input.value = '';
    input.placeholder = '保存后清空';
  }
  setSettingsClearState(key, true, true);
}

async function openSettings() {
  try {
    const resp = await fetch('/api/settings');
    const s = await resp.json();
    SETTINGS_SECRET_FIELDS.forEach(field => {
      const input = document.getElementById(field.inputId);
      const hasValue = field.key === 'gh_token' ? Boolean(s.gh_token) : Boolean(s[field.hasKey]);
      if (input) {
        input.value = '';
        input.placeholder = hasValue ? s[field.key] : field.placeholder;
      }
      setSettingsClearState(field.key, hasValue, false);
    });
    document.getElementById('set-idealab-url').value = s.idealab_base_url || '';
    document.getElementById('set-github-owner').value = s.gh_owner || '';
    document.getElementById('set-github-repo').value = s.gh_repo || '';
  } catch(e) {}
  document.getElementById('settings-overlay').classList.add('visible');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('visible');
}

async function saveSettings() {
  const body = {};
  const url = document.getElementById('set-idealab-url').value.trim();
  const githubOwner = document.getElementById('set-github-owner').value.trim();
  const githubRepo = document.getElementById('set-github-repo').value.trim();
  SETTINGS_SECRET_FIELDS.forEach(field => {
    const value = document.getElementById(field.inputId).value.trim();
    const clearBtn = getSettingsClearButton(field.key);
    if (value) body[field.key] = value;
    else if (clearBtn?.dataset.cleared === 'true') body[field.key] = '';
  });
  if (url) body.idealab_base_url = url;
  body.gh_owner = githubOwner;
  body.gh_repo = githubRepo;
  try {
    const resp = await fetch('/api/settings', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (resp.ok) { closeSettings(); showToast('设置已保存', 'success'); }
    else {
      let detail = resp.status;
      try { const e = await resp.json(); detail = e.detail || JSON.stringify(e); } catch(_){}
      showToast('保存失败：' + detail, 'error');
    }
  } catch(e) { showToast('保存失败：' + e.message, 'error'); }
}

// ── 助手面板 ──
function openAgentPanel() {
  const panel = document.getElementById('agent-panel');
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  document.getElementById('agent-fab').classList.add('hidden');
}
function closeAgentPanel() {
  const panel = document.getElementById('agent-panel');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  document.getElementById('agent-fab').classList.remove('hidden');
}
function clearAgentHistory() {
  state.chatHistory = [];
  document.getElementById('agent-messages').replaceChildren();
}

async function sendAgentMessage() {
  const input = document.getElementById('agent-input');
  const msg = input.value.trim();
  if (!msg || !state.projectPath) return;
  input.value = '';
  input.disabled = true;
  document.getElementById('agent-send').disabled = true;

  appendAgentMsg('user', msg);
  state.chatHistory.push({role: 'user', content: msg});

  const thinkingEl = appendAgentThinking();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_path: state.projectPath,
        message: msg,
        history: state.chatHistory.slice(-20),
        current_scene_key: state.selectedScene,
      })
    });
    const data = await resp.json();
    thinkingEl.remove();

    for (const t of (data.tool_results || [])) {
      appendAgentTool(t.label, t.ok !== false);
    }

    if (data.reply) {
      appendAgentMsg('assistant', data.reply);
      state.chatHistory.push({role: 'assistant', content: data.reply});
    }

    if (data.has_writes) await refreshStatus();
  } catch(e) {
    thinkingEl.remove();
    appendAgentMsg('assistant', '请求失败：' + e.message);
  }

  input.disabled = false;
  document.getElementById('agent-send').disabled = false;
  input.focus();
}

function appendAgentMsg(role, text) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'amsg-user' : 'amsg-assistant';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  lucide.createIcons();
  return div;
}

function appendAgentTool(label, ok) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-tool' + (ok ? ' ok' : ' fail');
  const dot = document.createElement('span');
  dot.className = 'tool-dot';
  const text = document.createElement('span');
  text.textContent = label;
  div.append(dot, text);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  lucide.createIcons();
}

function appendAgentThinking() {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'amsg-thinking';
  const dots = document.createElement('span');
  dots.className = 'dots';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    dot.textContent = '●';
    dots.appendChild(dot);
  }
  div.appendChild(dots);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showToast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, duration);
}

let _confirmResolve = null;
function confirmAction({title = '确认操作', message = '', confirmLabel = '确认'} = {}) {
  const overlay = document.getElementById('confirm-overlay');
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-ok-btn').textContent = confirmLabel;
  overlay.classList.add('visible');
  document.getElementById('confirm-cancel-btn').focus();
  return new Promise(resolve => {
    _confirmResolve = resolve;
  });
}

function closeConfirm(result) {
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.remove('visible');
  if (_confirmResolve) {
    _confirmResolve(result);
    _confirmResolve = null;
  }
}

function showError(msg) {
  const gridArea = document.getElementById('grid-area');
  const detailPanel = document.getElementById('detail-panel');
  const emptyHint = document.getElementById('empty-hint');
  const toolbar = document.getElementById('batch-toolbar');
  gridArea.classList.remove('visible');
  detailPanel.classList.remove('visible');
  toolbar.classList.remove('visible');
  emptyHint.style.display = 'none';
  detailPanel.classList.add('visible');
  const error = document.createElement('div');
  error.className = 'error-banner';
  error.textContent = msg;
  detailPanel.replaceChildren(error);
}

// ── 导入对话框 ──
let _importParsedData = null;  // 解析预览结果缓存

async function openImportDialog() {
  _importParsedData = null;
  document.getElementById('import-preview').style.display = 'none';
  document.getElementById('import-error').classList.add('hidden');
  document.getElementById('import-confirm-btn').disabled = true;
  document.getElementById('import-path').value = '';
  document.getElementById('import-name').value = '';

  // 填充路径历史 datalist
  _fillPathHistory();

  // 加载最近项目列表
  await _loadRecentProjects();

  // 如果已有项目，允许取消
  document.getElementById('import-cancel-btn').style.display =
    state.projectPath ? '' : 'none';

  document.getElementById('import-overlay').classList.add('visible');
}

function closeImportDialog() {
  document.getElementById('import-overlay').classList.remove('visible');
}

function _readPathHistory() {
  try {
    const raw = localStorage.getItem('manhua_path_history');
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(path => typeof path === 'string' && path.trim()).slice(0, 10);
  } catch(e) {
    try { localStorage.removeItem('manhua_path_history'); } catch(_) {}
    return [];
  }
}

function _fillPathHistory() {
  const history = _readPathHistory();
  const dl = document.getElementById('import-path-history');
  dl.replaceChildren();
  for (const path of history) {
    const option = document.createElement('option');
    option.value = path;
    dl.appendChild(option);
  }
}

function _savePathHistory(path) {
  const normalizedPath = path.trim();
  if (!normalizedPath) return;
  const history = [normalizedPath, ..._readPathHistory().filter(p => p !== normalizedPath)].slice(0, 10);
  try {
    localStorage.setItem('manhua_path_history', JSON.stringify(history));
  } catch(e) {
    // 路径历史只是便利功能，保存失败不应阻断项目导入。
  }
}

async function _loadRecentProjects() {
  const list = document.getElementById('import-recent-list');
  const section = document.getElementById('import-recent-section');
  const loading = document.createElement('span');
  loading.className = 'recent-loading';
  loading.textContent = '加载中...';
  list.replaceChildren(loading);
  try {
    const resp = await fetch('/api/project/list-recent');
    const data = await resp.json();
    if (!data.projects || data.projects.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = '';
    list.replaceChildren();
    for (const project of data.projects) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'recent-project-item';
      item.addEventListener('click', () => { loadProject(project.path); closeImportDialog(); });
      const name = document.createElement('span');
      name.className = 'rp-name';
      name.textContent = project.name;
      const path = document.createElement('span');
      path.className = 'rp-path';
      path.title = project.path;
      path.textContent = project.path;
      item.append(name, path);
      list.appendChild(item);
    }
  } catch(e) {
    section.style.display = 'none';
  }
  lucide.createIcons();
}

// 路径输入时自动填充项目名
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('import-path').addEventListener('input', function() {
    const p = this.value.trim();
    if (!p) return;
    const name = p.split(/[/\\]/).filter(Boolean).pop() || '';
    const nameInput = document.getElementById('import-name');
    if (!nameInput.dataset.userEdited) nameInput.value = name;
  });
  document.getElementById('import-name').addEventListener('input', function() {
    this.dataset.userEdited = this.value ? '1' : '';
  });
});

async function doParsePreview() {
  const inputDir = document.getElementById('import-path').value.trim();
  const projectName = document.getElementById('import-name').value.trim();
  const errDiv = document.getElementById('import-error');
  const previewDiv = document.getElementById('import-preview');
  const confirmBtn = document.getElementById('import-confirm-btn');

  errDiv.classList.add('hidden');
  previewDiv.style.display = 'none';
  confirmBtn.disabled = true;
  _importParsedData = null;

  if (!inputDir) { errDiv.textContent = '请输入目录路径'; errDiv.classList.remove('hidden'); return; }
  if (!projectName) { errDiv.textContent = '请输入项目名称'; errDiv.classList.remove('hidden'); return; }

  const parseBtn = document.getElementById('import-parse-btn');
  parseBtn.disabled = true;
  parseBtn.textContent = '解析中...';

  try {
    const resp = await fetch('/api/project/parse', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({input_dir: inputDir, project_name: projectName})
    });
    const data = await resp.json();
    if (!resp.ok) {
      errDiv.textContent = data.detail || '解析失败';
      errDiv.classList.remove('hidden');
      return;
    }
    _importParsedData = data;
    const s = data.stats;
    previewDiv.replaceChildren();
    const title = document.createElement('strong');
    title.className = 'import-preview-title';
    title.textContent = '解析完成';
    const counts = document.createElement('div');
    counts.textContent = `角色：${s.characters} 个　场景：${s.scenes} 个　道具：${s.props} 个　故事板条目：${s.storyboards} 个`;
    const path = document.createElement('span');
    path.className = 'import-preview-path';
    path.textContent = `pipeline.json 已写入：${data.input_dir}`;
    previewDiv.append(title, document.createElement('br'), counts, path);
    previewDiv.style.display = '';
    confirmBtn.disabled = false;
    lucide.createIcons();
  } catch(e) {
    errDiv.textContent = '请求失败：' + e.message;
    errDiv.classList.remove('hidden');
  } finally {
    parseBtn.disabled = false;
    parseBtn.textContent = '解析预览';
  }
}

async function doImportConfirm() {
  if (!_importParsedData) return;
  _savePathHistory(_importParsedData.input_dir);
  closeImportDialog();
  await loadProject(_importParsedData.input_dir);
}

function openLightbox(url) {
  let lb = document.getElementById('lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'lightbox';
    const img = document.createElement('img');
    img.id = 'lightbox-img';
    img.alt = '预览大图';
    lb.appendChild(img);
    lb.addEventListener('click', () => lb.classList.remove('visible'));
    document.body.appendChild(lb);
  }
  document.getElementById('lightbox-img').src = url;
  lb.classList.add('visible');
}

function bindStaticEvents() {
  document.getElementById('project-meta').addEventListener('click', openImportDialog);
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('btn-batch-gen').addEventListener('click', batchGeneratePrompts);
  document.getElementById('btn-batch-submit').addEventListener('click', batchSubmitAll);
  document.getElementById('btn-batch-retry').addEventListener('click', batchRetryFailed);
  document.getElementById('settings-overlay').addEventListener('click', event => {
    if (event.target === event.currentTarget) closeSettings();
  });
  document.getElementById('settings-cancel-btn').addEventListener('click', closeSettings);
  document.getElementById('settings-save-btn').addEventListener('click', saveSettings);
  document.querySelectorAll('.settings-clear-btn').forEach(btn => {
    btn.addEventListener('click', () => markSettingForClear(btn.dataset.settingClear));
  });
  document.getElementById('import-cancel-btn').addEventListener('click', closeImportDialog);
  document.getElementById('import-parse-btn').addEventListener('click', doParsePreview);
  document.getElementById('import-confirm-btn').addEventListener('click', doImportConfirm);
  document.getElementById('agent-clear').addEventListener('click', clearAgentHistory);
  document.getElementById('agent-close').addEventListener('click', closeAgentPanel);
  document.getElementById('agent-fab').addEventListener('click', openAgentPanel);
  document.getElementById('agent-send').addEventListener('click', sendAgentMessage);
  document.getElementById('agent-input').addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendAgentMessage();
    }
  });
  document.querySelectorAll('.phase-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.currentPhase = tab.dataset.phase;
      state.selectedScene = null;
      renderAll();
    });
  });
  document.getElementById('confirm-cancel-btn').addEventListener('click', () => closeConfirm(false));
  document.getElementById('confirm-ok-btn').addEventListener('click', () => closeConfirm(true));
  document.getElementById('confirm-overlay').addEventListener('click', event => {
    if (event.target === event.currentTarget) closeConfirm(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (document.getElementById('confirm-overlay').classList.contains('visible')) closeConfirm(false);
      else if (document.getElementById('settings-overlay').classList.contains('visible')) closeSettings();
      else if (document.getElementById('import-overlay').classList.contains('visible') && state.projectPath) closeImportDialog();
      else if (document.getElementById('agent-panel').classList.contains('open')) closeAgentPanel();
    }
  });
}

bindStaticEvents();
init();
</script>
